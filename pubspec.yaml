name: lefferion_prime_mizan
description: LEFFERION PRIME - MIZAN kişisel borç, ödeme ve gider takip uygulaması.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  csv: ^7.1.0
  file_picker: 11.0.3
  pdf: ^3.13.0
  printing: ^5.15.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  crypto: ^3.0.7
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/lefferion-prime-logo-v3.png
    - assets/data/languages_v1.json
    - assets/data/countries_v1.json
    - assets/data/currencies_v1.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/lefferion-prime-logo-v3.png
  adaptive_icon_foreground: assets/brand/lefferion-prime-logo-v3-foreground.png
  adaptive_icon_background: "#06363B"
  min_sdk_android: 24
