<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="2048"
     height="2048"
     viewBox="0 0 2048 2048"
     fill="none">
  <defs>
    <linearGradient id="midnightEmerald" x1="290" y1="245" x2="1750" y2="1815" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B5551"/>
      <stop offset="0.48" stop-color="#06363B"/>
      <stop offset="1" stop-color="#031D28"/>
    </linearGradient>
    <linearGradient id="champagneBorder" x1="250" y1="220" x2="1800" y2="1830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F1D99B"/>
      <stop offset="0.52" stop-color="#B98445"/>
      <stop offset="1" stop-color="#E5BF77"/>
    </linearGradient>
    <linearGradient id="platinum" x1="610" y1="505" x2="1050" y2="1550" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="0.55" stop-color="#D9DBD6"/>
      <stop offset="1" stop-color="#F0ECE1"/>
    </linearGradient>
    <linearGradient id="champagne" x1="940" y1="560" x2="1510" y2="1470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3D794"/>
      <stop offset="0.5" stop-color="#C69752"/>
      <stop offset="1" stop-color="#E2B970"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="218" y="218" width="1612" height="1612" rx="344"/>
    </clipPath>
  </defs>

  <!-- Filled LEFFERION PRIME badge; the canvas outside remains transparent. -->
  <rect x="218" y="218" width="1612" height="1612" rx="344"
        fill="url(#midnightEmerald)"
        stroke="url(#champagneBorder)"
        stroke-width="30"/>
  <rect x="250" y="250" width="1548" height="1548" rx="316"
        stroke="#5BA69A"
        stroke-opacity="0.28"
        stroke-width="6"/>

  <!-- One restrained facet gives depth without visual noise or blur. -->
  <g clip-path="url(#badgeClip)" opacity="0.14">
    <path d="M 110 1510 C 485 1170 820 1140 1110 855
             C 1380 590 1590 430 1940 330
             V 700 C 1640 790 1450 935 1240 1140
             C 915 1460 535 1480 110 1825 Z"
          fill="#2B9B91"/>
  </g>

  <!-- Custom platinum L: broad, optically rounded and legible at 24 px. -->
  <path d="M 574 500 H 820 V 1258
           C 820 1327 858 1366 929 1366
           H 1260 V 1550 H 868
           C 682 1550 574 1442 574 1276 Z"
        fill="url(#platinum)"/>

  <!-- Custom champagne P: its stem locks into the L base without hiding either letter. -->
  <path fill-rule="evenodd" clip-rule="evenodd"
        d="M 916 576 H 1257
           C 1464 576 1572 700 1572 870
           C 1572 1040 1464 1162 1257 1162
           H 1114 V 1438 H 916 Z

           M 1114 766 V 974 H 1238
           C 1325 974 1372 935 1372 869
           C 1372 803 1325 766 1238 766 Z"
        fill="url(#champagne)"/>

  <!-- Separation at the interlock keeps LP readable when rasterized small. -->
  <path d="M 1114 1366 H 1260 V 1382 H 1114 Z"
        fill="#8C663C"
        fill-opacity="0.42"/>
</svg>
