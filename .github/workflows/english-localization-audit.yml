name: English localization and APK audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout materialized English candidate
        uses: actions/checkout@v5
        with:
          ref: agent/english-localization-candidate

      - name: Verify English source is materialized
        run: |
          test -f lib/l10n/mizan_i18n.dart
          test -f tools/validate_english_localization.py

      - name: Validate English fixed-copy coverage
        run: python3 tools/validate_english_localization.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: English acceptance tests
        run: |
          flutter test --reporter expanded \
            test/english_localization_test.dart \
            test/global_setup_test.dart \
            test/local_store_test.dart \
            test/csv_backup_test.dart \
            test/reminder_engine_test.dart \
            test/report_service_test.dart \
            test/pdf_report_test.dart \
            test/notification_migration_test.dart \
            test/notification_background_reliability_test.dart

      - name: Compare deterministic visual baselines
        run: flutter test test/visual_capture_test.dart

      - name: Full regression tests
        run: flutter test --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal APK
        run: |
          mkdir -p audit/apks/universal
          cp build/app/outputs/flutter-apk/app-release.apk audit/apks/universal/mizan-global-english-universal.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Preserve split APKs and generate size report
        run: |
          set -euo pipefail
          mkdir -p audit/apks/split
          cp build/app/outputs/flutter-apk/app-*-release.apk audit/apks/split/
          {
            echo "Audited source commit: $(git rev-parse HEAD)"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo
            echo "Exact byte sizes:"
            find audit/apks -type f -name '*.apk' -print0 | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo
            echo "SHA-256:"
            sha256sum audit/apks/universal/*.apk audit/apks/split/*.apk
          } | tee audit/apk-size-report.txt

      - name: Upload verified English APKs and size report
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-english-release-apks-manual
          path: audit/
          if-no-files-found: error
          retention-days: 14
