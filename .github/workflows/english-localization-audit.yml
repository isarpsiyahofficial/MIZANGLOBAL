name: English localization and APK audit

on:
  push:
    branches:
      - agent/english-localization-candidate
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english-localization-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis before localization
        run: flutter analyze --fatal-warnings

      - name: Run existing tests before localization
        run: |
          flutter test --update-goldens test/visual_capture_test.dart
          flutter test --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal APK
        run: |
          mkdir -p audit/apks/universal
          cp build/app/outputs/flutter-apk/app-release.apk audit/apks/universal/mizan-global-universal-release.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Preserve split APKs and generate size report
        run: |
          set -euo pipefail
          mkdir -p audit/apks/split
          cp build/app/outputs/flutter-apk/app-*-release.apk audit/apks/split/
          {
            echo "Commit: $GITHUB_SHA"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo
            echo "Byte sizes:"
            find audit/apks -type f -name '*.apk' -print0 | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo
            echo "Human-readable sizes:"
            du -h audit/apks/universal/*.apk audit/apks/split/*.apk
            echo
            echo "SHA-256:"
            sha256sum audit/apks/universal/*.apk audit/apks/split/*.apk
            echo
            echo "Universal APK largest entries:"
            unzip -l audit/apks/universal/mizan-global-universal-release.apk | sort -nr -k1 | head -n 40
          } | tee audit/apk-size-report.txt

      - name: Package exact source snapshot
        run: |
          tar --exclude=.git --exclude=.dart_tool --exclude=build --exclude=audit -czf audit-source-snapshot.tar.gz .
          sha256sum audit-source-snapshot.tar.gz | tee audit-source-snapshot.sha256

      - name: Upload APK audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-apk-size-audit
          path: audit/
          if-no-files-found: error
          retention-days: 14

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-english-source-snapshot
          path: |
            audit-source-snapshot.tar.gz
            audit-source-snapshot.sha256
          if-no-files-found: error
          retention-days: 14
