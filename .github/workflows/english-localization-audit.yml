name: English localization and APK audit

on:
  push:
    branches:
      - agent/english-localization-candidate
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english-localization-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
        with:
          ref: agent/english-localization-candidate
          fetch-depth: 0

      - name: Apply SHA-verified English localization patches when missing
        run: |
          set -euo pipefail
          if test -f lib/l10n/mizan_i18n.dart; then
            echo "English localization patch is already present."
            exit 0
          fi
          git fetch origin agent/english-localization-transfer
          : > /tmp/english_localization.b64
          for n in 00 01 02 03; do
            git show "origin/agent/english-localization-transfer:transfer/english/v2/english.part${n}" >> /tmp/english_localization.b64
          done
          tr -d '\r\n\t ' < /tmp/english_localization.b64 > /tmp/english_localization.compact.b64
          base64 --decode /tmp/english_localization.compact.b64 > /tmp/english_localization.patch.gz
          echo "6081c7bb86cd4c5c8d49ae32fc33e5e6ccf99529ffe67dff786030233395a684  /tmp/english_localization.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/english_localization.patch.gz > /tmp/english_localization.patch
          echo "d23f526aa61e01cdbb15f3a04c8947f814a144ef850f02c738052b26dee41b6c  /tmp/english_localization.patch" | sha256sum -c -
          git apply --check /tmp/english_localization.patch
          git apply /tmp/english_localization.patch

          git show "origin/agent/english-localization-transfer:transfer/english/v2/acceptance-fixes.b64" \
            | tr -d '\r\n\t ' \
            | base64 --decode > /tmp/english_acceptance_fixes.patch.gz
          echo "d9e20d5d88bb77d04da2deaa58f2c73467aff24de634d7000badb9e402ab7829  /tmp/english_acceptance_fixes.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/english_acceptance_fixes.patch.gz > /tmp/english_acceptance_fixes.patch
          echo "11431e3571787077588d18da44286289b21150eb65913385b6e6e6da2e339cb5  /tmp/english_acceptance_fixes.patch" | sha256sum -c -
          git apply --check /tmp/english_acceptance_fixes.patch
          git apply /tmp/english_acceptance_fixes.patch

          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/formatters.dart')
          text = path.read_text()
          replacements = [
              (
                  "    if (remaining > 0 && remaining % 3 == 0) grouped.write(groupSeparator);",
                  "    if (remaining > 0 && remaining % 3 == 0) {\n      grouped.write(groupSeparator);\n    }",
                  1,
              ),
              (
                  "  if (!MizanI18n.isEnglish && code == 'TRY') return '$amount TL';",
                  "  if (!MizanI18n.isEnglish && code == 'TRY') {\n    return '$amount TL';\n  }",
                  1,
              ),
              (
                  "  if (clean.isEmpty) return null;",
                  "  if (clean.isEmpty) {\n    return null;\n  }",
                  1,
              ),
              (
                  "  if (days == 0) return MizanI18n.text('Son ödeme bugün');",
                  "  if (days == 0) {\n    return MizanI18n.text('Son ödeme bugün');\n  }",
                  2,
              ),
              (
                  "  if (days > 0) return MizanI18n.isEnglish ? '$days days remaining' : '$days gün kaldı';",
                  "  if (days > 0) {\n    return MizanI18n.isEnglish ? '$days days remaining' : '$days gün kaldı';\n  }",
                  1,
              ),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Validate English coverage before Flutter checks
        run: python3 tools/validate_english_localization.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Revalidate English coverage after formatting
        run: python3 tools/validate_english_localization.py

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: English UI report PDF notification and backup tests
        run: |
          flutter test --reporter expanded \
            test/english_localization_test.dart \
            test/global_setup_test.dart \
            test/local_store_test.dart \
            test/csv_backup_test.dart \
            test/reminder_engine_test.dart \
            test/report_service_test.dart \
            test/pdf_report_test.dart \
            test/notification_migration_test.dart \
            test/notification_background_reliability_test.dart

      - name: Refresh deterministic visual baselines
        run: flutter test --update-goldens test/visual_capture_test.dart

      - name: Full regression tests
        run: flutter test --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal APK
        run: |
          mkdir -p audit/apks/universal
          cp build/app/outputs/flutter-apk/app-release.apk audit/apks/universal/mizan-global-english-universal.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Preserve split APKs and generate size report
        run: |
          set -euo pipefail
          mkdir -p audit/apks/split
          cp build/app/outputs/flutter-apk/app-*-release.apk audit/apks/split/
          {
            echo "Commit before verified localization push: $GITHUB_SHA"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo
            echo "Exact byte sizes:"
            find audit/apks -type f -name '*.apk' -print0 | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo
            echo "Human-readable sizes:"
            du -h audit/apks/universal/*.apk audit/apks/split/*.apk
            echo
            echo "SHA-256:"
            sha256sum audit/apks/universal/*.apk audit/apks/split/*.apk
          } | tee audit/apk-size-report.txt

      - name: Commit verified English localization
        run: |
          set -euo pipefail
          git config user.name "MIZAN English Localization"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate complete English localization"
          git push origin HEAD:agent/english-localization-candidate

      - name: Upload verified English APKs and size report
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-english-release-apks
          path: audit/
          if-no-files-found: error
          retention-days: 14
