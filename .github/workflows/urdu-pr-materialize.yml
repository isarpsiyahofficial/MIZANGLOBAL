name: Urdu PR materialization

on:
  pull_request:
    branches: [main, agent/mizanglobal-globalization]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: urdu-pr-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/urdu-localization-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/urdu-localization-clean
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verify and extract reviewed Urdu source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/urdu-clean-payload/part-*.b64 | base64 --decode > "$RUNNER_TEMP/urdu_changes.tar.gz"
          echo "3a1c06e942a9967f4afa331fc1005ee847809dcd09471cd2e3a4b83ccc8b6c6e  $RUNNER_TEMP/urdu_changes.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/urdu_changes.tar.gz" -C .
          python tools/audit_urdu_native_copy.py
          rm -rf .github/urdu-clean-payload
          rm -f .github/workflows/urdu-clean-materialize.yml
          rm -f .github/workflows/urdu-clean-recovery.yml
          rm -f .github/workflows/urdu-final-repair.yml
          rm -f .github/workflows/urdu-finalize-controller.yml
          rm -f .github/workflows/urdu-materialization-trigger.yml
          rm -f .github/workflows/urdu-observable-materialize.yml
          git diff --check
      - name: Commit exact Urdu product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ur): add complete Urdu localization'
          git pull --rebase origin agent/urdu-localization-clean
          git push origin HEAD:agent/urdu-localization-clean
