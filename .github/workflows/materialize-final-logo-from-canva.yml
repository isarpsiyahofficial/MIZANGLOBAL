name: Materialize exact final LP logo

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/materialize-final-logo-from-canva.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact production branch
        uses: actions/checkout@v4
        with:
          ref: agent/mizan-production-release-20260905
          fetch-depth: 0

      - name: Fetch only a pixel-exact 2048 source
        env:
          EXPECTED_PIXEL_SHA: 59e6bc2a19714a9761cff46582b801b87136369f98ff9be215da4c24823748de
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p "$RUNNER_TEMP/mizan-logo-candidates"
          python3 - <<'PY' > "$RUNNER_TEMP/mizan-logo-candidates/urls.txt"
          base = 'https://media.canva.com/v2/image-resize/'
          body = 'format:PNG/height:2048/quality:100/uri:ifs%3A%2F%2FM%2F3a3d703b-e2fa-4c10-9d81-4e419641c1f8/watermark:F/width:2048'
          csig = 'csig=AAAAAAAAAAAAAAAAAAAAAKrZ3FWBpbN2GPJczQVg6yhZdKpiH-gLR9RMVHjL13kD'
          exp = 'exp=1788624733'
          osig = 'osig=AAAAAAAAAAAAAAAAAAAAAJ90ThAC_JUs0_NlqIPaN13EyYHMeTT87dGPM_nvSUsf'
          print(base + body + '?' + '&'.join((csig, exp, osig, 'signer=media-rpc', 'x-canva-quality=thumbnail')))
          print(base + body + '?' + '&'.join((csig, exp, 'signer=media-rpc')))
          print(base + body + '?' + '&'.join((csig, exp)))
          body2 = 'format:PNG/quality:100/uri:ifs%3A%2F%2FM%2F3a3d703b-e2fa-4c10-9d81-4e419641c1f8/watermark:F'
          print(base + body2 + '?' + '&'.join((csig, exp, osig, 'signer=media-rpc')))
          print(base + body2 + '?' + '&'.join((csig, exp, 'signer=media-rpc')))
          PY

          found=''
          i=0
          while IFS= read -r url; do
            i=$((i+1))
            out="$RUNNER_TEMP/mizan-logo-candidates/candidate-$i.png"
            if ! curl --fail --silent --show-error --location --max-time 30 "$url" -o "$out"; then
              continue
            fi
            if CANDIDATE="$out" python3 - <<'PY'
          from hashlib import sha256
          from PIL import Image
          import os
          path = os.environ['CANDIDATE']
          expected = os.environ['EXPECTED_PIXEL_SHA']
          try:
              with Image.open(path) as image:
                  rgba = image.convert('RGBA')
                  if rgba.size != (2048, 2048):
                      raise SystemExit(1)
                  actual = sha256(rgba.tobytes()).hexdigest()
                  if actual != expected:
                      raise SystemExit(1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              found="$out"
              break
            fi
          done < "$RUNNER_TEMP/mizan-logo-candidates/urls.txt"

          test -n "$found"
          cp "$found" assets/brand/lefferion-prime-logo-v3.png

      - name: Final exact-pixel gate before commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from PIL import Image
          path='assets/brand/lefferion-prime-logo-v3.png'
          with Image.open(path) as image:
              rgba=image.convert('RGBA')
              assert rgba.size == (2048, 2048)
              actual=sha256(rgba.tobytes()).hexdigest()
          expected='59e6bc2a19714a9761cff46582b801b87136369f98ff9be215da4c24823748de'
          assert actual == expected, (actual, expected)
          print(actual)
          PY

      - name: Commit only final logo and remove materializer
        run: |
          set -euo pipefail
          git config user.name 'LEFFERION PRIME Release Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git rm .github/workflows/materialize-final-logo-from-canva.yml
          git add assets/brand/lefferion-prime-logo-v3.png
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/materialize-final-logo-from-canva.yml' 'assets/brand/lefferion-prime-logo-v3.png' | sort)"
          test "$changed" = "$expected"
          git commit -m 'brand: install exact approved 2048 LP master'
          git push origin HEAD:agent/mizan-production-release-20260905
