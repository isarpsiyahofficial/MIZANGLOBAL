name: Apply reviewed Romanian integration

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/apply-romanian-integration.yml
      - tools/apply_romanian_integration_bundle.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Romanian branch
        uses: actions/checkout@v4
        with:
          ref: agent/romanian-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic catalog dependency
        run: python -m pip install 'Babel>=2.15,<3'

      - name: Install reviewed integration bundle
        run: python tools/apply_romanian_integration_bundle.py

      - name: Apply native review and integrate runtime
        run: |
          python tools/apply_romanian_review.py
          python tools/build_romanian_locale.py
          python tools/build_romanian_locale.py --verify
          python tools/audit_romanian_native_copy.py

      - name: Commit reviewed Romanian integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/romanian-localization.yml \
            tools/build_romanian_locale.py \
            tools/audit_romanian_native_copy.py \
            tools/apply_romanian_review.py \
            tools/romanian_review.json \
            tools/romanian_native_terms.json \
            lib/l10n/ro lib/l10n/mizan_ro.dart lib/l10n/mizan_ro_dynamic.dart \
            lib/l10n/mizan_i18n.dart lib/main.dart lib/global/global_catalog.dart \
            lib/core/formatters.dart lib/widgets/global_picker_dialog.dart \
            assets/data/languages_v1.json assets/data/countries_v1.json \
            assets/data/currencies_v1.json test/*.dart tools/*.py
          if git diff --cached --quiet; then
            echo 'Reviewed Romanian integration is already installed.'
          else
            git commit -m 'feat(ro): integrate reviewed Romanian product locale'
            git pull --rebase origin agent/romanian-localization
            git push origin HEAD:agent/romanian-localization
          fi
