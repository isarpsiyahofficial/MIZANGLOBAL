name: Urdu branch materializer

on:
  push:
    branches: [agent/mizanglobal-globalization]
    paths:
      - '.github/workflows/urdu-branch-materializer.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/urdu-localization

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Urdu branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize reviewed Urdu source pack
        run: |
          set -euo pipefail
          python tools/bootstrap_urdu_locale.py
          git diff --check
      - name: Commit and push Urdu source
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain)"; then
            echo 'Urdu source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ur): materialize reviewed Urdu localization'
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
