name: Candidate global setup integration

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-global-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Verify global setup is materialized
        run: |
          test -f lib/global/global_catalog.dart
          test -f lib/widgets/global_picker_dialog.dart
          test -f tools/validate_project.py

      - name: Validate project structure and catalog counts
        run: python3 tools/validate_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Global setup and backward backup tests
        run: flutter test --reporter expanded test/global_setup_test.dart test/local_store_test.dart test/csv_backup_test.dart

      - name: Compare deterministic Flutter UI baselines
        run: flutter test test/visual_capture_test.dart

      - name: Full regression tests
        run: flutter test --reporter expanded

      - name: Build unsigned release APK
        run: flutter build apk --release

      - name: Upload verified UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-setup-ui-screenshots
          path: test/goldens/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-setup-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
