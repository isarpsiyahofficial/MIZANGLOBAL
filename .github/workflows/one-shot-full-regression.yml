name: One-shot pre-change regression baseline proof

on:
  push:
    branches:
      - agent/chinese-localization

permissions:
  contents: write

jobs:
  baseline-proof:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pre-change source
        uses: actions/checkout@v4
        with:
          ref: 513637a2df98888e4f5fdbdf1c935f95b90e631b
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Reproduce only the remaining failing tests on pre-change source
        run: |
          set -euo pipefail
          flutter pub get
          set +e
          set -o pipefail
          flutter test test/native_audit_formatter_stability_test.dart test/visual_capture_test.dart 2>&1 | tee /tmp/pre-change-baseline.log
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the known pre-change baseline failures, but the selected tests all passed.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pre-change-baseline.log').read_text(encoding='utf-8', errors='replace')
          required = [
              'native-copy audit map parsers accept Dart formatter line wrapping (failed)',
              'ilk kurulum boş ana sayfa (failed)',
              'dolu ana sayfa ve toplamlar (failed)',
              'kalan toplam borç detayı (failed)',
              'kişi detayları ve ilişkili kayıtlar (failed)',
              'kritik ödeme detay ekranı (failed)',
              'kişisel kurumsal borç detayı (failed)',
              'giderler ekranı (failed)',
              'raporlar ekranı (failed)',
              'tablet ana sayfa (failed)',
              'ödeme türü seçimi (failed)',
              'tests passed, 11 failed.',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Pre-change failure set did not match current full-suite failure set: ' + repr(missing))
          print('Confirmed: the same 11 failures already exist on the exact pre-change commit.')
          PY

      - name: Upload pre-change proof
        uses: actions/upload-artifact@v4
        with:
          name: pre-change-regression-baseline
          path: /tmp/pre-change-baseline.log
          if-no-files-found: error
          retention-days: 1

      - name: Checkout current branch for cleanup
        uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true

      - name: Remove temporary regression workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-full-regression.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci: remove one-shot regression baseline workflow'
          git fetch origin agent/chinese-localization
          git rebase origin/agent/chinese-localization
          git push origin HEAD:agent/chinese-localization
