name: Patch Romanian candidate generator

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/patch-romanian-candidate-generator.yml
      - tools/patch_romanian_candidate_generator.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Romanian branch
        uses: actions/checkout@v4
        with:
          ref: agent/romanian-localization
          fetch-depth: 0

      - name: Apply bounded generator patch
        run: python tools/patch_romanian_candidate_generator.py

      - name: Compile patched generator
        run: python -m py_compile tools/generate_romanian_candidate.py

      - name: Commit patched generator
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_romanian_candidate.py
          if git diff --cached --quiet; then
            echo 'Romanian candidate generator already patched.'
          else
            git commit -m 'fix(ro): bound and parallelize candidate generation'
            git pull --rebase origin agent/romanian-localization
            git push origin HEAD:agent/romanian-localization
          fi
