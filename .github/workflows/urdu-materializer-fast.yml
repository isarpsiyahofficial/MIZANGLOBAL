name: Urdu materializer diagnostic lane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/urdu-materializer-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urdu-materializer-diagnostic-lane
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Urdu branch
        uses: actions/checkout@v4
        with:
          ref: agent/urdu-localization
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture materializer result without touching product source
        shell: bash
        run: |
          set +e
          cp tools/bootstrap_urdu_locale.py "$RUNNER_TEMP/urdu_bootstrap.py"
          python "$RUNNER_TEMP/urdu_bootstrap.py" > "$RUNNER_TEMP/urdu-materializer.log" 2>&1
          status=$?
          git reset --hard HEAD
          git clean -fd
          {
            printf 'exit_code=%s\n' "$status"
            printf '%s\n' '--- output ---'
            cat "$RUNNER_TEMP/urdu-materializer.log"
          } > .github/urdu-materialization-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/urdu-materialization-diagnostic.txt
          git commit -m 'ci: record Urdu materializer diagnostic' || exit 0
          git pull --rebase origin agent/urdu-localization
          git push origin HEAD:agent/urdu-localization
