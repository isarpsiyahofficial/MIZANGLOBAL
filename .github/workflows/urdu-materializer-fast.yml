name: Urdu materializer fast lane

on:
  pull_request:
    branches: [agent/urdu-materialize-fast-target]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: urdu-materializer-fast-lane
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/urdu-localization'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out Urdu branch
        uses: actions/checkout@v4
        with:
          ref: agent/urdu-localization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and validate reviewed Urdu source pack
        run: |
          set -euo pipefail
          cp tools/bootstrap_urdu_locale.py "$RUNNER_TEMP/urdu_bootstrap.py"
          python "$RUNNER_TEMP/urdu_bootstrap.py"

          git add -N .
          changed_file="$RUNNER_TEMP/urdu_changed_files.txt"
          git diff --name-only > "$changed_file"
          change_count="$(grep -c . "$changed_file" || true)"
          printf 'Materialized change count: %s\n' "$change_count"
          cat "$changed_file"
          if [ "$change_count" -lt 15 ]; then
            echo "Expected at least 15 materialized changes, found $change_count." >&2
            exit 1
          fi

          grep -q '^lib/' "$changed_file" || { echo 'Materialized pack has no lib source changes.' >&2; exit 1; }
          grep -q '^test/' "$changed_file" || { echo 'Materialized pack has no Urdu test changes.' >&2; exit 1; }
          grep -q '^tools/' "$changed_file" || { echo 'Materialized pack has no Urdu validation-tool changes.' >&2; exit 1; }

          marker_hits=0
          while IFS= read -r path; do
            if test -f "$path" && grep -Iq . "$path" && grep -Eq 'اردو|Urdu|ur-PK|ur-IN|mizanUrdu' "$path"; then
              marker_hits=$((marker_hits + 1))
            fi
          done < "$changed_file"
          printf 'Urdu marker file count: %s\n' "$marker_hits"
          if [ "$marker_hits" -lt 3 ]; then
            echo "Expected Urdu markers in at least 3 materialized files, found $marker_hits." >&2
            exit 1
          fi

          git -c core.whitespace=-cr-at-eol diff --check
      - name: Commit generated Urdu application source
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain)"; then
            echo 'Urdu source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ur): materialize reviewed Urdu localization'
          git fetch origin agent/urdu-localization
          git rebase origin/agent/urdu-localization
          git push origin HEAD:agent/urdu-localization
