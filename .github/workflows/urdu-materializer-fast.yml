name: Materialize clean Urdu source on macOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/urdu-materializer-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urdu-clean-macos-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out clean Urdu branch
        uses: actions/checkout@v4
        with:
          ref: agent/urdu-localization-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and extract deterministic package
        shell: bash
        run: |
          set -euo pipefail
          cat .github/urdu-clean-payload/part-*.b64 | base64 --decode > "$RUNNER_TEMP/urdu_changes.tar.gz"
          actual_sha="$(shasum -a 256 "$RUNNER_TEMP/urdu_changes.tar.gz" | awk '{print $1}')"
          test "$actual_sha" = '3a1c06e942a9967f4afa331fc1005ee847809dcd09471cd2e3a4b83ccc8b6c6e'
          tar -xzf "$RUNNER_TEMP/urdu_changes.tar.gz" -C .
          test -f lib/l10n/mizan_ur.dart
          test -f lib/l10n/mizan_ur_dynamic.dart
          python3 tools/audit_urdu_native_copy.py
          rm -rf .github/urdu-clean-payload
          rm -f \
            .github/workflows/urdu-clean-materialize.yml \
            .github/workflows/urdu-clean-recovery.yml \
            .github/workflows/urdu-finalize-controller.yml \
            .github/workflows/urdu-final-repair.yml
          git diff --check

      - name: Commit real Urdu source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ur): materialize verified Urdu localization'
          git pull --rebase origin agent/urdu-localization-clean
          git push origin HEAD:agent/urdu-localization-clean
