name: Fix exact ISO currency search

on:
  push:
    branches:
      - agent/polish-localization
    paths:
      - .github/workflows/fix-currency-exact-iso-search.yml
      - tools/fix_currency_exact_iso_search.py
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/fix-currency-exact-iso-search.yml
      - tools/fix_currency_exact_iso_search.py

permissions:
  contents: write

concurrency:
  group: fix-currency-exact-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Polish localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/polish-localization
          fetch-depth: 0

      - name: Apply exact ISO search correction
        run: python tools/fix_currency_exact_iso_search.py

      - name: Commit corrected catalog search
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/global/global_catalog.dart lib/widgets/global_picker_dialog.dart test/global_setup_test.dart
          if git diff --cached --quiet; then
            echo 'Exact ISO search correction is already applied.'
          else
            git commit -m 'fix(catalog): prioritize exact ISO currency codes'
            git pull --rebase origin agent/polish-localization
            git push origin HEAD:agent/polish-localization
          fi
