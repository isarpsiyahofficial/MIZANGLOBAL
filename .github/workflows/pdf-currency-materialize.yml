name: Final currency surface materialization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Materialize currency-isolated surfaces
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/materialize_record_currency_models.py \
            tools/patch_expense_currency_surfaces.py \
            tools/patch_people_currency_surfaces.py \
            tools/fix_people_currency_patch.py \
            tools/materialize_pdf_currency.py \
            tools/patch_report_currency_pdf.py
          python tools/materialize_record_currency_models.py
          python tools/patch_expense_currency_surfaces.py
          python tools/patch_people_currency_surfaces.py
          python tools/fix_people_currency_patch.py
          python tools/materialize_pdf_currency.py
          dart format \
            lib/screens/dashboard_screen.dart \
            lib/screens/expenses_screen.dart \
            lib/screens/people_screen.dart \
            lib/services/expense_browser_service.dart \
            lib/services/pdf_report_service.dart
          flutter pub get
          flutter analyze --fatal-warnings
          flutter test test/record_currency_persistence_contract_test.dart
          flutter test test/report_multicurrency_isolation_test.dart
          flutter test test/global_preferences_backup_invariants_test.dart
          flutter test test/profile_notification_resync_contract_test.dart
          flutter test test/all_29_language_final_contract_test.dart
          flutter test test/final_29_catalog_matrix_test.dart
          flutter test test/final_29_locale_formatter_test.dart
      - name: Verify no cross-currency scalar rendering remains on patched surfaces
        run: |
          set -euo pipefail
          ! grep -F 'money(report.totalIncome)' lib/services/pdf_report_service.dart
          ! grep -F 'money(report.totalPayments)' lib/services/pdf_report_service.dart
          ! grep -F 'money(report.totalExpenses)' lib/services/pdf_report_service.dart
          ! grep -F 'money(report.realizedGrandTotal)' lib/services/pdf_report_service.dart
          ! grep -F 'money(report.remainingTotalsByType' lib/services/pdf_report_service.dart
          ! grep -F 'money(person.totalRemaining)' lib/services/pdf_report_service.dart
          grep -F 'realizedDistributionByCurrency' lib/services/pdf_report_service.dart
          grep -F 'combinedOutflowDistributionByCurrency' lib/services/pdf_report_service.dart
          grep -F 'moneyBuckets(state.recordRemainingTotalsByCurrency())' lib/screens/dashboard_screen.dart
          grep -F 'moneyBuckets(widget.group.totalsByCurrency)' lib/screens/expenses_screen.dart
          grep -F 'totalsByCurrency' lib/services/expense_browser_service.dart
          grep -F 'currencyCode: current.currencyCode' lib/screens/people_screen.dart
          grep -F 'moneyBuckets(_personRemainingBuckets(selected))' lib/screens/people_screen.dart
      - name: Commit verified source and remove temporary orchestration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f \
            tools/materialize_record_currency_models.py \
            tools/patch_expense_currency_surfaces.py \
            tools/patch_people_currency_surfaces.py \
            tools/fix_people_currency_patch.py \
            tools/materialize_pdf_currency.py \
            tools/patch_report_currency_pdf.py \
            tools/materialize_multicurrency_reports.py \
            .github/workflows/multicurrency-report-materialize.yml \
            .github/workflows/pdf-currency-materialize.yml
          git add -A
          git commit -m 'feat(currency): isolate financial surfaces by record currency'
          git push origin HEAD:agent/chinese-localization
