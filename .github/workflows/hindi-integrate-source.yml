name: Integrate reviewed Hindi source

on:
  push:
    branches: [agent/hindi-localization]
  pull_request:
    branches: [agent/mizanglobal-globalization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hindi-integrate-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out Hindi branch
        uses: actions/checkout@v4
        with:
          ref: agent/hindi-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and unpack exact reviewed package
        run: |
          set -euo pipefail
          cat \
            transfer/hindi-package.part00 \
            transfer/hindi-package.rem00 \
            transfer/hindi-package.rem00.01 \
            transfer/hindi-package.rem00.02 \
            transfer/hindi-package.rem01 \
            transfer/hindi-package.rem02.00 \
            transfer/hindi-package.rem02.01 \
            transfer/hindi-package.rem02.02 \
            transfer/hindi-package.rem03 \
            transfer/hindi-package.rem04 \
            | base64 -d > /tmp/hindi-final-source-package.zip
          echo 'ddc3ee06d7bfb675dea96e3d463bb1a49b01f9fd8837785b90044a3e8ea15537  /tmp/hindi-final-source-package.zip' | sha256sum -c -
          unzip -o /tmp/hindi-final-source-package.zip -d .
          python tools/build_hindi_locale.py --apply
          sed -i '/^enum _HindiPlural { one, other }$/d' lib/l10n/mizan_hi_dynamic.dart
          sed -i '/^_HindiPlural _category(String value) => switch (_number(value).abs()) {$/,/^};$/d' lib/l10n/mizan_hi_dynamic.dart
          python - <<'PY'
          from pathlib import Path

          catalog = Path('lib/global/global_catalog.dart')
          source = catalog.read_text(encoding='utf-8')
          old = "RegExp(r'[^\\p{L}\\p{N}]+', unicode: true)"
          new = "RegExp(r'[^\\p{L}\\p{M}\\p{N}]+', unicode: true)"
          if old not in source:
              raise SystemExit('global search normalization marker missing')
          catalog.write_text(source.replace(old, new, 1), encoding='utf-8')

          dynamic = Path('lib/l10n/mizan_hi_dynamic.dart')
          source = dynamic.read_text(encoding='utf-8')
          old = "(m, t) => 'अंतिम भुगतान: ${m[1]}।',"
          new = "(m, t) => 'अंतिम भुगतान तिथि: ${m[1]}।',"
          if old not in source:
              raise SystemExit('Hindi due-date reminder marker missing')
          dynamic.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/finalize_hindi_native_copy.py
          python tools/build_hindi_locale.py --verify
          python tools/audit_hindi_native_copy.py
          python tools/validate_hindi_localization_scope.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Format and preflight integrated Hindi runtime
        run: |
          set -euo pipefail
          dart format \
            lib/l10n/hi \
            lib/l10n/mizan_hi.dart \
            lib/l10n/mizan_hi_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            lib/main.dart \
            test/hindi_localization_contract_test.dart \
            test/hindi_localization_test.dart \
            test/hindi_end_to_end_test.dart \
            test/hindi_responsive_test.dart \
            test/english_localization_test.dart \
            test/portuguese_br_localization_test.dart \
            test/spanish_localization_test.dart \
            test/italian_final_head_test.dart
          python tools/finalize_hindi_native_copy.py
          dart format lib/l10n/hi lib/l10n/mizan_hi.dart lib/l10n/mizan_hi_dynamic.dart
          python tools/build_hindi_locale.py --verify
          python tools/audit_hindi_native_copy.py
          python tools/validate_hindi_localization_scope.py
          flutter pub get
          flutter analyze --fatal-warnings --fatal-infos
          for file in \
            test/hindi_localization_contract_test.dart \
            test/hindi_localization_test.dart \
            test/hindi_end_to_end_test.dart \
            test/hindi_responsive_test.dart \
            test/english_localization_test.dart \
            test/portuguese_br_localization_test.dart \
            test/spanish_localization_test.dart \
            test/italian_final_head_test.dart; do
            timeout 12m flutter test --reporter expanded "$file"
          done
          git diff --check

      - name: Remove temporary transfer and generation tools
        run: |
          set -euo pipefail
          rm -rf transfer
          rm -f tools/generate_hindi_candidate.py
          rm -f .github/workflows/hindi-localization.yml
          rm -f .github/workflows/hindi-final-three-gates.yml
          git checkout HEAD -- \
            .github/workflows/hindi-integrate-source.yml \
            .github/workflows/hindi-source-snapshot.yml \
            .github/workflows/hindi-candidate.yml

      - name: Commit integrated Hindi runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'l10n: integrate reviewed Hindi runtime'
          git pull --rebase origin agent/hindi-localization
          git push origin HEAD:agent/hindi-localization
