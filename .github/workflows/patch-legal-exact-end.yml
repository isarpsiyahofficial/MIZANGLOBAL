name: Patch exact legal read end

on:
  push:
    branches:
      - agent/mizan-monetization-premium

permissions:
  contents: write

concurrency:
  group: patch-legal-exact-end-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require actual document end and strengthen contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/screens/legal_document_screen.dart')
          text = p.read_text(encoding='utf-8')
          old = """    if (position.maxScrollExtent <= 0 ||\n        position.pixels >= position.maxScrollExtent - 24) {\n      if (mounted) setState(() => _reachedEnd = true);\n    }"""
          new = """    if (position.maxScrollExtent <= 0 ||\n        position.pixels >= position.maxScrollExtent) {\n      if (mounted) setState(() => _reachedEnd = true);\n    }"""
          if new not in text:
              if old not in text:
                  raise SystemExit('legal end threshold anchor missing')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('test/all_29_language_legal_resilience_test.dart')
          text = p.read_text(encoding='utf-8')
          old = """    state.position.jumpTo(state.position.maxScrollExtent - 30);\n    await tester.pumpAndSettle();\n    expect(_button(tester, readAll).onPressed, isNull);\n\n    Navigator.of(tester.element(find.byType(Scaffold).first)).pop(false);"""
          new = """    state.position.jumpTo(state.position.maxScrollExtent - 1);\n    await tester.pumpAndSettle();\n    expect(_button(tester, readAll).onPressed, isNull);\n\n    state.position.jumpTo(state.position.maxScrollExtent);\n    await tester.pumpAndSettle();\n    expect(_button(tester, readAll).onPressed, isNotNull);\n\n    Navigator.of(tester.element(find.byType(Scaffold).first)).pop(false);"""
          if new not in text:
              if old not in text:
                  raise SystemExit('legal resilience anchor missing')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/legal_document_screen.dart test/all_29_language_legal_resilience_test.dart
          git diff --cached --check
          git commit -m "fix(legal): require actual document end before acceptance"
          git push origin HEAD:agent/mizan-monetization-premium
