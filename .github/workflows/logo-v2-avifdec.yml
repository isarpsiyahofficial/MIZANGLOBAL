name: Decode clean LP AVIF

on:
  push:
    branches: [agent/mizan-logo-final-integration-v2]

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode with libavif
        run: |
          set -euo pipefail
          cat .brand-transfer/rgb.00 .brand-transfer/rgb.01 | tr -d '\n\r ' | base64 -d > /tmp/rgb.avif
          sudo apt-get update -qq
          sudo apt-get install -y -qq libavif-bin
          avifdec /tmp/rgb.avif /tmp/rgb.png
          file /tmp/rgb.png
          identify /tmp/rgb.png || true
          sha256sum /tmp/rgb.png
