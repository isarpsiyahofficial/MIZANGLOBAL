name: Preserve MIZAN verified sources in MIZANGLOBAL

on:
  push:
    branches: [agent/preserve-mizan-baseline]
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  preserve-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Download original verified baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: lefferion-prime-mizan-phone-feedback-verified-source
          repository: isarpsiyahofficial/MIZAN
          run-id: 29778390280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline-artifact

      - name: Download latest verified MIZAN source artifact
        uses: actions/download-artifact@v4
        with:
          name: lefferion-prime-mizan-notification-background-reliability-final-source
          repository: isarpsiyahofficial/MIZAN
          run-id: 30333903308
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: latest-artifact

      - name: Verify both source archives
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t baseline_archives < <(find baseline-artifact -type f -name '*.zip' -print)
          test "${#baseline_archives[@]}" -eq 1
          cp "${baseline_archives[0]}" MIZAN-BASELINE-SOURCE.zip
          echo 'f12213eabfacba455c5bab593b069020bf661a1ba1ba519a6fdf6f59650f069b  MIZAN-BASELINE-SOURCE.zip' | sha256sum -c -

          mapfile -t latest_archives < <(find latest-artifact -type f -name '*.zip' -print)
          test "${#latest_archives[@]}" -eq 1
          cp "${latest_archives[0]}" MIZAN-LATEST-VERIFIED-SOURCE.zip
          echo '2f6cf6cacbe359e55f06431935e56031717b8de755b9db457ea7b48c5243f83d  MIZAN-LATEST-VERIFIED-SOURCE.zip' | sha256sum -c -

      - name: Store verified sources in target backup branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git clone --depth 1 --branch mizan-complete-backup-package "$TARGET_URL" backup-package
          cp MIZAN-BASELINE-SOURCE.zip backup-package/
          cp MIZAN-LATEST-VERIFIED-SOURCE.zip backup-package/
          cat > backup-package/MIZAN-VERIFIED-SOURCES.sha256 <<'EOF'
          f12213eabfacba455c5bab593b069020bf661a1ba1ba519a6fdf6f59650f069b  MIZAN-BASELINE-SOURCE.zip
          2f6cf6cacbe359e55f06431935e56031717b8de755b9db457ea7b48c5243f83d  MIZAN-LATEST-VERIFIED-SOURCE.zip
          EOF
          cat >> backup-package/README.md <<'EOF'

          The original SHA-verified baseline source and the latest fully verified MIZAN source are preserved in this branch. They remain available even if the original MIZAN repository becomes private.
          EOF
          git -C backup-package config user.name 'MIZANGLOBAL Backup Automation'
          git -C backup-package config user.email 'actions@github.com'
          git -C backup-package add MIZAN-BASELINE-SOURCE.zip MIZAN-LATEST-VERIFIED-SOURCE.zip MIZAN-VERIFIED-SOURCES.sha256 README.md
          if git -C backup-package diff --cached --quiet; then
            echo 'Verified source packages are already stored.'
          else
            git -C backup-package commit -m 'backup: preserve verified MIZAN source packages'
            git -C backup-package push origin HEAD:refs/heads/mizan-complete-backup-package
          fi

      - name: Verify stored target copies independently
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git clone --depth 1 --branch mizan-complete-backup-package "$TARGET_URL" verification
          cd verification
          sha256sum -c MIZAN-VERIFIED-SOURCES.sha256
          test "$(sha256sum MIZAN-BASELINE-SOURCE.zip | awk '{print $1}')" = 'f12213eabfacba455c5bab593b069020bf661a1ba1ba519a6fdf6f59650f069b'
          test "$(sha256sum MIZAN-LATEST-VERIFIED-SOURCE.zip | awk '{print $1}')" = '2f6cf6cacbe359e55f06431935e56031717b8de755b9db457ea7b48c5243f83d'
