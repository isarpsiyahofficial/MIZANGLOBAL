name: Start Indonesian only after verified Urdu integration

on:
  push:
    branches: [agent/mizanglobal-globalization]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: indonesian-bootstrap-after-urdu
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizanglobal-globalization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require verified Urdu product source
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/l10n/mizan_ur.dart
          test -f lib/l10n/mizan_ur_dynamic.dart
          python3 tools/audit_urdu_native_copy.py
      - name: Create exact Indonesian work branch and contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          product_sha="$(git rev-parse HEAD)"
          git checkout -B agent/indonesian-localization "$product_sha"
          mkdir -p docs/localization
          cat > docs/localization/indonesian-quality-contract.md <<'EOF'
          # Kontrak mutu lokalisasi Bahasa Indonesia

          - Bahasa: Bahasa Indonesia (`id`, `id-ID`), LTR.
          - Seluruh 791 teks sistem wajib lengkap, alami, konsisten, dan tidak memakai fallback bahasa lain.
          - Istilah utang, pembayaran, pemasukan, pengeluaran, tagihan, sewa, cicilan, laporan, pengingat, notifikasi, cadangan, CSV, dan PDF harus sesuai penggunaan produk keuangan di Indonesia.
          - Teks dinamis wajib alami; data yang ditulis pengguna tidak boleh diterjemahkan atau diubah.
          - Format lokal: IDR, pemisah ribuan titik, desimal koma, tanggal Gregorius Indonesia, serta pencarian katalog multibahasa yang aman.
          - Nama tampilan Bahasa Indonesia wajib tersedia untuk 29 bahasa, 161 negara, dan 154 mata uang; alias pencarian tidak boleh bocor ke teks tampilan.
          - Mata uang berbeda tidak boleh digabungkan dalam laporan, grafik, PDF, CSV, atau ringkasan.
          - Seluruh bahasa yang telah digabungkan, termasuk Urdu, wajib lulus regresi penuh.
          - Final hanya setelah analisis statis, pengujian bahasa/runtime, laporan/PDF/notifikasi, penyimpanan/CSV, responsive, visual baseline, seluruh pengujian terisolasi, dan empat APK release lulus pada SHA yang sama.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/localization/indonesian-quality-contract.md
          git commit -m 'docs(id): define Indonesian final quality contract'
          git push --force-with-lease origin HEAD:agent/indonesian-localization
          if ! gh pr view agent/indonesian-localization --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh pr create --repo "${{ github.repository }}" --draft \
              --base agent/mizanglobal-globalization \
              --head agent/indonesian-localization \
              --title 'MİZAN GLOBAL Indonesian localization' \
              --body 'Urduca entegrasyonunun doğrulanmış ürün head’i üzerinden başlatılan Endonezce (`id`, `id-ID`) final çalışmasıdır. 791/791 metin, dinamik dil, IDR ve Endonezya biçimleri, 29/161/154 kataloglar, rapor/PDF/bildirim/CSV, önceki 20 dil regresyonu, responsive/görsel kapılar ve dört release APK tamamlanmadan birleştirilmeyecektir.'
          fi
      - name: Remove one-time bootstrap from product
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B agent/mizanglobal-globalization origin/agent/mizanglobal-globalization
          rm -f .github/workflows/indonesian-bootstrap-after-urdu.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove Indonesian bootstrap gate'
            git push origin HEAD:agent/mizanglobal-globalization
          fi
