name: Locale validator purity diagnostic

on:
  pull_request:
    branches: [agent/mizanglobal-globalization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run validators one by one and show any source mutation
        run: |
          set -euo pipefail
          python -m pip install 'Babel>=2.15,<3'
          commands=(
            "python tools/build_russian_locale.py --verify"
            "python tools/audit_russian_native_copy.py"
            "python tools/validate_english_localization.py"
            "python tools/validate_spanish_localization.py"
            "python tools/validate_portuguese_br_localization.py"
            "python tools/validate_spanish_visible_copy.py"
            "python tools/build_pt_pt_locale.py --verify"
            "python tools/build_french_locale.py --verify"
            "python tools/build_german_locale.py --verify"
            "python tools/build_italian_locale.py --verify"
            "python tools/build_dutch_locale.py --verify"
            "python tools/build_polish_locale.py --verify"
            "python tools/build_romanian_locale.py --verify"
            "python tools/build_greek_locale.py --verify"
          )
          failed=0
          for command in "${commands[@]}"; do
            echo "=== $command ==="
            eval "$command"
            if test -n "$(git status --porcelain)"; then
              failed=1
              echo "SOURCE MUTATION AFTER: $command"
              git status --short
              git diff -- lib/screens/settings_screen.dart lib/services/notification_service.dart lib/controllers/mizan_controller.dart lib/core/formatters.dart || true
              grep -RFn "MİZAN yaklaşık zamanlama kullanmaz" lib tools || true
              git reset --hard HEAD
              git clean -fd
            fi
          done
          exit "$failed"
