name: Fix legal Future analyzer
on:
  push:
    branches:
      - agent/mizan-monetization-premium
    paths:
      - .github/workflows/fix-legal-await.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = '    _loadLegalAcceptance();\n'
          new = '    unawaited(_loadLegalAcceptance());\n'
          if old not in s:
              raise SystemExit('anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-legal-await.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Mark first-run legal acceptance load unawaited'
          git push origin HEAD:agent/mizan-monetization-premium
