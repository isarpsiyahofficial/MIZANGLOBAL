name: Korean final acceptance gates
on:
  pull_request:
    branches: [agent/filipino-localization]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: korean-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  language-runtime-reports:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: |
          python tools/audit_korean_native_copy.py
          dart format --output=none --set-exit-if-changed lib test
          git diff --check
      - run: flutter analyze
      - shell: bash
        run: |
          set -euo pipefail
          for f in test/korean_localization_test.dart test/korean_end_to_end_test.dart test/korean_responsive_test.dart test/all_language_isolation_test.dart test/cjk_isolation_contract_test.dart test/global_setup_test.dart test/overdue_regression_test.dart test/background_notification_regression_test.dart; do flutter test "$f"; done
          while IFS= read -r f; do flutter test "$f"; done < <(find test -maxdepth 1 -type f -iname '*pdf*test.dart' | sort)
  isolated-regression:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do echo "===== $f ====="; flutter test "$f"; done < <(find test -type f -name '*_test.dart' | sort)
          git diff --exit-code
  release-apks:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p release/korean-final
          cp build/app/outputs/flutter-apk/app-release.apk release/korean-final/mizan-global-korean-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/korean-final/mizan-global-korean-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/korean-final/mizan-global-korean-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/korean-final/mizan-global-korean-x86_64.apk
          (cd release/korean-final && sha256sum *.apk | sort > SHA256SUMS.txt && wc -c *.apk | sort -n > BYTE_SIZES.txt)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with: {name: mizan-global-korean-final-apks, path: release/korean-final, if-no-files-found: error, retention-days: 90}
