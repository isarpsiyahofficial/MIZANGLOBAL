name: One-shot global record, income, and backup contract

on:
  push:
    branches:
      - agent/chinese-localization

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply deterministic source corrections
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_global_record_income_backup_patch.py 2>&1 | tee /tmp/global-patch.log
          dart format lib/models/mizan_models.dart lib/screens/record_form_dialogs.dart lib/services/csv_backup_service.dart lib/services/pdf_report_service.dart test/csv_multicurrency_identity_test.dart test/annual_income_backup_contract_test.dart 2>&1 | tee -a /tmp/global-patch.log
          git diff --check 2>&1 | tee -a /tmp/global-patch.log

      - name: Upload patch diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: global-patch-diagnostics
          path: /tmp/global-patch.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify analysis and backup report contracts
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test test/annual_income_backup_contract_test.dart test/csv_multicurrency_identity_test.dart test/csv_legacy_tr_currency_migration_test.dart test/global_preferences_backup_invariants_test.dart test/record_currency_persistence_contract_test.dart

      - name: Commit verified correction and remove temporary automation
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-global-record-income-contract.yml
          rm -f .github/scripts/apply_global_record_income_backup_patch.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(global): preserve record naming, annual income, and backup identity'
          git fetch origin agent/chinese-localization
          git rebase origin/agent/chinese-localization
          git push origin HEAD:agent/chinese-localization
