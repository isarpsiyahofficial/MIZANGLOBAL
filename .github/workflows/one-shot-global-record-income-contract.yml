name: One-shot global record, income, and backup contract

on:
  push:
    branches:
      - agent/chinese-localization

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply narrow source and backup compatibility corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match in {path}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'patched: {label}')

          models = Path('lib/models/mizan_models.dart')
          replace_once(
              models,
              "    monthly('Aylık');",
              "    monthly('Aylık'),\n    yearly('Yıllık');",
              'IncomeFrequency.yearly enum',
          )

          text = models.read_text(encoding='utf-8')
          occurrence_start = text.index('  int occurrenceCount(DateTime start, DateTime endInclusive) {')
          total_start = text.index('  double totalForRange(', occurrence_start)
          occurrence = text[occurrence_start:total_start]
          if 'case IncomeFrequency.yearly:' in occurrence:
              raise SystemExit('yearly occurrence branch already exists unexpectedly')
          tail = "        return count;\n    }\n  }\n\n"
          if occurrence.count(tail) != 1:
              raise SystemExit(f'occurrence switch tail mismatch: {occurrence.count(tail)}')
          yearly_branch = """        return count;
      case IncomeFrequency.yearly:
        var year = effectiveStart.year;
        var count = 0;
        while (year <= rangeEnd.year) {
          final occurrence = _dayOfMonth(
            DateTime(year, startDate.month),
            startDate.day,
          );
          if (!occurrence.isBefore(effectiveStart) &&
              !occurrence.isAfter(rangeEnd) &&
              !occurrence.isBefore(first)) {
            count++;
          }
          year++;
        }
        return count;
    }
  }

"""
          text = text[:occurrence_start] + occurrence.replace(tail, yearly_branch, 1) + text[total_start:]
          models.write_text(text, encoding='utf-8')
          print('patched: yearly occurrence calculation')

          replace_once(
              models,
              """      if (!income.isArchived && income.frequency != IncomeFrequency.oneTime) {
        var month = DateTime(income.startDate.year, income.startDate.month);
        final last = DateTime(reference.year, reference.month);
        while (!month.isAfter(last)) {
          add(month);
          month = DateTime(month.year, month.month + 1);
        }
      }
""",
              """      if (!income.isArchived && income.frequency != IncomeFrequency.oneTime) {
        final last = DateTime(reference.year, reference.month);
        if (income.frequency == IncomeFrequency.yearly) {
          var year = income.startDate.year;
          while (year <= last.year) {
            final month = DateTime(year, income.startDate.month);
            if (!month.isAfter(last)) add(month);
            year++;
          }
        } else {
          var month = DateTime(income.startDate.year, income.startDate.month);
          while (!month.isAfter(last)) {
            add(month);
            month = DateTime(month.year, month.month + 1);
          }
        }
      }
""",
              'yearly report-month availability',
          )

          forms = Path('lib/screens/record_form_dialogs.dart')
          replace_once(
              forms,
              '    kind = item?.kind ?? DebtKind.creditCard;\n',
              """    kind = widget.controller.state.usesTurkeyDebtCatalog
        ? item?.kind ?? DebtKind.creditCard
        : DebtKind.custom;
""",
              'non-TR debt kind defaults to custom',
          )
          replace_once(
              forms,
              "    custom = TextEditingController(text: item?.customKindName ?? '');\n",
              """    custom = TextEditingController(
      text: item == null
          ? ''
          : widget.controller.state.usesTurkeyDebtCatalog
          ? item.customKindName
          : item.displayKind,
    );
""",
              'non-TR legacy debt kind prefill',
          )
          replace_once(
              forms,
              """  Widget build(BuildContext context) {
    return _DialogShell(
      title: widget.debt == null ? 'Borç ürünü ekle' : 'Borç ürününü düzenle',
""",
              """  Widget build(BuildContext context) {
    final usesTurkeyDebtCatalog = widget.controller.state.usesTurkeyDebtCatalog;
    return _DialogShell(
      title: widget.debt == null ? 'Borç ürünü ekle' : 'Borç ürününü düzenle',
""",
              'debt form region switch',
          )
          replace_once(
              forms,
              """        DropdownButtonFormField<DebtKind>(
          initialValue: kind,
          decoration: localizedInputDecoration(
            const InputDecoration(labelText: 'Borç türü'),
          ),
          items: [
            for (final item in DebtKind.values)
              DropdownMenuItem(
                value: item,
                child: Text(
                  item.label,
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                ),
              ),
          ],
          onChanged: (value) => setState(() => kind = value ?? kind),
        ),
        if (kind == DebtKind.custom)
          TextFormField(
            controller: custom,
            maxLength: 60,
            decoration: localizedInputDecoration(
              const InputDecoration(labelText: 'Özel borç türü'),
            ),
            validator: (v) => _required(v, 'Özel borç türü'),
          ),
""",
              """        if (usesTurkeyDebtCatalog)
          DropdownButtonFormField<DebtKind>(
            initialValue: kind,
            decoration: localizedInputDecoration(
              const InputDecoration(labelText: 'Borç türü'),
            ),
            items: [
              for (final item in DebtKind.values)
                DropdownMenuItem(
                  value: item,
                  child: Text(
                    item.label,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                  ),
                ),
            ],
            onChanged: (value) => setState(() => kind = value ?? kind),
          ),
        if (!usesTurkeyDebtCatalog || kind == DebtKind.custom)
          TextFormField(
            controller: custom,
            maxLength: 60,
            decoration: localizedInputDecoration(
              InputDecoration(
                labelText: usesTurkeyDebtCatalog
                    ? 'Özel borç türü'
                    : 'Borç türü',
              ),
            ),
            validator: (value) => _required(
              value,
              usesTurkeyDebtCatalog ? 'Özel borç türü' : 'Borç türü',
            ),
          ),
""",
              'TR catalog versus global free debt kind input',
          )

          backup = Path('lib/services/csv_backup_service.dart')
          fingerprint_heads = [
              ('expense currency identity', "      fingerprint: (item) => _fingerprint(item, const [\n        'categoryId',", "      fingerprint: (item) => _fingerprint(item, const [\n        'currencyCode',\n        'categoryId',"),
              ('income currency identity', "      fingerprint: (item) => _fingerprint(item, const [\n        'title',\n        'amount',\n        'frequency',\n        'startDate',\n        'note',", "      fingerprint: (item) => _fingerprint(item, const [\n        'currencyCode',\n        'title',\n        'amount',\n        'frequency',\n        'startDate',\n        'note',"),
              ('personal debt currency identity', "      fingerprint: (item) => _fingerprint(item, const [\n        'creditorType',", "      fingerprint: (item) => _fingerprint(item, const [\n        'currencyCode',\n        'creditorType',"),
              ('bill currency identity', "      fingerprint: (item) => _fingerprint(item, const [\n        'kind',\n        'institutionName',\n        'subscriberNumber',", "      fingerprint: (item) => _fingerprint(item, const [\n        'currencyCode',\n        'kind',\n        'institutionName',\n        'subscriberNumber',"),
              ('subscription currency identity', "      fingerprint: (item) => _fingerprint(item, const [\n        'kind',\n        'title',\n        'providerName',", "      fingerprint: (item) => _fingerprint(item, const [\n        'currencyCode',\n        'kind',\n        'title',\n        'providerName',"),
              ('rent currency identity', "      fingerprint: (item) => _fingerprint(item, const [\n        'title',\n        'receiverName',", "      fingerprint: (item) => _fingerprint(item, const [\n        'currencyCode',\n        'title',\n        'receiverName',"),
              ('bank debt currency identity', "      fingerprint: (item) => _fingerprint(item, const [\n        'kind',\n        'title',\n        'customKindName',", "      fingerprint: (item) => _fingerprint(item, const [\n        'currencyCode',\n        'kind',\n        'title',\n        'customKindName',"),
          ]
          for label, old, new in fingerprint_heads:
              replace_once(backup, old, new, label)

          pdf = Path('lib/services/pdf_report_service.dart')
          replace_once(
              pdf,
              "          : 'Kişi kapsamı: ${report.selectedPersonNames.join(', ')}',\n",
              "          : 'Kişi kapsamı: ${report.selectedPersonNames.map(MizanI18n.user).join(', ')}',\n",
              'PDF selected person user-text isolation',
          )
          replace_once(
              pdf,
              """          final note = detail.expense.note.trim().isEmpty
              ? null
              : detail.expense.note.trim();
""",
              """          final note = detail.expense.note.trim().isEmpty
              ? null
              : MizanI18n.user(detail.expense.note.trim());
""",
              'PDF expense note user-text isolation',
          )
          replace_once(
              pdf,
              """      await _text(
        person.personName,
""",
              """      await _text(
        MizanI18n.user(person.personName),
""",
              'PDF person heading user-text isolation',
          )
          pdf_text = pdf.read_text(encoding='utf-8')
          continued_count = pdf_text.count('continuedTitle: person.personName,')
          if continued_count < 1:
              raise SystemExit('PDF person continuedTitle isolation: no matches')
          pdf.write_text(
              pdf_text.replace(
                  'continuedTitle: person.personName,',
                  'continuedTitle: MizanI18n.user(person.personName),',
              ),
              encoding='utf-8',
          )
          print(f'patched: PDF person continuedTitle isolation ({continued_count})')

          multicurrency_test = Path('test/csv_multicurrency_identity_test.dart')
          test_text = multicurrency_test.read_text(encoding='utf-8')
          helper = r'''
MizanState _legacyIdlessState(String suffix, String currency) {
  final json = _state(suffix, currency).toJson();
  final person = (json['people'] as List<dynamic>).single as Map<String, dynamic>;
  final bank =
      (person['banks'] as List<dynamic>).single as Map<String, dynamic>;
  ((bank['products'] as List<dynamic>).single as Map<String, dynamic>)['id'] =
      '';
  ((person['personalDebts'] as List<dynamic>).single
      as Map<String, dynamic>)['id'] = '';
  ((person['bills'] as List<dynamic>).single as Map<String, dynamic>)['id'] = '';
  ((person['subscriptions'] as List<dynamic>).single
      as Map<String, dynamic>)['id'] = '';
  ((person['rents'] as List<dynamic>).single as Map<String, dynamic>)['id'] = '';
  ((json['expenses'] as List<dynamic>).single as Map<String, dynamic>)['id'] = '';
  ((json['incomes'] as List<dynamic>).single as Map<String, dynamic>)['id'] = '';
  return MizanState.fromJson(json);
}

'''
          if '_legacyIdlessState(' in test_text:
              raise SystemExit('legacy id-less helper already exists unexpectedly')
          test_text = test_text.replace('void main() {\n', helper + 'void main() {\n', 1)
          new_case = r'''
  test(
    'legacy id-less merge fingerprints keep otherwise identical currency records separate',
    () {
      const service = CsvBackupService();
      final current = _legacyIdlessState('usd', 'USD');
      final imported = _legacyIdlessState('eur', 'EUR');

      final merged = service.mergeStates(current, imported).state;

      expect(merged.allDebtProducts, hasLength(2));
      expect(merged.allPersonalDebts, hasLength(2));
      expect(merged.allBills, hasLength(2));
      expect(merged.allSubscriptions, hasLength(2));
      expect(merged.allRents, hasLength(2));
      expect(merged.expenses, hasLength(2));
      expect(merged.incomes, hasLength(2));
      for (final codes in <Iterable<String>>[
        merged.allDebtProducts.map((item) => item.currencyCode),
        merged.allPersonalDebts.map((item) => item.currencyCode),
        merged.allBills.map((item) => item.currencyCode),
        merged.allSubscriptions.map((item) => item.currencyCode),
        merged.allRents.map((item) => item.currencyCode),
        merged.expenses.map((item) => item.currencyCode),
        merged.incomes.map((item) => item.currencyCode),
      ]) {
        expect(codes.toSet(), {'USD', 'EUR'});
      }
    },
  );
'''
          last_brace = test_text.rfind('\n}')
          if last_brace < 0:
              raise SystemExit('csv multicurrency test main closing brace not found')
          test_text = test_text[:last_brace] + new_case + test_text[last_brace:]
          multicurrency_test.write_text(test_text, encoding='utf-8')
          print('patched: legacy id-less multi-currency merge regression test')

          annual_test = Path('test/annual_income_backup_contract_test.dart')
          if annual_test.exists():
              raise SystemExit('annual income backup test unexpectedly already exists')
          annual_test.write_text(r'''import 'package:flutter_test/flutter_test.dart';
import 'package:lefferion_prime_mizan/models/mizan_models.dart';
import 'package:lefferion_prime_mizan/services/csv_backup_service.dart';
import 'package:lefferion_prime_mizan/services/report_service.dart';

void main() {
  test('annual income survives CSV round-trip and is counted only once per year', () {
    const backup = CsvBackupService();
    final source = MizanState(
      people: const [],
      expenseCategories: const [],
      expenses: const [],
      notificationSlots: const [],
      incomes: [
        IncomeEntry(
          id: 'annual-income',
          currencyCode: 'EUR',
          title: 'Annual bonus',
          amount: 12000,
          frequency: IncomeFrequency.yearly,
          startDate: DateTime(2026, 7, 31),
          note: 'user text stays user text',
        ),
      ],
      setupCompleted: true,
      appLanguageTag: 'en',
      debtRegionCountryCode: 'DE',
      defaultCurrencyCode: 'EUR',
      recentCurrencyCodes: const ['EUR', 'USD'],
    );

    final restored = backup.importState(backup.exportState(source));
    final income = restored.incomes.single;

    expect(income.frequency, IncomeFrequency.yearly);
    expect(income.currencyCode, 'EUR');
    expect(income.amount, 12000);
    expect(income.title, 'Annual bonus');
    expect(income.note, 'user text stays user text');
    expect(
      income.occurrenceCount(DateTime(2026, 1, 1), DateTime(2028, 12, 31)),
      3,
    );
    expect(
      income.totalForRange(DateTime(2027, 7, 1), DateTime(2027, 7, 31)),
      12000,
    );
    expect(
      income.totalForRange(DateTime(2027, 8, 1), DateTime(2027, 8, 31)),
      0,
    );

    final july = const MizanReportService().build(
      state: restored,
      filter: ReportFilter(
        period: ReportPeriod.monthly,
        anchorDate: DateTime(2027, 7, 1),
      ),
      now: DateTime(2027, 7, 31),
    );
    final august = const MizanReportService().build(
      state: restored,
      filter: ReportFilter(
        period: ReportPeriod.monthly,
        anchorDate: DateTime(2027, 8, 1),
      ),
      now: DateTime(2027, 8, 31),
    );
    expect(july.totalIncomeByCurrency, {'EUR': 12000});
    expect(august.totalIncomeByCurrency, isEmpty);

    final available = restored
        .availableReportMonths(DateTime(2028, 12, 31))
        .map((date) => '${date.year}-${date.month}')
        .toSet();
    expect(available, {'2026-7', '2027-7', '2028-7'});
  });
}
''', encoding='utf-8')
          print('created: annual income backup/report regression test')
          PY

          dart format \
            lib/models/mizan_models.dart \
            lib/screens/record_form_dialogs.dart \
            lib/services/csv_backup_service.dart \
            lib/services/pdf_report_service.dart \
            test/csv_multicurrency_identity_test.dart \
            test/annual_income_backup_contract_test.dart
          git diff --check

      - name: Verify analysis and backup/report contracts
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test \
            test/annual_income_backup_contract_test.dart \
            test/csv_multicurrency_identity_test.dart \
            test/csv_legacy_tr_currency_migration_test.dart \
            test/global_preferences_backup_invariants_test.dart \
            test/record_currency_persistence_contract_test.dart

      - name: Commit verified correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-global-record-income-contract.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(global): preserve record naming, annual income, and backup identity'
          git fetch origin agent/chinese-localization
          git rebase origin/agent/chinese-localization
          git push origin HEAD:agent/chinese-localization
