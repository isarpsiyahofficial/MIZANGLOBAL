name: Greek localization candidate bootstrap

on:
  push:
    branches:
      - agent/greek-localization
    paths:
      - .github/workflows/greek-bootstrap.yml
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/greek-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greek-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-candidate-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated Greek branch
        uses: actions/checkout@v4
        with:
          ref: agent/greek-localization
          fetch-depth: 0

      - name: Verify all transport chunks
        run: |
          set -euo pipefail
          cat > /tmp/greek-chunks.sha256 <<'EOF'
          9e560f497cf27f3a3763747c29b184453815efda67cf00ea36ac4baa5ba67d92  tools/greek_bootstrap_parts/script.00.b64
          3871533c545d720bea2a0a07a3d22c52795618582991c8f11211cc37a30a5e0a  tools/greek_bootstrap_parts/script.01.b64
          ecb96c4cab67760fb3925412380d6648cab72ecd371441c04dbf8138be7e1ce7  tools/greek_bootstrap_parts/script.02.b64
          544f1e75e55031d740e27f33f8ececbec21ad5257e7d7d054936f4c80f1c33cc  tools/greek_bootstrap_parts/script.03.b64
          b380d14d978818bb21873cbb6d92f2f88f712c9cc821028eb28ee5b6a75135d5  tools/greek_bootstrap_parts/script.04.b64
          36d82707b8bb9487a12d80fed204b21fc82d76a2e86f6b64ac7a87d6fb5e3188  tools/greek_bootstrap_parts/script.05.b64
          65e17d51f7098c7e72db0b3ed6c87a29c842e3db6dfc97425734be077f8babe6  tools/greek_bootstrap_parts/script.06.b64
          51a1cda982eb98d2fce2c67e82547629c9e6a66fb8508678b1e2458593aec037  tools/greek_bootstrap_parts/script.07.b64
          0d66ebbb3b837d46d38d6ec3998682ac76c60ccae3801d82e3f6fd90a80c859a  tools/greek_bootstrap_parts/script.08.b64
          c0ab1d3144893f21d2a84af8b4c726ab088beb9478fec28110bb078d79ee1ab6  tools/greek_bootstrap_parts/workflow.00.b64
          87642295559d722643afb2649b8c4e77e0dd28f29867a6bd2ff062959e5a245c  tools/greek_bootstrap_parts/workflow.01.b64
          EOF
          sha256sum -c /tmp/greek-chunks.sha256

      - name: Assemble and verify candidate tools
        run: |
          set -euo pipefail
          cat tools/greek_bootstrap_parts/script.*.b64 | base64 --decode > tools/generate_greek_candidate.py
          echo '8d851cacc30833a6722b646769604ba1dcebb58701eaa254cdf2411e4bd5e4a6  tools/generate_greek_candidate.py' | sha256sum -c -
          cat tools/greek_bootstrap_parts/workflow.*.b64 | base64 --decode > .github/workflows/greek-candidate.yml
          echo '815ad69fab62747b7caffbe6b3804ed8983d5150676a92c42c36492c7e24f651  .github/workflows/greek-candidate.yml' | sha256sum -c -
          python -m py_compile tools/generate_greek_candidate.py

      - name: Publish candidate tools and remove transport files
        run: |
          set -euo pipefail
          rm -rf tools/greek_bootstrap_parts
          rm -f tools/greek_candidate_bootstrap.tar.gz.b64
          rm -f .github/workflows/greek-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(el): install fail-closed Greek candidate generator'
          git push origin HEAD:agent/greek-localization
