name: Urdu source materialization handoff

on:
  pull_request:
    branches: [agent/urdu-materialize-fast-target]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: urdu-source-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/urdu-localization'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out Urdu source branch
        uses: actions/checkout@v4
        with:
          ref: agent/urdu-localization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize reviewed Urdu source pack
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Join-Path $env:RUNNER_TEMP 'urdu_bootstrap.py'
          Copy-Item tools/bootstrap_urdu_locale.py $bootstrap -Force
          python $bootstrap

          $status = @(git status --porcelain=v1)
          Write-Host "Materialized change count: $($status.Count)"
          $status | ForEach-Object { Write-Host $_ }
          if ($status.Count -lt 15) {
            throw "Expected at least 15 materialized source changes, found $($status.Count)."
          }

          git add -N .
          git -c core.whitespace=-cr-at-eol diff --check
      - name: Commit materialized source for manual review
        run: |
          $ErrorActionPreference = 'Stop'
          $status = @(git status --porcelain=v1)
          if ($status.Count -eq 0) {
            Write-Host 'Urdu source is already materialized.'
            exit 0
          }
          git config user.name 'mizanglobal-bot'
          git config user.email 'bot@mizanglobal.local'
          git add -A
          git commit -m 'feat(ur): materialize Urdu localization for manual verification'
          git push origin HEAD:agent/urdu-localization
