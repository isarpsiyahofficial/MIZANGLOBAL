name: Backup hardening static gate 20260906

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/backup-hardening-static-gate-20260906.yml

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind backup exclusions into structural validator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/validate_project.py')
          text=p.read_text(encoding='utf-8')

          old='    android_manifest = read("android/app/src/main/AndroidManifest.xml")\n    main_activity = read('
          new='    android_manifest = read("android/app/src/main/AndroidManifest.xml")\n    backup_rules = read("android/app/src/main/res/xml/backup_rules.xml")\n    data_extraction_rules = read("android/app/src/main/res/xml/data_extraction_rules.xml")\n    main_activity = read('
          if text.count(old) != 1:
              raise SystemExit('validator Android manifest declaration anchor changed')
          text=text.replace(old,new,1)

          old='            "${admobApplicationId}",\n        ],\n        "Android monetization manifest incomplete",'
          new='            "${admobApplicationId}",\n            \'android:allowBackup="false"\',\n            \'android:fullBackupContent="@xml/backup_rules"\',\n            \'android:dataExtractionRules="@xml/data_extraction_rules"\',\n        ],\n        "Android monetization/security manifest incomplete",'
          if text.count(old) != 1:
              raise SystemExit('validator Android manifest requirement anchor changed')
          text=text.replace(old,new,1)

          anchor='    require_absent(\n        android_manifest + android_gradle + main_activity,'
          block='''    require_all(\n        backup_rules,\n        [\n            '<full-backup-content>',\n            '<exclude domain="root" path="."/>',\n            '<exclude domain="file" path="."/>',\n            '<exclude domain="database" path="."/>',\n            '<exclude domain="sharedpref" path="."/>',\n            '<exclude domain="external" path="."/>',\n            '<exclude domain="device_root" path="."/>',\n            '<exclude domain="device_file" path="."/>',\n            '<exclude domain="device_database" path="."/>',\n            '<exclude domain="device_sharedpref" path="."/>',\n        ],\n        "Legacy Android backup exclusions incomplete",\n        failures,\n    )\n    require_all(\n        data_extraction_rules,\n        [\n            '<data-extraction-rules>',\n            '<cloud-backup>',\n            '<device-transfer>',\n            '<exclude domain="root" path="."/>',\n            '<exclude domain="file" path="."/>',\n            '<exclude domain="database" path="."/>',\n            '<exclude domain="sharedpref" path="."/>',\n            '<exclude domain="external" path="."/>',\n            '<exclude domain="device_root" path="."/>',\n            '<exclude domain="device_file" path="."/>',\n            '<exclude domain="device_database" path="."/>',\n            '<exclude domain="device_sharedpref" path="."/>',\n        ],\n        "Android 12+ backup/transfer exclusions incomplete",\n        failures,\n    )\n'''
          if text.count(anchor) != 1:
              raise SystemExit('validator Android absence anchor changed')
          text=text.replace(anchor,block+anchor,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Static verification only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ['android/app/src/main/res/xml/backup_rules.xml','android/app/src/main/res/xml/data_extraction_rules.xml']:
              ET.parse(path)
              print(f'XML_OK={path}')
          PY
          python3 tools/validate_project.py
          python3 tools/audit_visible_copy_coverage.py
          python3 tools/audit_cross_language_leaks.py
          python3 tools/audit_auxiliary_language_surfaces.py
          git diff --check
          ! grep -R -nEi '\b(ChatGPT|OpenAI|Copilot|Claude|Anthropic|Gemini|AI-generated|generated by AI)\b' lib android/app/src/main
          ! grep -R -nEi 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}' lib android tools
      - name: Commit validator contract only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = 'tools/validate_project.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_project.py
          git commit -m 'security: enforce Android local-data backup exclusions'
          git push
