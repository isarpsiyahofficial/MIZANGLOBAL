name: Finalize existing exact LP brand source

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/finalize-existing-brand-source.yml

permissions:
  contents: write

env:
  FINAL_LOGO_PIXEL_SHA256: "59e6bc2a19714a9761cff46582b801b87136369f98ff9be215da4c24823748de"

jobs:
  finalize-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact production branch
        uses: actions/checkout@v4
        with:
          ref: agent/mizan-production-release-20260905
          fetch-depth: 0

      - name: Verify master pixels and generate adaptive foreground
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image
          import os

          master_path = Path('assets/brand/lefferion-prime-logo-v3.png')
          foreground_path = Path('assets/brand/lefferion-prime-logo-v3-foreground.png')
          expected = os.environ['FINAL_LOGO_PIXEL_SHA256']

          raw = master_path.read_bytes()
          print('master_file_sha256=' + sha256(raw).hexdigest())
          with Image.open(master_path) as image:
              master = image.convert('RGBA')
          print('master_size=' + repr(master.size))
          actual = sha256(master.tobytes()).hexdigest()
          print('master_pixel_sha256=' + actual)
          if master.size != (2048, 2048):
              raise SystemExit(f'wrong master size: {master.size}')
          if actual != expected:
              raise SystemExit('existing source is not the final APK logo; refusing to change brand assets')

          scale = 0.65
          side = round(2048 * scale)
          resized = master.resize((side, side), Image.Resampling.LANCZOS)
          foreground = Image.new('RGBA', (2048, 2048), (0, 0, 0, 0))
          offset = ((2048 - side) // 2, (2048 - side) // 2)
          foreground.alpha_composite(resized, offset)
          bbox = foreground.getchannel('A').getbbox()
          if bbox is None:
              raise SystemExit('adaptive foreground is empty')
          width = bbox[2] - bbox[0]
          height = bbox[3] - bbox[1]
          if width / 2048 > 0.62 or height / 2048 > 0.62:
              raise SystemExit(f'adaptive foreground exceeds safe bounds: {bbox}')
          foreground.save(foreground_path, format='PNG', optimize=True, compress_level=9)
          print('adaptive_alpha_bbox=' + repr(bbox))
          print('adaptive_file_sha256=' + sha256(foreground_path.read_bytes()).hexdigest())
          PY

      - name: Commit responsive launcher foreground and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LEFFERION PRIME Release Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git rm .github/workflows/finalize-existing-brand-source.yml
          git add assets/brand/lefferion-prime-logo-v3-foreground.png
          git diff --cached --stat
          git commit -m 'brand: finalize exact LP master and responsive launcher foreground'
          git push origin HEAD:agent/mizan-production-release-20260905
