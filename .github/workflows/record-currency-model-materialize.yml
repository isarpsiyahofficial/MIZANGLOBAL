name: Record currency model materialization

on:
  push:
    branches: [agent/chinese-localization]

permissions:
  contents: write

concurrency:
  group: record-currency-model-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Materialize backward-compatible record currencies
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/materialize_record_currency_models.py
          python tools/materialize_record_currency_models.py
          dart format lib/models/mizan_models.dart
          flutter pub get
          flutter analyze
      - name: Commit materialized model and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize_record_currency_models.py
          rm -f .github/workflows/record-currency-model-materialize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(currency): persist record-level ISO currency identities'
          git push origin HEAD:agent/chinese-localization
