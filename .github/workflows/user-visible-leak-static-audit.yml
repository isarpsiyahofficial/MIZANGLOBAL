name: User-visible leak static audit

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/user-visible-leak-static-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run existing localization audits without build or tests
        shell: bash
        run: |
          set +e
          python3 tools/audit_visible_copy_coverage.py; echo "VISIBLE_COPY_EXIT=$?"
          python3 tools/audit_cross_language_leaks.py; echo "CROSS_LANGUAGE_EXIT=$?"
          python3 tools/audit_auxiliary_language_surfaces.py; echo "AUXILIARY_EXIT=$?"
          exit 0
      - name: Scan bypass surfaces not covered by localized Text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files=list(Path('lib').rglob('*.dart'))
          ai=re.compile(r'(?i)\b(chatgpt|openai|copilot|generated by ai|artificial intelligence)\b')
          internal=re.compile(r'(?i)\b(debug|internal build|test ad|test mode|backend|server-side|stack trace)\b')
          decoration=re.compile(r"(?:labelText|hintText|helperText|errorText|dialogTitle)\s*:\s*(['\"])(.*?)\1")
          direct_text=re.compile(r"(?:const\s+)?Text\(\s*(['\"])(.*?)\1",re.S)
          print('=== AI_PROVENANCE ===')
          for p in files:
              text=p.read_text(encoding='utf-8')
              for i,line in enumerate(text.splitlines(),1):
                  if ai.search(line): print(f'{p}:{i}: {line.strip()}')
          print('=== INTERNAL_TERMS_IN_LIB ===')
          for p in files:
              text=p.read_text(encoding='utf-8')
              for i,line in enumerate(text.splitlines(),1):
                  if internal.search(line): print(f'{p}:{i}: {line.strip()}')
          print('=== DIRECT_MATERIAL_TEXT_LITERALS ===')
          for p in files:
              text=p.read_text(encoding='utf-8')
              if "package:flutter/material.dart" not in text or "core/localized_material.dart" in text:
                  continue
              for m in direct_text.finditer(text):
                  value=m.group(2).strip().replace('\n',' ')
                  if value and value not in {'PRO','PDF','CSV'}:
                      line=text.count('\n',0,m.start())+1
                      print(f'{p}:{line}: {value[:200]}')
          print('=== UNWRAPPED_INPUT_DECORATION_LITERALS ===')
          for p in files:
              text=p.read_text(encoding='utf-8')
              for m in decoration.finditer(text):
                  line=text.count('\n',0,m.start())+1
                  value=m.group(2).strip().replace('\n',' ')
                  context=text[max(0,m.start()-160):m.start()+50]
                  if 'MizanI18n.text' not in context:
                      print(f'{p}:{line}: {m.group(0)[:240]}')
          print('=== PDF_RENDERER_TURKISH_LITERALS ===')
          p=Path('lib/services/pdf_report_renderer.dart')
          text=p.read_text(encoding='utf-8')
          turkish_markers=re.compile(r"['\"]([^'\"]*(?:[çğıöşüÇĞİÖŞÜ]|\b(?:Sayfa|günlük|ödeme|GÜN|harcama|Kalan|Gelir|Gider|Toplam|Tarih)\b)[^'\"]*)['\"]")
          for m in turkish_markers.finditer(text):
              line=text.count('\n',0,m.start())+1
              print(f'{p}:{line}: {m.group(1)[:220]}')
          PY
