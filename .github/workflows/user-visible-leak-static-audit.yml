name: User-visible leak cleanup

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/user-visible-leak-static-audit.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove only the user-facing assistant-style disclaimer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          phrase = 'Lefferion Prime - MİZAN hata yapabilir. Lütfen vade, gecikme ve ödeme bilgilerini son kez kontrol edin.'

          form = Path('lib/screens/record_form_dialogs.dart')
          text = form.read_text(encoding='utf-8')
          if text.count(phrase) != 1:
              raise SystemExit(f'form disclaimer count changed: {text.count(phrase)}')
          marker = text.index(phrase)
          start = text.rfind('\n        Container(', 0, marker)
          end = text.find('\n        _TwoColumn(', marker)
          if start < 0 or end < 0 or start >= marker or end <= marker:
              raise SystemExit('unable to isolate disclaimer container safely')
          text = text[:start] + text[end:]
          form.write_text(text, encoding='utf-8')

          pdf = Path('lib/services/pdf_report_renderer.dart')
          text = pdf.read_text(encoding='utf-8')
          if text.count(phrase) != 1:
              raise SystemExit(f'pdf disclaimer count changed: {text.count(phrase)}')
          exact = """      MizanI18n.text(\n        'Lefferion Prime - MİZAN hata yapabilir. Lütfen vade, gecikme ve ödeme bilgilerini son kez kontrol edin.',\n        languageTag: report.languageTag,\n      ),\n"""
          if text.count(exact) != 1:
              raise SystemExit('exact PDF disclaimer block not found once')
          text = text.replace(exact, '', 1)
          pdf.write_text(text, encoding='utf-8')

          for path in (form, pdf):
              if phrase in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'disclaimer still visible from {path}')
          PY

      - name: Static localization and leakage gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_visible_copy_coverage.py
          python3 tools/audit_cross_language_leaks.py
          python3 tools/audit_auxiliary_language_surfaces.py
          ! grep -R -nF 'Lefferion Prime - MİZAN hata yapabilir.' lib/screens lib/services
          ! grep -R -nEi '\b(ChatGPT|OpenAI|Copilot|generated by AI|artificial intelligence)\b' lib/screens lib/widgets lib/services lib/monetization

      - name: Commit only the two visible-copy removals
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'lib/screens/record_form_dialogs.dart\nlib/services/pdf_report_renderer.dart'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/record_form_dialogs.dart lib/services/pdf_report_renderer.dart
          git commit -m 'ui: remove assistant-style user disclaimer'
          git push
