name: User-visible leak static audit

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/user-visible-leak-static-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Scan user-visible surfaces without build or tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('lib')]
          files = [p for root in roots for p in root.rglob('*.dart')]
          suspicious = re.compile(r'(?i)\b(chatgpt|openai|copilot|generated by ai|artificial intelligence|debug|internal build|test ad|test mode|backend|server-side|stack trace|exception|fingerprint|hmac|sha-?256|todo|fixme)\b')
          ui_patterns = [
              re.compile(r"(?:const\s+)?Text\(\s*(['\"])(.*?)\1", re.S),
              re.compile(r"(?:title|subtitle|labelText|hintText|helperText|dialogTitle)\s*:\s*(['\"])(.*?)\1", re.S),
              re.compile(r"PageHeader\([^\)]*?title\s*:\s*(['\"])(.*?)\1", re.S),
              re.compile(r"MizanListCard\([^\)]*?title\s*:\s*(['\"])(.*?)\1", re.S),
          ]
          findings=[]
          hardcoded=[]
          raw_errors=[]
          for p in files:
              text=p.read_text(encoding='utf-8')
              for i,line in enumerate(text.splitlines(),1):
                  if suspicious.search(line):
                      findings.append((str(p),i,line.strip()))
                  if re.search(r"(?:Text|SnackBar|showDialog|_showMessage).*?(?:\$error|\$e\b|toString\(\))", line):
                      raw_errors.append((str(p),i,line.strip()))
              if '/l10n/' in str(p) or '/legal/' in str(p) or 'monetization_strings.dart' in str(p):
                  continue
              for pat in ui_patterns:
                  for m in pat.finditer(text):
                      literal=m.group(2).strip()
                      if not literal or literal in {'PRO','PDF','CSV'}:
                          continue
                      line=text.count('\n',0,m.start())+1
                      hardcoded.append((str(p),line,literal.replace('\n',' ')[:180]))

          print('=== SUSPICIOUS_TECHNICAL_TERMS ===')
          for x in findings: print(f'{x[0]}:{x[1]}: {x[2]}')
          print('=== RAW_ERROR_EXPOSURE_CANDIDATES ===')
          for x in raw_errors: print(f'{x[0]}:{x[1]}: {x[2]}')
          print('=== HARDCODED_USER_VISIBLE_LITERALS ===')
          for x in hardcoded: print(f'{x[0]}:{x[1]}: {x[2]}')
          print('=== COUNTS ===')
          print('technical=',len(findings),'raw_error=',len(raw_errors),'hardcoded_ui=',len(hardcoded))
          PY
