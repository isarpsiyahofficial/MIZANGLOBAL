name: Tune Romanian candidate generator

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/tune-romanian-candidate-generator.yml
      - tools/tune_romanian_candidate_generator.py

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Romanian branch
        uses: actions/checkout@v4
        with:
          ref: agent/romanian-localization
          fetch-depth: 0

      - name: Tune bounded generator
        run: python tools/tune_romanian_candidate_generator.py

      - name: Compile generator
        run: python -m py_compile tools/generate_romanian_candidate.py

      - name: Commit tuned generator
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_romanian_candidate.py
          if git diff --cached --quiet; then
            echo 'Romanian candidate generator already tuned.'
          else
            git commit -m 'fix(ro): make candidate generation resilient'
            git pull --rebase origin agent/romanian-localization
            git push origin HEAD:agent/romanian-localization
          fi
