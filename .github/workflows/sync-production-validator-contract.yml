name: Sync production validator contract

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/sync-production-validator-contract.yml

permissions:
  contents: write

jobs:
  sync-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: agent/mizan-production-release-20260905
          fetch-depth: 0

      - name: Align static validator with production contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/validate_project.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'android_workflow = read(".github/workflows/android-release.yml")':
                  'android_workflow = read(".github/workflows/android-production-release.yml")',
              '"Duration(seconds: 120)"': '"Duration(seconds: 60)"',
              '"40d844f4232ec3ccfec81fd04e7256d1b3fcfcc471f2439629d21a6d80eccdaa"':
                  '"7760e30e51c9544ea3ef88213528fc87bcc33eb8fd5addcb5d108bb234dd45c4"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          old_block = '''        [
            "tools/configure_android.py",
            "Verify serverless monetization native integration",
            "dart format --output=none --set-exit-if-changed lib test",
            "flutter analyze --fatal-warnings",
            "flutter test --reporter expanded",
            "flutter build apk --release",
            "MIZAN_ALLOW_TEST_RELEASE",
            "actions/upload-artifact@v4",
            "audit_auxiliary_language_surfaces.py",
        ],
        "Android CI/build gate incomplete",'''
          new_block = '''        [
            "workflow_dispatch:",
            "Production release input gate",
            "MIZAN_ADMOB_APP_ID",
            "MIZAN_RELEASE_KEYSTORE_B64",
            "MIZAN_TEST_ADS=false",
            "flutter build apk --release",
            "flutter build appbundle --release",
            "APK Signature Scheme v2+",
            "actions/upload-artifact@v4",
        ],
        "Android production release gate incomplete",'''
          count = text.count(old_block)
          if count != 1:
              raise SystemExit(f'expected one legacy Android gate block, found {count}')
          text = text.replace(old_block, new_block)

          old_absent = '''        ["flutter create . --platforms=android", "contents: write"],
        "Android CI contains destructive or temporary write behavior",'''
          new_absent = '''        [
            "flutter create . --platforms=android",
            "contents: write",
            "MIZAN_ALLOW_TEST_RELEASE",
        ],
        "Android production workflow contains test-release or write behavior",'''
          count = text.count(old_absent)
          if count != 1:
              raise SystemExit(f'expected one legacy Android absent block, found {count}')
          text = text.replace(old_absent, new_absent)

          if 'Duration(seconds: 120)' in text:
              raise SystemExit('legacy 120-second monetization contract remains')
          if '40d844f4232ec3ccfec81fd04e7256d1b3fcfcc471f2439629d21a6d80eccdaa' in text:
              raise SystemExit('legacy promotion fingerprint remains')
          if '.github/workflows/android-release.yml' in text:
              raise SystemExit('removed internal release workflow remains referenced')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit validator-only synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LEFFERION PRIME Release Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git rm .github/workflows/sync-production-validator-contract.yml
          git add tools/validate_project.py
          changed=$(git diff --cached --name-only)
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sort | tr '\n' ' ')" = ".github/workflows/sync-production-validator-contract.yml tools/validate_project.py "
          git commit -m 'contracts: sync static validator with production release'
          git push origin HEAD:agent/mizan-production-release-20260905
