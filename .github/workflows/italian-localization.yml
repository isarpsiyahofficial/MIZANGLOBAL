name: Italian localization native-language audit

on:
  push:
    branches:
      - agent/italian-localization
    paths:
      - .github/workflows/italian-localization.yml
      - tools/italian_native_terms.json
      - tools/patch_italian_native_review_round1.py
      - tools/patch_italian_native_review_round2.py
      - tools/patch_italian_dynamic_review_round3.py
      - tools/patch_italian_existing_language_regressions.py
      - tools/audit_italian_native_copy.py
      - tools/audit_italian_full_copy.py
      - tools/build_italian_locale.py
      - tools/build_german_locale.py
      - tools/build_french_locale.py
      - tools/build_pt_pt_locale.py
      - tools/patch_pt_pt_validators.py
      - tools/validate_english_localization.py
      - tools/validate_spanish_localization.py
      - tools/validate_portuguese_br_localization.py
      - lib/l10n/mizan_it.dart
      - lib/l10n/mizan_it_dynamic.dart
      - lib/l10n/it/**
      - lib/l10n/mizan_i18n.dart
      - lib/main.dart
      - lib/global/global_catalog.dart
      - lib/core/formatters.dart
      - lib/widgets/global_picker_dialog.dart
      - assets/data/languages_v1.json
      - assets/data/countries_v1.json
      - assets/data/currencies_v1.json
      - test/**
  pull_request:
    branches:
      - agent/mizanglobal-globalization

permissions:
  contents: write

concurrency:
  group: italian-localization-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  build-audit-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Italian localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/italian-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic catalog dependency
        run: python -m pip install 'Babel>=2.15,<3'

      - name: Apply fail-closed Italian contract corrections
        run: python tools/patch_italian_native_review_round1.py

      - name: Apply reviewed compact-copy corrections
        run: python tools/patch_italian_native_review_round2.py

      - name: Apply reviewed dynamic agreement corrections
        run: python tools/patch_italian_dynamic_review_round3.py

      - name: Audit reviewed native Italian core source
        run: python tools/audit_italian_native_copy.py

      - name: Audit all reviewed native Italian source
        run: python tools/audit_italian_full_copy.py

      - name: Build and integrate reviewed Italian locale
        run: python tools/build_italian_locale.py

      - name: Update existing-language regression expectations
        run: python tools/patch_italian_existing_language_regressions.py

      - name: Re-audit integrated Italian source
        run: |
          python tools/build_italian_locale.py --verify
          python tools/audit_italian_full_copy.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Italian and integrated product sources
        run: |
          dart format \
            lib/l10n/it \
            lib/l10n/mizan_it.dart \
            lib/l10n/mizan_it_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/main.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            lib/widgets/global_picker_dialog.dart \
            test/italian_localization_test.dart \
            test/italian_end_to_end_test.dart \
            test/italian_responsive_test.dart \
            test/language_restart_test.dart \
            test/portuguese_pt_localization_test.dart \
            test/portuguese_pt_picker_purity_test.dart \
            test/portuguese_pt_end_to_end_test.dart \
            test/portuguese_br_localization_test.dart \
            test/portuguese_br_picker_purity_test.dart \
            test/spanish_localization_test.dart \
            test/spanish_picker_purity_test.dart \
            test/english_localization_test.dart \
            test/french_localization_test.dart \
            test/french_end_to_end_test.dart \
            test/french_responsive_test.dart \
            test/german_localization_test.dart \
            test/german_end_to_end_test.dart \
            test/german_responsive_test.dart

      - name: Verify Italian source after formatting
        run: |
          python tools/build_italian_locale.py --verify
          python tools/audit_italian_full_copy.py

      - name: Validate existing languages remain intact
        run: |
          python tools/validate_english_localization.py
          python tools/validate_spanish_localization.py
          python tools/validate_portuguese_br_localization.py
          python tools/validate_spanish_visible_copy.py
          python tools/build_french_locale.py --verify
          python tools/build_german_locale.py --verify

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Italian terminology grammar catalog and formatting tests
        run: timeout 5m flutter test --reporter expanded test/italian_localization_test.dart

      - name: Italian reports reminders and data-protection tests
        run: timeout 5m flutter test --reporter expanded test/italian_end_to_end_test.dart

      - name: Italian responsive overflow tests
        run: timeout 10m flutter test --reporter expanded test/italian_responsive_test.dart

      - name: Existing-language locale regression tests
        run: |
          set -euo pipefail
          for test_file in \
            test/language_restart_test.dart \
            test/portuguese_pt_localization_test.dart \
            test/portuguese_pt_picker_purity_test.dart \
            test/portuguese_pt_end_to_end_test.dart \
            test/portuguese_br_picker_purity_test.dart \
            test/portuguese_br_localization_test.dart \
            test/spanish_picker_purity_test.dart \
            test/spanish_localization_test.dart \
            test/english_localization_test.dart \
            test/french_localization_test.dart \
            test/french_end_to_end_test.dart \
            test/french_responsive_test.dart \
            test/german_localization_test.dart \
            test/german_end_to_end_test.dart \
            test/german_responsive_test.dart \
            test/global_setup_test.dart
          do
            echo "=== Existing-language regression: $test_file ==="
            timeout 10m flutter test --reporter expanded "$test_file"
          done

      - name: Storage report and notification regression tests
        run: |
          set -euo pipefail
          for test_file in \
            test/local_store_test.dart \
            test/csv_backup_test.dart \
            test/reminder_engine_test.dart \
            test/report_service_test.dart \
            test/pdf_report_test.dart \
            test/notification_migration_test.dart \
            test/notification_background_reliability_test.dart
          do
            echo "=== Storage/report/notification regression: $test_file ==="
            timeout 5m flutter test --reporter expanded "$test_file"
          done

      - name: Render every visual scenario without changing baselines
        run: |
          set -euo pipefail
          cp -a test/goldens /tmp/mizan-goldens
          timeout 12m flutter test --update-goldens test/visual_capture_test.dart
          rm -rf test/goldens
          cp -a /tmp/mizan-goldens test/goldens
          rm -rf test/failures test/output
          git diff --exit-code -- test/goldens

      - name: Full regression suite with isolated test lifecycles
        run: |
          set -euo pipefail
          while IFS= read -r -d '' test_file; do
            echo "=== Full regression: $test_file ==="
            timeout 5m flutter test --reporter expanded "$test_file"
          done < <(
            find test -maxdepth 1 -type f -name '*_test.dart' \
              ! -name 'visual_capture_test.dart' -print0 | sort -z
          )

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal release APK
        run: |
          mkdir -p build/italian-apk-audit/universal
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/italian-apk-audit/universal/mizan-global-italian-universal.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Generate APK size and hash report
        run: |
          set -euo pipefail
          mkdir -p build/italian-apk-audit/split
          cp build/app/outputs/flutter-apk/app-*-release.apk \
            build/italian-apk-audit/split/
          {
            echo "Audited source commit: $(git rev-parse HEAD)"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo
            echo "Exact byte sizes:"
            find build/italian-apk-audit -type f -name '*.apk' -print0 \
              | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo
            echo "SHA-256:"
            sha256sum build/italian-apk-audit/universal/*.apk \
              build/italian-apk-audit/split/*.apk
          } | tee build/italian-apk-audit/apk-size-report.txt

      - name: Commit deterministic Italian product sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/*.py \
            tools/italian_native_terms.json \
            assets/data/languages_v1.json \
            assets/data/countries_v1.json \
            assets/data/currencies_v1.json \
            lib/l10n/it \
            lib/l10n/mizan_it.dart \
            lib/l10n/mizan_it_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/main.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            lib/widgets/global_picker_dialog.dart \
            test/*.dart
          if git diff --cached --quiet; then
            echo 'Italian product source is already current.'
          else
            git commit -m 'l10n(it): integrate native Italian product source'
            git push origin HEAD:agent/italian-localization
          fi

      - name: Verify committed scope stayed clean
        run: |
          git restore test/output || true
          git clean -f test/output
          git diff --exit-code

      - name: Upload verified Italian APKs
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-italian-release-apks
          path: build/italian-apk-audit/
          if-no-files-found: error
          retention-days: 14
