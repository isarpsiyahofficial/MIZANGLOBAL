name: Apply language restart and Spanish integrity

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-language-restart-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Spanish candidate
        uses: actions/checkout@v5
        with:
          ref: agent/spanish-localization-candidate
          fetch-depth: 0

      - name: Apply deterministic restart and integrity changes
        run: python3 tools/apply_language_restart_integrity.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve format and validate
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test tools
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py
          git diff --check

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Language restart and localization tests
        run: |
          flutter test --reporter expanded \
            test/language_restart_test.dart \
            test/spanish_localization_test.dart \
            test/english_localization_test.dart \
            test/global_setup_test.dart \
            test/local_store_test.dart \
            test/report_service_test.dart \
            test/pdf_report_test.dart \
            test/reminder_engine_test.dart

      - name: Full regression suite
        run: flutter test --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Commit verified source changes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git restore test/output || true
          git config user.name "MIZAN Language Restart Verification"
          git config user.email "actions@users.noreply.github.com"
          git add lib test tools
          if git diff --cached --quiet; then
            echo "No restart source changes to commit."
            exit 0
          fi
          git commit -m "feat: restart safely after persisted language change"
          git push origin "HEAD:${HEAD_BRANCH}"
