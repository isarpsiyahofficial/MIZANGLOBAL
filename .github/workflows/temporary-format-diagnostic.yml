name: Temporary Dart format diagnostic

on:
  push:
    branches:
      - agent/mizan-monetization-premium

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Format and print exact files
        run: |
          set -euo pipefail
          dart format test/all_29_language_premium_surface_test.dart test/premium_screen_entitlement_visibility_test.dart
          echo '=== all_29_language_premium_surface_test.dart ==='
          cat test/all_29_language_premium_surface_test.dart
          echo '=== premium_screen_entitlement_visibility_test.dart ==='
          cat test/premium_screen_entitlement_visibility_test.dart
