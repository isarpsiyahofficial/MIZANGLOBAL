name: Apply one-time safe maintenance patch

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/apply-safe-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply deterministic source-only maintenance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          validator = Path('tools/validate_project.py')
          text = validator.read_text(encoding='utf-8')
          old_duration = 'Duration(seconds: 120)'
          if text.count(old_duration) != 1:
              raise SystemExit(f'validator: expected one stale 120-second token, found {text.count(old_duration)}')
          old_fingerprint = '40d844f4232ec3ccfec81fd04e7256d1b3fcfcc471f2439629d21a6d80eccdaa'
          if text.count(old_fingerprint) != 1:
              raise SystemExit(f'validator: expected one stale ESMANUR fingerprint, found {text.count(old_fingerprint)}')
          text = text.replace(old_duration, 'Duration(seconds: 60)')
          text = text.replace(
              old_fingerprint,
              '7760e30e51c9544ea3ef88213528fc87bcc33eb8fd5addcb5d108bb234dd45c4',
          )
          validator.write_text(text, encoding='utf-8')

          replace_once('pubspec.yaml', '  file_picker: 10.3.10', '  file_picker: 11.0.3')
          replace_once(
              'lib/screens/settings_screen.dart',
              'FilePicker.platform.saveFile(',
              'FilePicker.saveFile(',
          )
          replace_once(
              'lib/screens/settings_screen.dart',
              'FilePicker.platform.pickFiles(',
              'FilePicker.pickFiles(',
          )

          lock = Path('pubspec.lock')
          lock_text = lock.read_text(encoding='utf-8')
          old_lock = '''  file_picker:\n    dependency: "direct main"\n    description:\n      name: file_picker\n      sha256: "57d9a1dd5063f85fa3107fb42d1faffda52fdc948cefd5fe5ea85267a5fc7343"\n      url: "https://pub.dev"\n    source: hosted\n    version: "10.3.10"'''
          new_lock = '''  file_picker:\n    dependency: "direct main"\n    description:\n      name: file_picker\n      sha256: "29cc1fdb20613876cc7afc529738c1c0f11a9ca159b010edad0c566ac330847e"\n      url: "https://pub.dev"\n    source: hosted\n    version: "11.0.3"'''
          if lock_text.count(old_lock) != 1:
              raise SystemExit('pubspec.lock: exact file_picker 10.3.10 block not found once')
          lock.write_text(lock_text.replace(old_lock, new_lock), encoding='utf-8')

          checks = {
              'lib/monetization/monetization_config.dart': ['Duration(seconds: 60)'],
              'lib/monetization/local_promo_service.dart': ['7760e30e51c9544ea3ef88213528fc87bcc33eb8fd5addcb5d108bb234dd45c4'],
              'tools/validate_project.py': ['Duration(seconds: 60)', '7760e30e51c9544ea3ef88213528fc87bcc33eb8fd5addcb5d108bb234dd45c4'],
              'test/monetization_contract_test.dart': ['Duration(seconds: 60)', 'Duration(seconds: 59)', '7760e30e51c9544ea3ef88213528fc87bcc33eb8fd5addcb5d108bb234dd45c4'],
              'pubspec.yaml': ['file_picker: 11.0.3'],
              'pubspec.lock': ['version: "11.0.3"', '29cc1fdb20613876cc7afc529738c1c0f11a9ca159b010edad0c566ac330847e'],
              'lib/screens/settings_screen.dart': ['FilePicker.saveFile(', 'FilePicker.pickFiles('],
          }
          for path, tokens in checks.items():
              value = Path(path).read_text(encoding='utf-8')
              for token in tokens:
                  if token not in value:
                      raise SystemExit(f'{path}: missing {token}')

          forbidden = {
              'lib/monetization/monetization_config.dart': ['Duration(seconds: 90)', 'Duration(seconds: 120)'],
              'lib/monetization/local_promo_service.dart': [old_fingerprint],
              'tools/validate_project.py': ['Duration(seconds: 120)', old_fingerprint],
              'test/monetization_contract_test.dart': ['Duration(seconds: 120)', 'Duration(seconds: 119)', old_fingerprint],
              'lib/screens/settings_screen.dart': ['FilePicker.platform.saveFile(', 'FilePicker.platform.pickFiles('],
          }
          for path, tokens in forbidden.items():
              value = Path(path).read_text(encoding='utf-8')
              for token in tokens:
                  if token in value:
                      raise SystemExit(f'{path}: stale token remains: {token}')
          PY

      - name: Commit only deterministic maintenance files and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-safe-maintenance.yml
          git add tools/validate_project.py pubspec.yaml pubspec.lock lib/screens/settings_screen.dart
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "maintenance: harden file picker and sync final contracts"
          git push
