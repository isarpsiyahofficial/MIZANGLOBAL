name: One-shot visual baseline diagnostics

on:
  push:
    branches:
      - agent/chinese-localization

permissions:
  contents: write

jobs:
  visual-diagnostics:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Verify formatter-stable native audit
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/native_audit_formatter_stability_test.dart
          python3 tools/audit_indonesian_native_copy.py

      - name: Capture current visual differences without accepting them
        run: |
          set -euo pipefail
          rm -rf test/failures
          set +e
          flutter test test/visual_capture_test.dart 2>&1 | tee /tmp/visual-capture.log
          status=$?
          set -e
          echo "$status" > /tmp/visual-capture-exit-code.txt
          test -d test/failures

      - name: Upload actual expected and diff images
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diagnostics
          path: |
            test/failures
            test/goldens
            /tmp/visual-capture.log
            /tmp/visual-capture-exit-code.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary diagnostics workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-visual-diagnostics.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci: remove one-shot visual diagnostics workflow'
          git fetch origin agent/chinese-localization
          git rebase origin/agent/chinese-localization
          git push origin HEAD:agent/chinese-localization
