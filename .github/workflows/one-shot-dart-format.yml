name: One-shot exact Dart formatting

on:
  push:
    branches:
      - agent/chinese-localization
    paths:
      - .github/workflows/one-shot-dart-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Format tracked Dart sources exactly
        shell: bash
        run: |
          dart format lib test
          rm -f .github/workflows/one-shot-dart-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test .github/workflows/one-shot-dart-format.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git commit -m "style: apply exact Dart formatter before final audit"
          git push origin HEAD:agent/chinese-localization
