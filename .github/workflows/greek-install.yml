name: Greek localization locked source installation

on:
  push:
    branches:
      - agent/greek-localization
    paths:
      - .github/workflows/greek-install.yml
      - tools/greek_min_payload/**
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/greek-install.yml
      - tools/greek_min_payload/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greek-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out isolated Greek branch
        uses: actions/checkout@v4
        with:
          ref: agent/greek-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify every transport part
        run: |
          set -euo pipefail
          cat > /tmp/greek-min-parts.sha256 <<'EOF'
          d4419dc41475607c9f56ce01c43931bf660d1a7ba7a41b5cce68e534ed575a60  tools/greek_min_payload/part.00.b64
          c7f5210c190882cf0e30b66e85ba0d808c8678f9107ae28d33584166103ec3f0  tools/greek_min_payload/part.01.b64
          3d7bdb6fe5871d305894d7cf2124eb81c573fdfaa94af3136800e7f6a7f01830  tools/greek_min_payload/part.02.b64
          29a5ed158fd9fe0939e87bcd11998cfec0a87789870578709159c6d7489d924c  tools/greek_min_payload/part.03.b64
          5fb288841a37a564650b257df7221503ee126466cea3ae7f3a72924976fc8eef  tools/greek_min_payload/part.04.b64
          fbc4243dc10402b984e5b32dfe1708ec4ca07c52ecad6fda95daa3fb88ae531d  tools/greek_min_payload/part.05.b64
          EOF
          sha256sum -c /tmp/greek-min-parts.sha256

      - name: Assemble and verify locked reviewed package
        run: |
          set -euo pipefail
          cat tools/greek_min_payload/part.*.b64 | base64 --decode > /tmp/greek_bootstrap_min.tar.xz
          echo '7056af053ff6e14bd6bdab962017102383e81fab41f655354bff5fd0d63cfa10  /tmp/greek_bootstrap_min.tar.xz' | sha256sum -c -
          tar -tJf /tmp/greek_bootstrap_min.tar.xz
          tar -xJf /tmp/greek_bootstrap_min.tar.xz
          python -m py_compile tools/apply_greek_review.py tools/build_greek_locale.py tools/audit_greek_native_copy.py

      - name: Install deterministic catalog dependency
        run: python -m pip install 'Babel>=2.15,<3'

      - name: Apply locked native Greek review
        run: python tools/apply_greek_review.py

      - name: Build and integrate reviewed Greek locale
        run: python tools/build_greek_locale.py

      - name: Audit reviewed Greek source
        run: |
          python tools/build_greek_locale.py --verify
          python tools/audit_greek_native_copy.py

      - name: Validate all previously integrated languages remain intact
        run: |
          python tools/validate_english_localization.py
          python tools/validate_spanish_localization.py
          python tools/validate_portuguese_br_localization.py
          python tools/validate_spanish_visible_copy.py
          python tools/build_pt_pt_locale.py --verify
          python tools/build_french_locale.py --verify
          python tools/build_german_locale.py --verify
          python tools/build_italian_locale.py --verify
          python tools/build_dutch_locale.py --verify
          python tools/build_polish_locale.py --verify
          python tools/build_romanian_locale.py --verify

      - name: Verify reviewed runtime and catalog coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          i18n = (root / 'lib/l10n/mizan_i18n.dart').read_text(encoding='utf-8')
          assert "import 'mizan_el.dart';" in i18n
          assert "'el'" in i18n.split('supportedLanguageTags', 1)[1].split(';', 1)[0]
          assert "Locale('el', 'GR')" in (root / 'lib/main.dart').read_text(encoding='utf-8')
          review = json.loads((root / 'tools/greek_review.json').read_text(encoding='utf-8'))
          assert review['count'] == 791
          assert review['corrected'] == 214
          assert review['accepted'] == 577
          for filename, count in [('languages_v1.json', 29), ('countries_v1.json', 161), ('currencies_v1.json', 154)]:
              data = json.loads((root / 'assets/data' / filename).read_text(encoding='utf-8'))
              assert data['count'] == count
              assert all(item.get('nameEl') for item in data['items'])
          print('Greek runtime, locked review and 29/161/154 catalog coverage verified.')
          PY

      - name: Commit reviewed Greek product source atomically
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/apply_greek_review.py \
            tools/build_greek_locale.py \
            tools/audit_greek_native_copy.py \
            tools/greek_review.json \
            tools/greek_native_terms.json \
            assets/data/languages_v1.json \
            assets/data/countries_v1.json \
            assets/data/currencies_v1.json \
            lib/l10n/el \
            lib/l10n/mizan_el.dart \
            lib/l10n/mizan_el_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/main.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            lib/widgets/global_picker_dialog.dart \
            tools/validate_english_localization.py \
            tools/validate_spanish_localization.py \
            tools/validate_portuguese_br_localization.py \
            tools/validate_spanish_visible_copy.py \
            tools/build_pt_pt_locale.py \
            tools/build_french_locale.py \
            tools/build_german_locale.py \
            tools/build_italian_locale.py \
            tools/build_dutch_locale.py \
            tools/build_polish_locale.py \
            tools/build_romanian_locale.py \
            test/greek_localization_test.dart \
            test/greek_end_to_end_test.dart \
            test/greek_responsive_test.dart \
            test/english_localization_test.dart \
            test/portuguese_br_localization_test.dart \
            test/spanish_localization_test.dart \
            test/italian_final_head_test.dart
          git diff --cached --exit-code --quiet && { echo 'No reviewed Greek product changes to commit.'; exit 0; }
          git commit -m 'feat(el): integrate reviewed Greek product locale'
          git push origin HEAD:agent/greek-localization
