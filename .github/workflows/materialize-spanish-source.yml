name: Materialize verified Spanish source

on:
  push:
    branches:
      - agent/spanish-localization-candidate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-verified-spanish-source
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Spanish candidate
        uses: actions/checkout@v5
        with:
          ref: agent/spanish-localization-candidate
          fetch-depth: 0

      - name: Materialize SHA-verified Spanish source
        run: |
          set -euo pipefail
          if test -f lib/l10n/mizan_es.dart; then
            echo "Spanish source is already materialized."
            exit 0
          fi

          git fetch origin agent/spanish-localization-transfer

          for n in 00 01 02 03 04; do
            git show "origin/agent/spanish-localization-transfer:transfer/spanish/v2/spanish.part${n}" > "/tmp/spanish.part${n}"
          done
          echo "1803d393e10a158803d3da606702437f49ced17e9c20b30ba43bb430f4c8e8b6  /tmp/spanish.part00" | sha256sum -c -
          echo "e6c94b91f2fa6f15aaaa6e2baa3ecc3427957c25366d8bd55ed23f4b5762d419  /tmp/spanish.part01" | sha256sum -c -
          echo "c47f4370e4b5ab54e3a4f32f3c3eb6d538ca47a3218b7e9484990ab65e6d43c2  /tmp/spanish.part02" | sha256sum -c -
          echo "38f91a90a72703b81bd2a534c396ee5d63e3ff0b3e28c3d08fb98c70eae8f132  /tmp/spanish.part03" | sha256sum -c -
          echo "0e8de0e1b350fca9f6c0ad47fa994ac72b10d75f3213b8e276d019599d50ab03  /tmp/spanish.part04" | sha256sum -c -
          cat /tmp/spanish.part{00,01,02,03,04} | tr -d '\r\n\t ' > /tmp/spanish-modified.b64
          base64 --decode /tmp/spanish-modified.b64 > /tmp/spanish-modified.patch.gz
          echo "0e57f942a57cfcf4bf4716aa9cac2e31482c7407da8947d242a0e93700ee4aca  /tmp/spanish-modified.patch.gz" | sha256sum -c -
          gzip -dc /tmp/spanish-modified.patch.gz > /tmp/spanish-modified.patch
          echo "9834178a4341a53cf99ca64f51ea0f3e6baabb0951640af572884ec7d37c23bb  /tmp/spanish-modified.patch" | sha256sum -c -
          git apply --check /tmp/spanish-modified.patch
          git apply /tmp/spanish-modified.patch

          for n in 00 01 02 03 04 05; do
            git show "origin/agent/spanish-localization-transfer:transfer/spanish/v3/spanish-new.part${n}" > "/tmp/spanish-new.part${n}"
          done
          echo "faecd5a7f98ac140214b19d86282241a8598f6e010c9b35e475c8a39c670c576  /tmp/spanish-new.part00" | sha256sum -c -
          echo "e2fb910eac83a063155f7c8972164a98bc04b46adeb7fe399ae82125022b71ee  /tmp/spanish-new.part01" | sha256sum -c -
          echo "e26d2d68c29284273c0794601c1477c3d4eead18fe91542a37fbdc201bf5e2dc  /tmp/spanish-new.part02" | sha256sum -c -
          echo "08ef94931e9fdf50f274e9536d18308854bd5bf898ab631eedfd972a2836f050  /tmp/spanish-new.part03" | sha256sum -c -
          echo "e19d4bcd0a16977ac95fe11a2ff944c67fe9be7a3d9cddd4bb5de67545f9c1e1  /tmp/spanish-new.part04" | sha256sum -c -
          echo "e4b006f397fa19f783dfc192d1a621a99784b1ef545ee82471aabd937bdc2a9e  /tmp/spanish-new.part05" | sha256sum -c -
          cat /tmp/spanish-new.part{00,01,02,03,04,05} | tr -d '\r\n\t ' > /tmp/spanish-new.b64
          base64 --decode /tmp/spanish-new.b64 > /tmp/spanish-new.patch.gz
          echo "8622e4f866949146ba8d1537ebc1e9a83a2a8d549f533d451511e5a6d8727eb6  /tmp/spanish-new.patch.gz" | sha256sum -c -
          gzip -dc /tmp/spanish-new.patch.gz > /tmp/spanish-new.patch
          echo "5b47824d4cacfc634149854aa9bf341c1a513b6b88b75c86e327b9f6cda72bec  /tmp/spanish-new.patch" | sha256sum -c -
          git apply --check /tmp/spanish-new.patch
          git apply /tmp/spanish-new.patch

          python3 - <<'PY'
          from pathlib import Path

          validator = Path('tools/validate_spanish_localization.py')
          text = validator.read_text(encoding='utf-8')
          old = 'if "result = mizanSpanish[visibleSource]" not in i18n_text:'
          new = 'if not re.search(r"result\\s*=\\s*mizanSpanish\\[visibleSource\\]", i18n_text):'
          if old not in text:
              raise SystemExit('Expected Spanish runtime gate was not found.')
          validator.write_text(text.replace(old, new, 1), encoding='utf-8')

          spanish = Path('lib/l10n/mizan_es.dart')
          text = spanish.read_text(encoding='utf-8')
          unused = "String _installments(String value) => _count(value, 'cuota', 'cuotas');\n"
          if text.count(unused) != 1:
              raise SystemExit('Expected unused Spanish helper was not found once.')
          spanish.write_text(text.replace(unused, '', 1), encoding='utf-8')
          PY

      - name: Validate Spanish and English coverage
        run: |
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies and format
        run: |
          flutter pub get
          dart format lib test
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py
          git diff --check

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Commit verified Spanish source only
        run: |
          set -euo pipefail
          git restore test/output || true
          git config user.name "MIZAN Spanish Localization"
          git config user.email "actions@users.noreply.github.com"
          git add assets lib test tools docs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add native Spanish localization"
          git push origin HEAD:agent/spanish-localization-candidate
