name: Russian reviewed source bootstrap

on:
  push:
    branches:
      - agent/russian-localization
    paths:
      - .github/workflows/russian-source-bootstrap.yml
      - tools/bootstrap_russian_reviewed_source.sh
      - tools/russian_reviewed_payload/**
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: russian-source-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact Russian localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/russian-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked reviewed Russian source
        run: bash tools/bootstrap_russian_reviewed_source.sh
