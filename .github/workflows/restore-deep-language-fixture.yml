name: Restore deep language fixture
on:
  push:
    branches:
      - agent/mizan-monetization-premium
    paths:
      - .github/workflows/restore-deep-language-fixture.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Restore known-good test and add legal acceptance fixture
        run: |
          git checkout dfee742900673c6b34ac585fdb3e70c94f466b42 -- test/all_29_language_deep_surface_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/all_29_language_deep_surface_test.dart')
          s=p.read_text()
          marker="import 'package:lefferion_prime_mizan/l10n/mizan_id.dart';\n"
          assert marker in s
          s=s.replace(marker, marker+"import 'package:lefferion_prime_mizan/legal/legal_acceptance_store.dart';\n",1)
          marker2="import 'package:lefferion_prime_mizan/services/report_service.dart';\n"
          assert marker2 in s
          s=s.replace(marker2, marker2+"import 'package:shared_preferences/shared_preferences.dart';\n",1)
          anchor="}) async {\n  tester.view.physicalSize = size;\n"
          assert anchor in s
          s=s.replace(anchor,"}) async {\n  SharedPreferences.setMockInitialValues(const <String, Object>{});\n  await LegalAcceptanceStore.acceptCurrentLegalBundle();\n  tester.view.physicalSize = size;\n",1)
          p.write_text(s)
          PY
          dart format test/all_29_language_deep_surface_test.dart
          rm .github/workflows/restore-deep-language-fixture.yml
      - name: Verify fixture compiles
        run: flutter analyze --fatal-warnings test/all_29_language_deep_surface_test.dart
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Seed legal acceptance in known-good 29-language fixture'
          git push origin HEAD:agent/mizan-monetization-premium
