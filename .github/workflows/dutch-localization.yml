name: Dutch localization native-language audit

on:
  push:
    branches:
      - agent/dutch-localization
    paths:
      - .github/workflows/dutch-localization.yml
      - tools/build_dutch_locale.py
      - tools/audit_dutch_native_copy.py
      - tools/dutch_native_terms.json
      - tools/build_italian_locale.py
      - tools/build_german_locale.py
      - tools/build_french_locale.py
      - tools/build_pt_pt_locale.py
      - tools/validate_english_localization.py
      - tools/validate_spanish_localization.py
      - tools/validate_portuguese_br_localization.py
      - lib/l10n/mizan_nl.dart
      - lib/l10n/mizan_nl_dynamic.dart
      - lib/l10n/nl/**
      - lib/l10n/mizan_i18n.dart
      - lib/main.dart
      - lib/global/global_catalog.dart
      - lib/core/formatters.dart
      - lib/widgets/global_picker_dialog.dart
      - assets/data/languages_v1.json
      - assets/data/countries_v1.json
      - assets/data/currencies_v1.json
      - test/**
  pull_request:
    branches:
      - agent/mizanglobal-globalization

permissions:
  contents: write

concurrency:
  group: dutch-localization-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  build-audit-release:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out Dutch localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/dutch-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic catalog dependency
        run: python -m pip install 'Babel>=2.15,<3'

      - name: Build and integrate reviewed Dutch locale
        run: python tools/build_dutch_locale.py

      - name: Audit reviewed native Dutch source
        run: |
          python tools/build_dutch_locale.py --verify
          python tools/audit_dutch_native_copy.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dutch and integrated product sources
        run: |
          dart format \
            lib/l10n/nl \
            lib/l10n/mizan_nl.dart \
            lib/l10n/mizan_nl_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/main.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            lib/widgets/global_picker_dialog.dart \
            test/dutch_localization_test.dart \
            test/dutch_end_to_end_test.dart \
            test/dutch_responsive_test.dart

      - name: Verify Dutch source after formatting
        run: |
          python tools/build_dutch_locale.py --verify
          python tools/audit_dutch_native_copy.py

      - name: Validate all previously integrated languages remain intact
        run: |
          python tools/validate_english_localization.py
          python tools/validate_spanish_localization.py
          python tools/validate_portuguese_br_localization.py
          python tools/validate_spanish_visible_copy.py
          python tools/build_pt_pt_locale.py --verify
          python tools/build_french_locale.py --verify
          python tools/build_german_locale.py --verify
          python tools/build_italian_locale.py --verify

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Dutch terminology grammar catalog and formatting tests
        run: timeout 6m flutter test --reporter expanded test/dutch_localization_test.dart

      - name: Dutch reports reminders and data-protection tests
        run: timeout 6m flutter test --reporter expanded test/dutch_end_to_end_test.dart

      - name: Dutch responsive overflow tests
        run: timeout 12m flutter test --reporter expanded test/dutch_responsive_test.dart

      - name: Existing-language locale regression tests
        run: |
          set -euo pipefail
          for test_file in \
            test/language_restart_test.dart \
            test/portuguese_pt_localization_test.dart \
            test/portuguese_pt_picker_purity_test.dart \
            test/portuguese_pt_end_to_end_test.dart \
            test/portuguese_br_picker_purity_test.dart \
            test/portuguese_br_localization_test.dart \
            test/spanish_picker_purity_test.dart \
            test/spanish_localization_test.dart \
            test/english_localization_test.dart \
            test/french_localization_test.dart \
            test/french_end_to_end_test.dart \
            test/french_responsive_test.dart \
            test/german_localization_test.dart \
            test/german_end_to_end_test.dart \
            test/german_responsive_test.dart \
            test/italian_localization_test.dart \
            test/italian_end_to_end_test.dart \
            test/italian_responsive_test.dart \
            test/global_setup_test.dart
          do
            echo "=== Existing-language regression: $test_file ==="
            timeout 12m flutter test --reporter expanded "$test_file"
          done

      - name: Storage report PDF and notification regression tests
        run: |
          set -euo pipefail
          for test_file in \
            test/local_store_test.dart \
            test/csv_backup_test.dart \
            test/reminder_engine_test.dart \
            test/report_service_test.dart \
            test/pdf_report_test.dart \
            test/notification_migration_test.dart \
            test/notification_background_reliability_test.dart
          do
            echo "=== Storage/report/notification regression: $test_file ==="
            timeout 7m flutter test --reporter expanded "$test_file"
          done

      - name: Render every visual scenario without changing baselines
        run: |
          set -euo pipefail
          cp -a test/goldens /tmp/mizan-goldens
          timeout 15m flutter test --update-goldens test/visual_capture_test.dart
          rm -rf test/goldens
          cp -a /tmp/mizan-goldens test/goldens
          rm -rf test/failures
          git clean -fd -- test/output
          git restore --worktree -- test/output
          git diff --exit-code -- test/goldens

      - name: Full regression suite with isolated test lifecycles
        run: |
          set -uo pipefail
          diagnostic_file=tools/dutch_full_regression_failure.txt
          rm -f "$diagnostic_file"
          failed=0
          while IFS= read -r -d '' test_file; do
            echo "=== Full regression: $test_file ==="
            test_log="/tmp/$(basename "$test_file").log"
            if ! timeout 7m flutter test --reporter expanded "$test_file" 2>&1 | tee "$test_log"; then
              {
                echo "Failing test file: $test_file"
                echo "Audited source commit: $(git rev-parse HEAD)"
                echo
                echo "Last 300 log lines:"
                tail -n 300 "$test_log"
              } > "$diagnostic_file"
              failed=1
              break
            fi
          done < <(
            find test -maxdepth 1 -type f -name '*_test.dart' \
              ! -name 'visual_capture_test.dart' -print0 | sort -z
          )
          if [ "$failed" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f "$diagnostic_file"
            git commit -m 'ci(nl): record first full-regression failure'
            git push origin HEAD:agent/dutch-localization
            exit 1
          fi

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal release APK
        run: |
          mkdir -p build/dutch-apk-audit/universal
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/dutch-apk-audit/universal/mizan-global-dutch-universal.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Generate APK size and hash report
        run: |
          set -euo pipefail
          mkdir -p build/dutch-apk-audit/split
          cp build/app/outputs/flutter-apk/app-*-release.apk \
            build/dutch-apk-audit/split/
          {
            echo "Audited source commit: $(git rev-parse HEAD)"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo
            echo "Exact byte sizes:"
            find build/dutch-apk-audit -type f -name '*.apk' -print0 \
              | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo
            echo "SHA-256:"
            sha256sum build/dutch-apk-audit/universal/*.apk \
              build/dutch-apk-audit/split/*.apk
          } | tee build/dutch-apk-audit/apk-size-report.txt

      - name: Commit deterministic Dutch product sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/build_dutch_locale.py \
            tools/audit_dutch_native_copy.py \
            tools/dutch_native_terms.json \
            assets/data/languages_v1.json \
            assets/data/countries_v1.json \
            assets/data/currencies_v1.json \
            lib/l10n/nl \
            lib/l10n/mizan_nl.dart \
            lib/l10n/mizan_nl_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/main.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            lib/widgets/global_picker_dialog.dart \
            test/*.dart \
            tools/*.py
          if git diff --cached --quiet; then
            echo 'Dutch deterministic sources already committed.'
          else
            git commit -m 'feat(nl): integrate verified Dutch product locale'
            git push origin HEAD:agent/dutch-localization
          fi

      - name: Verify clean audited worktree
        run: |
          rm -rf test/failures
          git clean -fd -- test/output
          git restore --worktree -- test/output
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi

      - name: Upload audited Dutch APKs
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-dutch-apk-audit
          path: build/dutch-apk-audit
          if-no-files-found: error
