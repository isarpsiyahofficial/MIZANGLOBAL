name: Greek transport hash diagnostic

on:
  push:
    branches:
      - agent/greek-localization
    paths:
      - .github/workflows/greek-hash-diagnostic.yml
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/greek-hash-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greek-hash-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Greek branch
        uses: actions/checkout@v4
        with:
          ref: agent/greek-localization
          fetch-depth: 0

      - name: Record exact remote payload hashes and sizes
        run: |
          set -euo pipefail
          {
            echo "Audited branch head: $(git rev-parse HEAD)"
            echo
            echo "SHA-256:"
            sha256sum tools/greek_min_payload/part.*.b64
            echo
            echo "Exact byte sizes:"
            stat --printf='%n\t%s bytes\n' tools/greek_min_payload/part.*.b64
          } > tools/greek_hash_diagnostic.txt

      - name: Publish diagnostic only when changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tools/greek_hash_diagnostic.txt
          git diff --cached --exit-code --quiet && { echo 'Diagnostic already current.'; exit 0; }
          git commit -m 'ci(el): record transported Greek payload hashes'
          git push origin HEAD:agent/greek-localization
