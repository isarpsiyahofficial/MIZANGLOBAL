name: Apply verified MIZAN GLOBAL setup v3

on:
  push:
    branches:
      - agent/mizanglobal-global-setup-transfer
    paths:
      - transfer/v3/**
      - .github/workflows/apply-global-setup-v3.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v5
        with:
          ref: agent/mizanglobal-globalization
          fetch-depth: 0

      - name: Reconstruct and verify patch
        run: |
          set -euo pipefail
          git fetch origin agent/mizanglobal-global-setup-transfer
          : > /tmp/global_setup.b64
          for n in 01 02; do
            git show "origin/agent/mizanglobal-global-setup-transfer:transfer/v3/global_setup.part${n}" >> /tmp/global_setup.b64
          done
          tr -d '\r\n\t ' < /tmp/global_setup.b64 > /tmp/global_setup.compact.b64
          base64 --decode /tmp/global_setup.compact.b64 > /tmp/global_setup.patch.gz
          echo "058fbcd8bfc6da29ed843717b36553d98d2418d5f3305ce6e25adbee3ac3793a  /tmp/global_setup.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/global_setup.patch.gz > /tmp/global_setup.patch
          echo "a3936d4118cf0e7331dba9e0cebb42263cf6fbc7594c4e5fc01ecac5c953a5b3  /tmp/global_setup.patch" | sha256sum -c -
          git apply --check /tmp/global_setup.patch
          git apply /tmp/global_setup.patch

      - name: Validate project structure
        run: python3 tools/validate_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart sources
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Global setup and backup compatibility tests
        run: flutter test --reporter expanded test/global_setup_test.dart test/local_store_test.dart test/csv_backup_test.dart

      - name: Commit verified integration
        run: |
          set -euo pipefail
          git config user.name "MIZAN Global Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add searchable global first-run profile"
          git push origin HEAD:agent/mizanglobal-globalization
