name: One-shot final source hygiene cleanup

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  PRODUCT_BRANCH: agent/mizan-monetization-premium
  NORMAL_ANDROID_WORKFLOW_COMMIT: 5731ba3006ed0dd1fa5ce42e19170f4a5dbce4fe

jobs:
  hygiene-and-verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/mizan-monetization-premium' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Verify triggering head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Remove dead notification API and stale notification test names
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('lib/l10n/mizan_i18n.dart'),
              Path('lib/l10n/mizan_i18n_legacy.dart'),
          ]
          pattern = re.compile(
              r'\n  static String notificationText\(String value\) \{.*?\n  \}\n',
              re.S,
          )
          for path in targets:
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn('\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'notificationText block not found exactly once: {path}')
              path.write_text(updated, encoding='utf-8')
          PY
          mv test/all_26_language_report_notification_isolation_test.dart test/all_29_language_report_isolation_test.dart
          mv test/all_language_report_notification_integrity_test.dart test/all_22_language_report_integrity_test.dart
          mv test/notification_performance_report_final_test.dart test/dashboard_report_performance_contract_test.dart
          mv test/income_monthly_due_notification_v5_test.dart test/income_monthly_due_report_contract_test.dart
          ! grep -R -E 'notificationText\(' lib
          ! grep -R -E 'NotificationSlot|notificationsEnabled|paymentNotificationSlots|PaymentReminderFrequency|notificationSoundMode|notificationVibrationEnabled|ReminderPlanBuilder|ScheduledReminder|stableNotificationId' lib --exclude-dir=l10n
          test ! -e lib/services/reminder_engine.dart
          test ! -e test/reminder_engine_test.dart
          test ! -e test/reminder_record_currency_test.dart
      - run: flutter pub get
      - name: Exact Dart formatting
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze --fatal-warnings
      - name: Present final read-only Android workflow to validator
        run: |
          git show "$NORMAL_ANDROID_WORKFLOW_COMMIT:.github/workflows/android-release.yml" > .github/workflows/android-release.yml
          grep -q 'contents: read' .github/workflows/android-release.yml
          ! grep -q 'contents: write' .github/workflows/android-release.yml
      - name: Structural validation
        run: python3 tools/validate_project.py
      - name: Visible-copy localization audit
        run: python3 tools/audit_visible_copy_coverage.py
      - name: Full Flutter regression
        run: flutter test --reporter expanded
      - name: Final hygiene assertions
        run: |
          set -euo pipefail
          ! grep -R -E 'notificationText\(' lib
          ! grep -R -E 'NotificationSlot|notificationsEnabled|paymentNotificationSlots|PaymentReminderFrequency|notificationSoundMode|notificationVibrationEnabled|ReminderPlanBuilder|ScheduledReminder|stableNotificationId' lib --exclude-dir=l10n
          ! grep -R -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|flutter_local_notifications|flutterlocalnotifications' android pubspec.yaml
          test ! -e lib/services/reminder_engine.dart
          test ! -e tools/.notification_cleanup.part1
          test ! -e tools/.notification_cleanup.part2
          test ! -e tools/.notification_cleanup.part3
          test ! -e tools/.notification_cleanup.part4
          git diff --check
      - name: Commit verified hygiene changes only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib/l10n/mizan_i18n.dart lib/l10n/mizan_i18n_legacy.dart test/all_26_language_report_notification_isolation_test.dart test/all_29_language_report_isolation_test.dart test/all_language_report_notification_integrity_test.dart test/all_22_language_report_integrity_test.dart test/notification_performance_report_final_test.dart test/dashboard_report_performance_contract_test.dart test/income_monthly_due_notification_v5_test.dart test/income_monthly_due_report_contract_test.dart
          test -z "$(git diff --cached --name-only | grep '^\.github/' || true)"
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'chore: remove dead notification API and stale test names'
          git push origin HEAD:$PRODUCT_BRANCH
