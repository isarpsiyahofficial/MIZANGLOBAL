name: Android quality, visuals and internal release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  normalize-format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Normalize formatter output
        run: |
          set -euo pipefail
          dart format \
            lib/screens/settings_screen.dart \
            lib/services/permanent_backup_proof_guard.dart \
            test/csv_merge_dialog_29_language_test.dart \
            test/notification_release_disabled_contract_test.dart \
            test/permanent_backup_proof_guard_test.dart \
            test/premium_screen_entitlement_visibility_test.dart \
            test/ui_interaction_test.dart \
            test/visual_capture_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/settings_screen.dart lib/services/permanent_backup_proof_guard.dart test/csv_merge_dialog_29_language_test.dart test/notification_release_disabled_contract_test.dart test/permanent_backup_proof_guard_test.dart test/premium_screen_entitlement_visibility_test.dart test/ui_interaction_test.dart test/visual_capture_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "chore: normalize release format gates"
          git push origin HEAD:agent/mizan-monetization-premium
