name: One-shot notification subsystem cleanup

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  PRODUCT_BRANCH: agent/mizan-monetization-premium
  NORMAL_ANDROID_WORKFLOW_COMMIT: dbee4db2b67be09355e1d9da0e55de1f32f5f644

jobs:
  cleanup-and-verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/mizan-monetization-premium' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify triggering head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up exact Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply notification-removal source patch
        run: |
          set -euo pipefail
          cat tools/.notification_cleanup.part1 tools/.notification_cleanup.part2 tools/.notification_cleanup.part3 tools/.notification_cleanup.part4 \
            | base64 --decode | gzip --decompress > /tmp/notification_cleanup.patch
          git apply --check /tmp/notification_cleanup.patch
          git apply /tmp/notification_cleanup.patch
          rm tools/.notification_cleanup.part1 tools/.notification_cleanup.part2 tools/.notification_cleanup.part3 tools/.notification_cleanup.part4
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          for rel in [
              'test/annual_income_backup_contract_test.dart',
              'test/manual_overdue_edit_confirmation_test.dart',
              'test/monthly_payment_currency_contract_test.dart',
              'test/overdue_calendar_tracking_test.dart',
          ]:
              path = root / rel
              text = path.read_text()
              for indent in ('        ', '          ', '      ', '    '):
                  text = text.replace(f'{indent}notificationSlots: const [],\n', '')
              path.write_text(text)
          unused_model_imports = '''
          all_26_language_report_notification_isolation_test.dart
          all_language_report_notification_integrity_test.dart
          arabic_end_to_end_test.dart
          bengali_end_to_end_test.dart
          chinese_end_to_end_test.dart
          dutch_end_to_end_test.dart
          english_localization_test.dart
          filipino_end_to_end_test.dart
          french_end_to_end_test.dart
          german_end_to_end_test.dart
          greek_end_to_end_test.dart
          hebrew_end_to_end_test.dart
          hindi_end_to_end_test.dart
          italian_end_to_end_test.dart
          japanese_end_to_end_test.dart
          korean_end_to_end_test.dart
          persian_end_to_end_test.dart
          polish_end_to_end_test.dart
          portuguese_br_localization_test.dart
          portuguese_pt_end_to_end_test.dart
          romanian_end_to_end_test.dart
          russian_end_to_end_test.dart
          spanish_localization_test.dart
          ukrainian_end_to_end_test.dart
          urdu_end_to_end_test.dart
          '''.split()
          needle = "import 'package:lefferion_prime_mizan/models/mizan_models.dart';\n"
          for name in unused_model_imports:
              path = root / 'test' / name
              text = path.read_text().replace(needle, '')
              path.write_text(text)
          validator = root / 'tools' / 'validate_project.py'
          validator_text = validator.read_text()
          old = 'currentSchemaVersion = 14'
          new = 'currentSchemaVersion = 15'
          if old not in validator_text:
              raise SystemExit('validator schema lock v14 not found')
          validator.write_text(validator_text.replace(old, new))
          PY
          test ! -e lib/services/reminder_engine.dart
          test ! -e test/reminder_engine_test.dart
          test ! -e test/reminder_record_currency_test.dart
          ! grep -R -E 'NotificationSlot|notificationsEnabled|paymentNotificationSlots|PaymentReminderFrequency|notificationSoundMode|notificationVibrationEnabled|ReminderPlanBuilder|ScheduledReminder|stableNotificationId' \
            lib --exclude-dir=l10n
          ! grep -R -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|flutter_local_notifications|flutterlocalnotifications' \
            android pubspec.yaml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply exact Dart formatting
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Present final read-only Android workflow to structural validator
        run: |
          set -euo pipefail
          git show "$NORMAL_ANDROID_WORKFLOW_COMMIT:.github/workflows/android-release.yml" > .github/workflows/android-release.yml
          grep -q 'contents: read' .github/workflows/android-release.yml
          ! grep -q 'contents: write' .github/workflows/android-release.yml

      - name: Structural requirements validation
        run: python3 tools/validate_project.py

      - name: Visible-copy localization audit
        run: python3 tools/audit_visible_copy_coverage.py

      - name: Full Flutter regression
        run: flutter test --reporter expanded

      - name: Recheck notification subsystem is absent
        run: |
          set -euo pipefail
          test ! -e lib/services/reminder_engine.dart
          ! grep -R -E 'NotificationSlot|notificationsEnabled|paymentNotificationSlots|PaymentReminderFrequency|notificationSoundMode|notificationVibrationEnabled|ReminderPlanBuilder|ScheduledReminder|stableNotificationId' \
            lib --exclude-dir=l10n
          ! grep -R -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|flutter_local_notifications|flutterlocalnotifications' \
            android pubspec.yaml
          git diff --check

      - name: Commit verified source-only cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib test tools/validate_project.py tools/.notification_cleanup.part1 tools/.notification_cleanup.part2 tools/.notification_cleanup.part3 tools/.notification_cleanup.part4
          test -z "$(git diff --cached --name-only | grep '^\.github/' || true)"
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'fix: remove notification subsystem completely'
          git push origin HEAD:$PRODUCT_BRANCH
