name: Android quality, visuals and unsigned release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  quality-visuals-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Android platform deterministically
        run: flutter create . --platforms=android --org com.lefferionprime --project-name lefferion_prime_mizan

      - name: Configure Android notifications and display name
        run: python3 tools/configure_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Requirement smoke validation
        run: python3 tools/validate_project.py

      - name: Render real Flutter UI screenshots
        run: flutter test --update-goldens test/visual_capture_test.dart

      - name: Unit, storage, CSV and responsive widget tests
        run: flutter test --reporter expanded

      - name: Build unsigned release APK
        run: flutter build apk --release

      - name: Verify APK exists and is non-empty
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload real UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mizan-ui-screenshots-v2
          path: test/goldens/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-unsigned-release-v2
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package exact verified Flutter source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          root = Path.cwd()
          dist = root / 'dist'
          stage = dist / 'LEFFERION-PRIME-MIZAN'
          archive = dist / 'LEFFERION-PRIME-MIZAN-SOURCE.zip'
          if dist.exists():
              shutil.rmtree(dist)
          stage.mkdir(parents=True)
          excluded_roots = {'.git', '.dart_tool', 'build', 'dist'}
          excluded_files = {'.flutter-plugins', '.flutter-plugins-dependencies', '.packages', 'local.properties'}
          for source in root.rglob('*'):
              relative = source.relative_to(root)
              if not relative.parts:
                  continue
              if relative.parts[0] in excluded_roots or source.name in excluded_files:
                  continue
              target = stage / relative
              if source.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              elif source.is_file():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as output:
              for source in stage.rglob('*'):
                  if source.is_file():
                      output.write(source, source.relative_to(stage.parent))
          print(f'Verified source: {archive} ({archive.stat().st_size} bytes)')
          PY

      - name: Upload exact verified source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-verified-source-v2
          path: dist/LEFFERION-PRIME-MIZAN-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
