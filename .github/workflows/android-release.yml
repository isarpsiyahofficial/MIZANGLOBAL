name: Android one-shot formatter cleanup

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  PRODUCT_BRANCH: agent/mizan-monetization-premium
  RESTORE_COMMIT: c6d6f66e8a4916adf8814111fbe0461dca768949

jobs:
  apply-exact-format-and-self-remove:
    if: ${{ github.event.pull_request.head.ref == 'agent/mizan-monetization-premium' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Set up exact Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply exact Dart formatter and restore read-only Android workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          dart format test/all_29_language_2000_per_function_stress_test.dart
          git show "$RESTORE_COMMIT:.github/workflows/android-release.yml" > .github/workflows/android-release.yml
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' '.github/workflows/android-release.yml' 'test/all_29_language_2000_per_function_stress_test.dart' | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/android-release.yml test/all_29_language_2000_per_function_stress_test.dart
          git commit -m 'test: apply exact Dart formatting and restore Android CI'
          git push origin HEAD:$PRODUCT_BRANCH
