name: Android quality, visuals and unsigned release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  quality-visuals-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Android platform deterministically
        run: flutter create . --platforms=android --org com.lefferionprime --project-name lefferion_prime_mizan

      - name: Configure Android notifications and display name
        run: python3 tools/configure_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Requirement smoke validation
        run: python3 tools/validate_project.py

      - name: Render real Flutter UI screenshots
        run: flutter test --update-goldens test/visual_capture_test.dart

      - name: 29-language final contract
        if: always()
        run: flutter test test/all_29_language_final_contract_test.dart

      - name: Full 29x154 formatter matrix
        if: always()
        run: flutter test test/final_29_full_catalog_formatter_matrix_test.dart

      - name: All-language report and notification isolation
        if: always()
        run: flutter test test/all_26_language_report_notification_isolation_test.dart test/all_language_report_notification_integrity_test.dart

      - name: English family
        if: always()
        run: flutter test test/english_localization_test.dart
      - name: Spanish family
        if: always()
        run: flutter test test/spanish_localization_test.dart
      - name: Portuguese families
        if: always()
        run: flutter test test/portuguese_br_localization_test.dart test/portuguese_pt_end_to_end_test.dart
      - name: French family
        if: always()
        run: flutter test test/french_end_to_end_test.dart
      - name: German family
        if: always()
        run: flutter test test/german_end_to_end_test.dart
      - name: Italian family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/italian_*_test.dart)
          ((${#files[@]} == 0)) || flutter test "${files[@]}"
      - name: Dutch family
        if: always()
        run: flutter test test/dutch_end_to_end_test.dart
      - name: Polish family
        if: always()
        run: flutter test test/polish_end_to_end_test.dart
      - name: Romanian family
        if: always()
        run: flutter test test/romanian_end_to_end_test.dart
      - name: Greek family
        if: always()
        run: flutter test test/greek_end_to_end_test.dart
      - name: Russian family
        if: always()
        run: flutter test test/russian_end_to_end_test.dart
      - name: Ukrainian family
        if: always()
        run: flutter test test/ukrainian_end_to_end_test.dart
      - name: Arabic family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/arabic_*_test.dart)
          flutter test "${files[@]}"
      - name: Persian family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/persian_*_test.dart)
          flutter test "${files[@]}"
      - name: Hebrew family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/hebrew_*_test.dart)
          flutter test "${files[@]}"
      - name: Hindi family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/hindi_*_test.dart)
          flutter test "${files[@]}"
      - name: Bengali family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/bengali_*_test.dart)
          flutter test "${files[@]}"
      - name: Urdu family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/urdu_*_test.dart)
          flutter test "${files[@]}"
      - name: Indonesian family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/indonesian_*_test.dart)
          flutter test "${files[@]}"
      - name: Malay family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/malay_*_test.dart)
          flutter test "${files[@]}"
      - name: Filipino family
        if: always()
        run: flutter test test/filipino_end_to_end_test.dart
      - name: Vietnamese family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/vietnamese_*_test.dart)
          flutter test "${files[@]}"
      - name: Thai family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/thai_*_test.dart)
          flutter test "${files[@]}"
      - name: Swahili family
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(test/swahili_*_test.dart)
          flutter test "${files[@]}"
      - name: Chinese family
        if: always()
        run: flutter test test/chinese_end_to_end_test.dart
      - name: Japanese family
        if: always()
        run: flutter test test/japanese_end_to_end_test.dart
      - name: Korean family
        if: always()
        run: flutter test test/korean_end_to_end_test.dart

      - name: Record currency persistence and report isolation
        if: always()
        run: flutter test test/record_currency_persistence_contract_test.dart test/report_multicurrency_isolation_test.dart
      - name: Record currency notification resync
        if: always()
        run: flutter test test/reminder_record_currency_test.dart test/notification_record_currency_resync_test.dart
      - name: CSV legacy and multicurrency identity
        if: always()
        run: flutter test test/csv_backup_test.dart test/csv_multicurrency_identity_test.dart
      - name: Reminder engine and income schedule
        if: always()
        run: flutter test test/reminder_engine_test.dart test/income_monthly_due_notification_v5_test.dart
      - name: Dashboard interaction regression
        if: always()
        run: flutter test test/ui_interaction_test.dart

      - name: Unit, storage, CSV and responsive widget tests
        if: always()
        run: flutter test --reporter expanded

      - name: Build unsigned release APK
        if: success()
        run: flutter build apk --release

      - name: Verify APK exists and is non-empty
        if: success()
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload real UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizan-ui-screenshots-v2
          path: test/goldens/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-unsigned-release-v2
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package exact verified Flutter source
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          root = Path.cwd()
          dist = root / 'dist'
          stage = dist / 'LEFFERION-PRIME-MIZAN'
          archive = dist / 'LEFFERION-PRIME-MIZAN-SOURCE.zip'
          if dist.exists():
              shutil.rmtree(dist)
          stage.mkdir(parents=True)
          excluded_roots = {'.git', '.dart_tool', 'build', 'dist'}
          excluded_files = {'.flutter-plugins', '.flutter-plugins-dependencies', '.packages', 'local.properties'}
          for source in root.rglob('*'):
              relative = source.relative_to(root)
              if not relative.parts:
                  continue
              if relative.parts[0] in excluded_roots or source.name in excluded_files:
                  continue
              target = stage / relative
              if source.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              elif source.is_file():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as output:
              for source in stage.rglob('*'):
                  if source.is_file():
                      output.write(source, source.relative_to(stage.parent))
          print(f'Verified source: {archive} ({archive.stat().st_size} bytes)')
          PY

      - name: Upload exact verified source ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-verified-source-v2
          path: dist/LEFFERION-PRIME-MIZAN-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
