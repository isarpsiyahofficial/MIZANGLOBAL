name: Exhaustive language finalization helper

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply exhaustive locale patch
        run: |
          set -euo pipefail
          python3 tools/apply_full_language_finalization.py || test -s test/all_29_language_full_feature_contract_test.dart
          test -s test/all_29_language_legal_read_gate_test.dart
      - name: Fix literal validator assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/all_29_language_full_feature_contract_test.dart')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '      "? \'$label boş bırakılamaz.\'",',
              '      r"? \'$label boş bırakılamaz.\'",',
          )
          text = text.replace(
              '      "return \'$label geçersiz.\';",',
              '      r"return \'$label geçersiz.\';",',
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Format changed Dart sources
        run: >-
          dart format
          lib/screens/record_form_dialogs.dart
          lib/screens/dashboard_screen.dart
          lib/screens/expenses_screen.dart
          lib/widgets/record_notes_panel.dart
          lib/controllers/mizan_controller.dart
          test/native_audit_formatter_stability_test.dart
          test/all_29_language_full_feature_contract_test.dart
          test/all_29_language_legal_read_gate_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --fatal-warnings
      - name: Native-copy and visible-copy audits
        run: |
          set -euo pipefail
          python tools/audit_chinese_native_copy.py
          python tools/audit_filipino_native_copy.py
          python tools/audit_hebrew_native_copy.py
          python tools/audit_hindi_native_copy.py
          python tools/audit_indonesian_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_urdu_native_copy.py
          python tools/audit_vietnamese_native_copy.py
          python tools/audit_visible_copy_coverage.py
          python tools/validate_project.py
      - name: Verify new release-critical contracts
        run: |
          set -euo pipefail
          flutter test test/all_29_language_full_feature_contract_test.dart
          flutter test test/all_29_language_legal_read_gate_test.dart
          flutter test test/native_audit_formatter_stability_test.dart
      - name: Restore normal workflow and publish verified patch
        run: |
          set -euo pipefail
          git show 64fd8a7be0b6e1508672656731824bcbe67dd67d:.github/workflows/android-release.yml > .github/workflows/android-release.yml
          rm -f .github/workflows/one-shot-full-language-feature-finalization.yml
          rm -f .github/full-language-trigger.txt
          rm -f tools/apply_full_language_finalization.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(locale): verify every feature across all languages"
          git push origin HEAD:agent/mizan-monetization-premium
