name: Android quality, visuals and internal release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  apply-exact-dart-formatting:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply exact Dart formatting to backup changes
        run: |
          set -euo pipefail
          dart format \
            lib/monetization/monetization_controller.dart \
            lib/monetization/purchase_service.dart \
            lib/screens/reports_screen.dart \
            lib/screens/settings_screen.dart \
            lib/services/csv_backup_service.dart \
            lib/widgets/backup_premium_access_card.dart \
            test/backup_pro_entitlement_contract_test.dart \
            test/backup_report_language_isolation_test.dart \
            test/csv_backup_test.dart \
            test/monetization_contract_test.dart
          if git diff --quiet; then
            exit 0
          fi
          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo 'Unexpected workflow change' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test
          git commit -m "style: format permanent PRO backup changes"
          git push origin HEAD:agent/mizan-monetization-premium
