name: Android one-shot formatter cleanup

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  PRODUCT_BRANCH: agent/mizan-monetization-premium

jobs:
  apply-exact-format:
    if: ${{ github.event.pull_request.head.ref == 'agent/mizan-monetization-premium' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Set up exact Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply exact Dart formatter to stress test only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          dart format test/all_29_language_2000_per_function_stress_test.dart
          actual="$(git diff --name-only | sort)"
          test "$actual" = 'test/all_29_language_2000_per_function_stress_test.dart'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/all_29_language_2000_per_function_stress_test.dart
          git commit -m 'test: apply exact Dart 3.12.2 formatting'
          git push origin HEAD:$PRODUCT_BRANCH
