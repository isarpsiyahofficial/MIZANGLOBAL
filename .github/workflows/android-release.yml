name: One-shot notification subsystem cleanup

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  PRODUCT_BRANCH: agent/mizan-monetization-premium

jobs:
  cleanup-and-verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/mizan-monetization-premium' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify triggering head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up exact Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply notification-removal source patch
        run: |
          set -euo pipefail
          cat tools/.notification_cleanup.part1 tools/.notification_cleanup.part2 tools/.notification_cleanup.part3 tools/.notification_cleanup.part4 \
            | base64 --decode | gzip --decompress > /tmp/notification_cleanup.patch
          git apply --check /tmp/notification_cleanup.patch
          git apply /tmp/notification_cleanup.patch
          rm tools/.notification_cleanup.part1 tools/.notification_cleanup.part2 tools/.notification_cleanup.part3 tools/.notification_cleanup.part4
          test ! -e lib/services/reminder_engine.dart
          test ! -e test/reminder_engine_test.dart
          test ! -e test/reminder_record_currency_test.dart
          ! grep -R -E 'NotificationSlot|notificationsEnabled|paymentNotificationSlots|PaymentReminderFrequency|notificationSoundMode|notificationVibrationEnabled|ReminderPlanBuilder|ScheduledReminder|stableNotificationId' \
            lib --exclude-dir=l10n
          ! grep -R -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|flutter_local_notifications|flutterlocalnotifications' \
            android pubspec.yaml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply exact Dart formatting
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Structural requirements validation
        run: python3 tools/validate_project.py

      - name: Visible-copy localization audit
        run: python3 tools/audit_visible_copy_coverage.py

      - name: Full Flutter regression
        run: flutter test --reporter expanded

      - name: Recheck notification subsystem is absent
        run: |
          set -euo pipefail
          test ! -e lib/services/reminder_engine.dart
          ! grep -R -E 'NotificationSlot|notificationsEnabled|paymentNotificationSlots|PaymentReminderFrequency|notificationSoundMode|notificationVibrationEnabled|ReminderPlanBuilder|ScheduledReminder|stableNotificationId' \
            lib --exclude-dir=l10n
          git diff --check

      - name: Commit verified source-only cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib test tools/.notification_cleanup.part1 tools/.notification_cleanup.part2 tools/.notification_cleanup.part3 tools/.notification_cleanup.part4
          test -z "$(git diff --cached --name-only | grep '^\.github/' || true)"
          git diff --cached --name-only
          git commit -m 'fix: remove notification subsystem completely'
          git push origin HEAD:$PRODUCT_BRANCH
