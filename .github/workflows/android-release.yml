name: Android quality, visuals and internal release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"
  SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality-visuals-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Capture exact source SHA
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure and validate checked-in Android integration
        run: python3 tools/configure_android.py

      - name: Verify notification platform is absent
        run: |
          set -euo pipefail
          ! grep -R -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|flutterlocalnotifications' android/app/src/main android/app/build.gradle.kts

      - name: Verify serverless monetization native integration
        run: |
          set -euo pipefail
          grep -q 'class MainActivity : FlutterActivity()' android/app/src/main/kotlin/com/lefferionprime/mizanglobal/MainActivity.kt
          ! grep -R -E 'play_integrity|device_identity|StandardIntegrityManager|com.google.android.play:integrity|MIZAN_MONETIZATION_API|MIZAN_REQUIRE_BILLING_BACKEND' android lib
          grep -q 'admobApplicationId' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Verify checked-in source before generated assets
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Requirement smoke validation
        run: python3 tools/validate_project.py
      - name: Visible-copy localization coverage
        run: python3 tools/audit_visible_copy_coverage.py

      - name: Render real Flutter UI screenshots
        env:
          MIZAN_CAPTURE_PERSON_DETAILS_GOLDEN: "true"
        run: flutter test --update-goldens test/visual_capture_test.dart

      - name: Verify person-details visual fingerprint
        run: |
          test -s test/goldens/06-person-details.png
          echo "d54acc7bc901d23568bfc04b8e03e50b51faa840f8fdbfe55011aeffa0f8e7e3  test/goldens/06-person-details.png" | sha256sum -c -

      - name: Unit, storage, CSV and responsive widget tests
        run: flutter test --reporter expanded

      - name: Verify source commit stayed exact before build
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Build internal release APK with Google test ads
        env:
          MIZAN_ALLOW_TEST_RELEASE: "true"
          MIZAN_TEST_ADS: "true"
        run: >-
          flutter build apk --release
          --dart-define=MIZAN_TEST_ADS=true

      - name: Verify APK exists and source commit is exact
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload real UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mizan-ui-screenshots-v2-${{ env.SOURCE_SHA }}
          path: test/goldens/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload internal release APK
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-internal-release-v3-${{ env.SOURCE_SHA }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package exact verified Flutter source from commit object
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix=LEFFERION-PRIME-MIZAN/ \
            --output=dist/LEFFERION-PRIME-MIZAN-SOURCE.zip \
            "$SOURCE_SHA"
          test -s dist/LEFFERION-PRIME-MIZAN-SOURCE.zip

      - name: Upload exact verified source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-verified-source-v3-${{ env.SOURCE_SHA }}
          path: dist/LEFFERION-PRIME-MIZAN-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
