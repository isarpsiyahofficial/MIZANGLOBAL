name: MIZAN GLOBAL final exact-SHA audit

on:
  push:
    branches:
      - agent/mizan-monetization-premium
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  FLUTTER_VERSION: "3.44.6"
  NODE_VERSION: "22"
  SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: final-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pairwise-language-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run 29x28 full-catalog language isolation
        run: flutter test test/all_29_language_pairwise_isolation_test.dart

  language-deep-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        locale:
          - tr
          - en
          - es
          - pt-BR
          - pt-PT
          - fr
          - de
          - it
          - nl
          - pl
          - ro
          - el
          - ru
          - uk
          - ar
          - fa
          - he
          - hi
          - bn
          - ur
          - id
          - ms
          - fil
          - vi
          - th
          - sw
          - zh
          - ja
          - ko
    name: deep-language-${{ matrix.locale }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run complete application surface for ${{ matrix.locale }}
        run: >-
          flutter test
          --dart-define=MIZAN_TEST_LOCALE=${{ matrix.locale }}
          test/all_29_language_deep_surface_test.dart

  audit:
    needs:
      - pairwise-language-isolation
      - language-deep-matrix
    if: ${{ always() && needs.pairwise-language-isolation.result == 'success' && needs.language-deep-matrix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Capture and verify exact source SHA
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Validate monetization Worker
        working-directory: backend/monetization-worker
        run: |
          npm install --ignore-scripts
          npm run check
      - name: Source-scope and temporary-file gate
        run: |
          set -euo pipefail
          test ! -e .github/workflows/pdf-currency-materialize.yml
          test ! -e .github/workflows/multicurrency-report-materialize.yml
          test ! -e .github/workflows/final-source-cleanup.yml
          test ! -e .github/workflows/one-shot-format-deep-test.yml
          test ! -e .github/workflows/one-shot-fix-deep-test-clock.yml
          test ! -e .github/workflows/one-shot-fix-deep-gates.yml
          test ! -e .github/workflows/one-shot-deep-language-diagnostic.yml
          test ! -e .github/workflows/one-shot-deep-split-diagnostic.yml
          test ! -e .github/workflows/one-shot-visual-diagnostics.yml
          test ! -e .github/workflows/one-shot-time-inventory.yml
          test ! -e .github/workflows/one-shot-deterministic-visual-contract.yml
          test ! -e .github/scripts/apply_deterministic_clock_audit_patch.py
          test ! -e .github/scripts/fix_monthly_status_currency.py
          test ! -e tools/materialize_record_currency_models.py
          test ! -e tools/materialize_multicurrency_reports.py
          test ! -e tools/materialize_pdf_currency.py
          test ! -e tools/patch_expense_currency_surfaces.py
          test ! -e tools/patch_people_currency_surfaces.py
          test ! -e tools/patch_report_currency_pdf.py
          test ! -e tools/patch_currency_parser_roundtrip.py
          test ! -e tools/fix_people_currency_patch.py
          test ! -e tools/finalize_chinese_cny.py
          test ! -e tools/materialize_chinese_runtime.py
      - name: Formatting gate
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --fatal-warnings
      - name: Native-copy audits
        run: |
          set -euo pipefail
          python tools/audit_chinese_native_copy.py
          python tools/audit_filipino_native_copy.py
          python tools/audit_indonesian_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_urdu_native_copy.py
          python tools/audit_vietnamese_native_copy.py
      - name: Requirement validation
        run: python tools/validate_project.py
      - name: Visible-copy localization coverage
        run: python tools/audit_visible_copy_coverage.py
      - name: Full Flutter regression and deep contracts
        run: flutter test
      - name: Re-run release-critical contracts independently
        run: |
          set -euo pipefail
          flutter test test/monetization_contract_test.dart
          flutter test test/all_29_language_pairwise_isolation_test.dart
          flutter test test/all_29_language_final_contract_test.dart
          flutter test test/final_29_catalog_matrix_test.dart
          flutter test test/final_29_locale_formatter_test.dart
          flutter test test/final_29_full_catalog_formatter_matrix_test.dart
          flutter test --dart-define=MIZAN_TEST_LOCALE=tr test/all_29_language_deep_surface_test.dart
          flutter test test/global_preferences_backup_invariants_test.dart
          flutter test test/record_currency_persistence_contract_test.dart
          flutter test test/csv_multicurrency_identity_test.dart
          flutter test test/csv_legacy_tr_currency_migration_test.dart
          flutter test test/report_multicurrency_isolation_test.dart
          flutter test test/global_release_integrity_contract_test.dart
      - name: Verify checked-in Android security integration
        run: |
          set -euo pipefail
          python3 tools/configure_android.py
          grep -q 'play_integrity' android/app/src/main/kotlin/com/lefferionprime/mizanglobal/MainActivity.kt
          grep -q 'device_identity' android/app/src/main/kotlin/com/lefferionprime/mizanglobal/MainActivity.kt
          grep -q 'com.google.android.play:integrity' android/app/build.gradle.kts
          grep -q 'admobApplicationId' android/app/src/main/AndroidManifest.xml
          ! grep -R -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|flutterlocalnotifications' android/app/src/main android/app/build.gradle.kts
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$SOURCE_REF"
          git diff --exit-code
      - name: Build universal internal release APK
        env:
          MIZAN_ALLOW_TEST_RELEASE: "true"
          MIZAN_TEST_ADS: "true"
        run: >-
          flutter build apk --release
          --dart-define=MIZAN_TEST_ADS=true
          --dart-define=MIZAN_REQUIRE_BILLING_BACKEND=false
      - name: Build ABI-specific internal release APKs
        env:
          MIZAN_ALLOW_TEST_RELEASE: "true"
          MIZAN_TEST_ADS: "true"
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=MIZAN_TEST_ADS=true
          --dart-define=MIZAN_REQUIRE_BILLING_BACKEND=false
      - name: Verify exact SHA and produce APK hash/size manifest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$SOURCE_REF"
          mkdir -p final-apks
          cp build/app/outputs/flutter-apk/app-release.apk final-apks/MIZAN-universal-internal-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk final-apks/MIZAN-arm64-v8a-internal-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk final-apks/MIZAN-armeabi-v7a-internal-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk final-apks/MIZAN-x86_64-internal-release.apk
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            for f in final-apks/*.apk; do
              test -s "$f"
              printf '%s  bytes=%s  sha256=%s\n' "$(basename "$f")" "$(stat -c%s "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            done
          } | tee final-apks/apk-manifest.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: mizan-global-internal-exact-sha-${{ env.SOURCE_SHA }}
          path: final-apks/
          if-no-files-found: error
          retention-days: 30

  report:
    needs:
      - pairwise-language-isolation
      - language-deep-matrix
      - audit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish exact-SHA audit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PAIRWISE_RESULT: ${{ needs.pairwise-language-isolation.result }}
          MATRIX_RESULT: ${{ needs.language-deep-matrix.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          if [ "$PAIRWISE_RESULT" = "success" ] && [ "$MATRIX_RESULT" = "success" ] && [ "$AUDIT_RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION='812-direction isolation, 29 deep-language audits, monetization, full regression and four internal APK gate passed'
          else
            STATE=failure
            DESCRIPTION='812-direction isolation, 29-language matrix, monetization or exact-SHA audit failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$STATE" \
            -f context='mizan-global/final-exact-sha' \
            -f description="$DESCRIPTION"
