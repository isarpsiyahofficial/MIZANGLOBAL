name: Final branch exact-SHA audit

on:
  push:
    branches:
      - agent/chinese-localization

permissions:
  contents: write
  statuses: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.clean.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true
      - id: clean
        name: Remove temporary orchestration and final-head markers
        run: |
          set -euo pipefail
          rm -f docs/localization/filipino-final-head-marker*.md
          rm -f tools/finalize_chinese_cny.py
          rm -f tools/materialize_chinese_runtime.py
          rm -f .github/workflows/final-source-cleanup.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(final): remove temporary localization orchestration'
          git fetch origin agent/chinese-localization
          git rebase origin/agent/chinese-localization
          git push origin HEAD:agent/chinese-localization

  audit:
    needs: cleanup
    if: ${{ always() && (github.actor == 'github-actions[bot]' || needs.cleanup.outputs.changed == 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Source-scope and temporary-file gate
        run: |
          set -euo pipefail
          test ! -e .github/workflows/pdf-currency-materialize.yml
          test ! -e .github/workflows/multicurrency-report-materialize.yml
          test ! -e .github/workflows/final-source-cleanup.yml
          test ! -e tools/materialize_record_currency_models.py
          test ! -e tools/materialize_multicurrency_reports.py
          test ! -e tools/materialize_pdf_currency.py
          test ! -e tools/patch_expense_currency_surfaces.py
          test ! -e tools/patch_people_currency_surfaces.py
          test ! -e tools/patch_report_currency_pdf.py
          test ! -e tools/patch_currency_parser_roundtrip.py
          test ! -e tools/fix_people_currency_patch.py
          test ! -e tools/finalize_chinese_cny.py
          test ! -e tools/materialize_chinese_runtime.py
          ! find docs/localization -maxdepth 1 -type f -name 'filipino-final-head-marker*.md' | grep .
      - name: Formatting gate
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --fatal-warnings
      - name: Native-copy independent audits
        run: |
          set -euo pipefail
          python tools/audit_chinese_native_copy.py
          python tools/audit_filipino_native_copy.py
          python tools/audit_indonesian_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_urdu_native_copy.py
          python tools/audit_vietnamese_native_copy.py
          python tools/validate_project.py
      - name: Full Flutter regression and deep contracts
        run: flutter test
      - name: Re-run release-critical contracts independently
        run: |
          set -euo pipefail
          flutter test test/all_29_language_final_contract_test.dart
          flutter test test/final_29_catalog_matrix_test.dart
          flutter test test/final_29_locale_formatter_test.dart
          flutter test test/final_29_full_catalog_formatter_matrix_test.dart
          flutter test test/global_preferences_backup_invariants_test.dart
          flutter test test/profile_notification_resync_contract_test.dart
          flutter test test/record_currency_persistence_contract_test.dart
          flutter test test/csv_multicurrency_identity_test.dart
          flutter test test/csv_legacy_tr_currency_migration_test.dart
          flutter test test/report_multicurrency_isolation_test.dart
          flutter test test/reminder_record_currency_test.dart
          flutter test test/notification_record_currency_resync_test.dart
      - name: Clean tracked source before APK build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
      - name: Generate Android platform deterministically
        run: flutter create . --platforms=android --org com.lefferionprime --project-name lefferion_prime_mizan
      - name: Configure Android notifications and display name
        run: python3 tools/configure_android.py
      - name: Build universal release APK
        run: flutter build apk --release
      - name: Build ABI-specific release APKs
        run: flutter build apk --release --split-per-abi
      - name: Verify exact SHA and produce APK hash/size manifest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p final-apks
          cp build/app/outputs/flutter-apk/app-release.apk final-apks/MIZAN-universal-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk final-apks/MIZAN-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk final-apks/MIZAN-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk final-apks/MIZAN-x86_64-release.apk
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            for f in final-apks/*.apk; do
              test -s "$f"
              printf '%s  bytes=%s  sha256=%s\n' "$(basename "$f")" "$(stat -c%s "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            done
          } | tee final-apks/apk-manifest.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: mizan-global-final-${{ env.SOURCE_SHA }}
          path: final-apks/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: audit
    if: ${{ always() && needs.audit.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-SHA audit status
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          if [ "$AUDIT_RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION='29-language deep audit and four APK gate passed'
          else
            STATE=failure
            DESCRIPTION='29-language exact-SHA final audit failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='mizan-global/final-exact-sha' \
            -f description="$DESCRIPTION"