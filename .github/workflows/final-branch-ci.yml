name: MIZAN GLOBAL final exact-SHA audit

on:
  push:
    branches:
      - agent/mizan-monetization-premium
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  FLUTTER_VERSION: "3.44.6"
  SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: final-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The per-locale deep-surface stress remains a mandatory dedicated acceptance gate:
# all_29_language_deep_surface_test.dart
# This final workflow consumes that gate separately instead of duplicating its 29-locale matrix.

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Capture exact source SHA
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify final serverless lifetime-only monetization contract
        run: |
          set -euo pipefail
          test ! -e backend/monetization-worker
          test ! -e lib/monetization/monetization_api.dart
          test ! -e .github/workflows/one-shot-backup-pro-final.yml
          ! find tools -maxdepth 1 -type f -name 'backup-pro-final*' -print -quit | grep -q .
          ! grep -R -E 'MIZAN_MONETIZATION_API|MIZAN_REQUIRE_BILLING_BACKEND|MIZAN_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER|PROMO_PEPPER|GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY|play_integrity|device_identity|StandardIntegrityManager|com.google.android.play:integrity' lib/monetization android/app/src/main android/app/build.gradle.kts
          grep -q "permanentPremiumProductId = 'premium_lifetime'" lib/monetization/monetization_config.dart
          ! grep -R -E 'subscriptionPremiumProductId|premium_subscription|threeMonthBasePlanId|monthlyBasePlanId' lib/monetization lib/screens/premium_screen.dart
          grep -q "rewardedViewsRequiredForDailyPremium = 3" lib/monetization/monetization_config.dart
          grep -q "behaviorActionThreshold = 3" lib/monetization/monetization_config.dart
          grep -Fq "bool get canUseApp => _legalAccessGranted && (isPremium || isOnline);" lib/monetization/monetization_controller.dart
          grep -Fq "bool get canExportPdf => _legalAccessGranted && isPremium;" lib/monetization/monetization_controller.dart
          grep -q "queryPastPurchases" lib/monetization/purchase_service.dart
          grep -q "serverVerificationData" lib/monetization/purchase_service.dart
          grep -q "permanentPurchaseFingerprint" lib/monetization/premium_entitlement_store.dart
          grep -q "Hmac(sha256" lib/monetization/local_promo_service.dart
          test ! -e lib/services/notification_service.dart
          test ! -e lib/services/premium_notification_coordinator.dart
          ! grep -R -E 'Bildirim sistemi|benefitNotification|notification_service.dart|reminder_engine.dart' lib/screens/settings_screen.dart lib/screens/premium_screen.dart lib/monetization/monetization_strings.dart lib/main.dart
          ! grep -E 'flutter_local_notifications|flutter_timezone' pubspec.yaml
      - name: Formatting gate
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --fatal-warnings
      - name: Native-copy audits
        run: |
          set -euo pipefail
          python tools/audit_chinese_native_copy.py
          python tools/audit_filipino_native_copy.py
          python tools/audit_hebrew_native_copy.py
          python tools/audit_hindi_native_copy.py
          python tools/validate_hebrew_localization_scope.py
          python tools/validate_hindi_localization_scope.py
          python tools/audit_indonesian_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_urdu_native_copy.py
          python tools/audit_vietnamese_native_copy.py
      - name: Structural validation
        run: python tools/validate_project.py
      - name: Visible-copy coverage
        run: python tools/audit_visible_copy_coverage.py
      - name: Render current release visual contract
        env:
          MIZAN_CAPTURE_PERSON_DETAILS_GOLDEN: "true"
        run: flutter test --update-goldens test/visual_capture_test.dart
      - name: Verify release-critical visual fingerprints
        run: |
          set -euo pipefail
          echo "d54acc7bc901d23568bfc04b8e03e50b51faa840f8fdbfe55011aeffa0f8e7e3  test/goldens/06-person-details.png" | sha256sum -c -
          echo "036c15edfa6f3177661cad7ee3f9737dbafa45ce12b292c1f86581b35301a0dc  test/goldens/09-reports-simple.png" | sha256sum -c -
      - name: Full Flutter regression
        run: flutter test
      - name: Restore generated visual baselines
        run: git restore test/goldens
      - name: Independent release-critical contracts
        run: |
          set -euo pipefail
          flutter test test/monetization_contract_test.dart
          flutter test test/free_online_to_offline_gate_test.dart
          flutter test test/legal_acceptance_contract_test.dart
          flutter test test/legal_monetization_gate_contract_test.dart
          flutter test test/all_29_language_full_feature_contract_test.dart
          flutter test test/all_29_language_legal_read_gate_test.dart
          flutter test test/all_29_language_runtime_recovery_contract_test.dart
          flutter test test/all_29_language_legal_resilience_test.dart
          flutter test test/all_29_language_premium_surface_test.dart
          flutter test test/reward_entitlement_binding_contract_test.dart
          flutter test test/pdf_access_integration_contract_test.dart
          flutter test test/backup_pro_entitlement_contract_test.dart
          flutter test test/permanent_backup_proof_guard_test.dart
          flutter test test/premium_screen_entitlement_visibility_test.dart
          flutter test test/csv_merge_dialog_29_language_test.dart
          flutter test test/notification_release_disabled_contract_test.dart
          flutter test test/source_hygiene_contract_test.dart
          flutter test test/backup_report_language_isolation_test.dart
          flutter test test/all_29_language_pairwise_isolation_test.dart
          flutter test test/all_29_language_final_contract_test.dart
          flutter test test/final_29_catalog_matrix_test.dart
          flutter test test/final_29_locale_formatter_test.dart
          flutter test test/final_29_full_catalog_formatter_matrix_test.dart
          flutter test test/global_preferences_backup_invariants_test.dart
          flutter test test/record_currency_persistence_contract_test.dart
          flutter test test/csv_multicurrency_identity_test.dart
          flutter test test/csv_legacy_tr_currency_migration_test.dart
          flutter test test/report_multicurrency_isolation_test.dart
          flutter test test/global_release_integrity_contract_test.dart
      - name: Verify Android integration
        run: |
          set -euo pipefail
          python3 tools/configure_android.py
          grep -q 'class MainActivity : FlutterActivity()' android/app/src/main/kotlin/com/lefferionprime/mizanglobal/MainActivity.kt
          ! grep -R -E 'play_integrity|device_identity|StandardIntegrityManager|com.google.android.play:integrity' android/app
          grep -q 'admobApplicationId' android/app/src/main/AndroidManifest.xml
          ! grep -R -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|flutterlocalnotifications|FlutterLocalNotifications|FlutterTimezone' android/app/src/main android/app/build.gradle.kts
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$SOURCE_REF"
          git diff --exit-code
      - name: Regenerate launcher icons for release APKs
        run: dart run flutter_launcher_icons
      - name: Build four internal release APKs
        env:
          MIZAN_ALLOW_TEST_RELEASE: "true"
          MIZAN_TEST_ADS: "true"
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=MIZAN_TEST_ADS=true
          flutter build apk --release --split-per-abi --dart-define=MIZAN_TEST_ADS=true
      - name: Restore generated launcher resources
        run: git restore android/app/src/main/res
      - name: Produce exact-SHA APK manifest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$SOURCE_REF"
          mkdir -p final-apks
          cp build/app/outputs/flutter-apk/app-release.apk final-apks/MIZAN-universal-internal-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk final-apks/MIZAN-arm64-v8a-internal-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk final-apks/MIZAN-armeabi-v7a-internal-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk final-apks/MIZAN-x86_64-internal-release.apk
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            for f in final-apks/*.apk; do
              test -s "$f"
              printf '%s  bytes=%s  sha256=%s\n' "$(basename "$f")" "$(stat -c%s "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            done
          } | tee final-apks/apk-manifest.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: mizan-global-internal-exact-sha-${{ env.SOURCE_SHA }}
          path: final-apks/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: [audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish exact-SHA status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          if [ "$AUDIT_RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION='Full regression, release contracts and four exact-SHA APK gate passed; 29-language stress is verified by its dedicated workflow'
          else
            STATE=failure
            DESCRIPTION='Lifetime-PRO, notification-removal, source hygiene, regression or exact-SHA APK gate failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -f state="$STATE" -f context='mizan-global/final-exact-sha' -f description="$DESCRIPTION"
