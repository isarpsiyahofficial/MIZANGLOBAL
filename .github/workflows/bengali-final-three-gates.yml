name: Bengali final three acceptance gates

on:
  pull_request:
    branches: [agent/mizanglobal-globalization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bengali-final-three-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  gate-1-language-runtime-pdf:
    name: Gate 1 - Bengali language, reports, PDF and inherited languages
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Bengali and every inherited language without mutation
        run: |
          set -euo pipefail
          python -m pip install 'Babel>=2.15,<3'
          python tools/materialize_bengali_locale.py --verify
          python tools/audit_bengali_native_copy.py
          python tools/build_hindi_locale.py --verify
          python tools/audit_hindi_native_copy.py
          python tools/validate_hindi_localization_scope.py
          python tools/build_hebrew_locale.py --verify
          python tools/audit_hebrew_native_copy.py
          python tools/validate_hebrew_localization_scope.py
          python tools/build_persian_locale.py --verify
          python tools/audit_persian_native_copy.py
          python tools/validate_persian_localization_scope.py
          python tools/build_arabic_locale.py --verify
          python tools/audit_arabic_native_copy.py
          python tools/validate_arabic_localization_scope.py
          python tools/build_ukrainian_locale.py --verify
          python tools/audit_ukrainian_native_copy.py
          python tools/validate_ukrainian_localization_scope.py
          python tools/build_russian_locale.py --verify
          python tools/audit_russian_native_copy.py
          python tools/validate_english_localization.py
          python tools/validate_spanish_localization.py
          python tools/validate_spanish_visible_copy.py
          python tools/validate_portuguese_br_localization.py
          python tools/build_pt_pt_locale.py --verify
          python tools/build_french_locale.py --verify
          python tools/build_german_locale.py --verify
          python tools/build_italian_locale.py --verify
          python tools/build_dutch_locale.py --verify
          python tools/build_polish_locale.py --verify
          python tools/build_romanian_locale.py --verify
          python tools/build_greek_locale.py --verify
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze and run Bengali report PDF notification and responsive tests
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed \
            lib/l10n/bn \
            lib/l10n/mizan_bn.dart \
            lib/l10n/mizan_bn_dynamic.dart \
            test/bengali_localization_contract_test.dart \
            test/bengali_localization_test.dart \
            test/bengali_end_to_end_test.dart \
            test/bengali_responsive_test.dart
          flutter analyze --fatal-warnings --fatal-infos
          for file in \
            test/bengali_localization_contract_test.dart \
            test/bengali_localization_test.dart \
            test/bengali_end_to_end_test.dart \
            test/bengali_responsive_test.dart \
            test/global_setup_test.dart \
            test/monthly_payment_status_reference_test.dart \
            test/overdue_calendar_tracking_test.dart \
            test/notification_fallback_scheduling_test.dart \
            test/notification_background_reliability_test.dart \
            test/automatic_notification_sync_test.dart \
            test/reminder_engine_test.dart; do
            timeout 12m flutter test --reporter expanded "$file"
          done
          mapfile -t pdf_tests < <(grep -l -Ei 'pdf|Pdf' test/*_test.dart | sort -u)
          test "${#pdf_tests[@]}" -gt 0
          for file in "${pdf_tests[@]}"; do
            echo "=== PDF/report verification: $file ==="
            timeout 15m flutter test --reporter expanded "$file"
          done
          git status --porcelain
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"

  gate-2-full-regression-visual:
    name: Gate 2 - complete isolated regression and visual baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run every test file with isolated lifecycle
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "=== Full regression: $file ==="
            timeout 12m flutter test --reporter expanded "$file"
          done < <(find test -maxdepth 1 -type f -name '*_test.dart' ! -name visual_capture_test.dart -print0 | sort -z)
      - name: Re-render every visual scenario without baseline drift
        run: |
          set -euo pipefail
          cp -a test/goldens /tmp/mizan-goldens
          timeout 25m flutter test --update-goldens test/visual_capture_test.dart
          rm -rf test/goldens test/failures
          cp -a /tmp/mizan-goldens test/goldens
          git reset --hard HEAD
          git clean -fd
          git diff --exit-code -- test/goldens
          test -z "$(git status --porcelain)"

  gate-3-release-artifacts:
    name: Gate 3 - release APKs, hashes and clean source
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build universal and split release APKs
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release
          mkdir -p build/bengali-final/universal build/bengali-final/split
          cp build/app/outputs/flutter-apk/app-release.apk build/bengali-final/universal/mizan-global-bengali-universal.apk
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-*-release.apk build/bengali-final/split/
      - name: Generate exact byte and SHA-256 report
        run: |
          set -euo pipefail
          {
            echo "Audited source commit: $(git rev-parse HEAD)"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo 'Exact byte sizes:'
            find build/bengali-final -type f -name '*.apk' -print0 | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo 'SHA-256:'
            sha256sum build/bengali-final/universal/*.apk build/bengali-final/split/*.apk
          } | tee build/bengali-final/apk-size-sha256.txt
          test "$(find build/bengali-final -type f -name '*.apk' | wc -l)" -eq 4
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: mizan-global-bengali-final-apks
          path: build/bengali-final
          if-no-files-found: error
          retention-days: 90
