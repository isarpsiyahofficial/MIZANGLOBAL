name: Chinese runtime push fallback
on:
  push:
    branches: [agent/chinese-localization]
permissions:
  contents: write
concurrency:
  group: chinese-materialize-fallback
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: guard
        shell: bash
        run: |
          if [ -f tools/materialize_chinese_runtime.py ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Materialize runtime
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_chinese_runtime.py
          python tools/finalize_chinese_cny.py
          rm -f .github/workflows/chinese-materialize-push.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(zh): materialize Chinese runtime through push fallback"
          git push origin HEAD:agent/chinese-localization
