name: Source-only final audit 20260906

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/source-only-final-audit-20260906.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Existing static project and language gates
        shell: bash
        run: |
          set +e
          python3 tools/validate_project.py
          echo "VALIDATE_PROJECT_EXIT=$?"
          python3 tools/audit_visible_copy_coverage.py
          echo "VISIBLE_COPY_EXIT=$?"
          python3 tools/audit_cross_language_leaks.py
          echo "CROSS_LANGUAGE_EXIT=$?"
          python3 tools/audit_auxiliary_language_surfaces.py
          echo "AUXILIARY_EXIT=$?"
          exit 0
      - name: Shipping source hygiene and security inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots=[Path('lib'), Path('android/app/src/main')]
          files=[]
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.dart','.kt','.kts','.java','.xml','.properties'})

          def hits(pattern, paths=files, flags=re.I):
              rx=re.compile(pattern, flags)
              out=[]
              for p in paths:
                  try: text=p.read_text(encoding='utf-8')
                  except Exception: continue
                  for i,line in enumerate(text.splitlines(),1):
                      if rx.search(line): out.append(f'{p}:{i}: {line.strip()}')
              return out

          scans={
              'TODO_FIXME_HACK_XXX': r'\b(?:TODO|FIXME|HACK|XXX)\b',
              'AI_PROVENANCE': r'\b(?:ChatGPT|OpenAI|Copilot|Claude|Anthropic|Gemini|AI-generated|generated by AI)\b',
              'PRIVATE_KEY_HEADERS': r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY',
              'COMMON_SECRET_SHAPES': r'(?:gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})',
              'OLD_PROMO_NAMES': r'\b(?:ESMANUR|IBRAHIM)\b',
              'NOTIFICATION_REMNANTS': r'(?:flutter_local_notifications|POST_NOTIFICATIONS|SCHEDULE_EXACT_ALARM|RECEIVE_BOOT_COMPLETED)',
              'TECHNICAL_UI_RISK': r'\b(?:stack trace|internal build|test mode|test ad|debug build)\b',
              'DEBUG_PRINTS': r'\b(?:debugPrint|print)\s*\(',
              'URLS_IN_SHIPPING': r'https?://',
          }
          for name,pattern in scans.items():
              print(f'=== {name} ===')
              found=hits(pattern)
              print('\n'.join(found) if found else 'NONE')

          print('=== ANDROID_MANIFEST ===')
          manifest=Path('android/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          for i,line in enumerate(manifest.splitlines(),1):
              if 'uses-permission' in line or 'android:exported' in line or 'allowBackup' in line or 'dataExtractionRules' in line or 'fullBackupContent' in line:
                  print(f'{i}: {line.strip()}')

          print('=== WORKFLOW_TRIGGERS ===')
          for p in sorted(Path('.github/workflows').glob('*.y*ml')):
              text=p.read_text(encoding='utf-8')
              auto=('\n  push:' in text or '\n  pull_request:' in text)
              print(f'{p}: auto_push_or_pr={auto}')

          print('=== SUSPICIOUS_REPO_FILES ===')
          suspicious=[]
          for p in Path('.').rglob('*'):
              if not p.is_file(): continue
              s=p.as_posix().lower()
              if s.startswith('.git/'): continue
              if any(s.endswith(ext) for ext in ('.jks','.keystore','.p12','.pfx','.pem','.key')) or any(x in p.name.lower() for x in ('password','secret','private-key','credentials')):
                  suspicious.append(p.as_posix())
          print('\n'.join(sorted(suspicious)) if suspicious else 'NONE')
          PY
