name: Urdu materialization trigger

on:
  push:
    branches: [agent/urdu-localization]
    paths:
      - '.github/workflows/urdu-materialization-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urdu-materialization-trigger
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/urdu-localization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract deterministic Urdu source pack
        run: |
          set -euo pipefail
          python tools/bootstrap_urdu_locale.py
          git diff --check
      - name: Commit materialized files
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain)"; then
            echo 'Urdu source is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ur): materialize deterministic Urdu source pack'
          git fetch origin agent/urdu-localization
          git rebase origin/agent/urdu-localization
          git push origin HEAD:agent/urdu-localization
