name: MIZAN dependency snapshot

on:
  pull_request:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  SOURCE_REF: ${{ github.event.pull_request.head.sha }}

jobs:
  snapshot:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Commit deterministic generated dependency files and remove snapshot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git add -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          git rm .github/workflows/dependency-snapshot.yml
          git commit -m "Sync generated notification dependencies"
          git push origin HEAD:agent/mizan-monetization-premium
