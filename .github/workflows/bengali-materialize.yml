name: Verify materialized Bengali localization

on:
  push:
    branches: [agent/bengali-localization]
  pull_request:
    branches: [agent/mizanglobal-globalization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bengali-materialized-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  verify-materialized-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Bengali source without regeneration
        run: |
          set -euo pipefail
          python tools/materialize_bengali_locale.py --verify
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Analyze and run Bengali contract smoke tests
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed \
            lib/l10n/bn \
            lib/l10n/mizan_bn.dart \
            lib/l10n/mizan_bn_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            lib/main.dart \
            test/bengali_localization_contract_test.dart
          flutter analyze --fatal-warnings --fatal-infos
          flutter test --reporter expanded test/bengali_localization_contract_test.dart
          git diff --check
          test -z "$(git status --porcelain)"
