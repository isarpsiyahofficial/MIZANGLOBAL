name: Runtime reliability finalizer

on:
  push:
    branches: [agent/russian-localization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-reliability-finalizer-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  patch-commit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Russian branch
        uses: actions/checkout@v4
        with:
          ref: agent/russian-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make Russian audit deterministic and apply runtime fixes
        run: |
          set -euo pipefail
          python tools/apply_runtime_reliability_fixes.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/russian-localization.yml')
          text = path.read_text(encoding='utf-8')

          setup_old = """          flutter pub get
          chmod 0644 lib/l10n/mizan_ru.dart lib/l10n/ru/*.dart
"""
          setup_new = """          flutter pub get
          python tools/apply_runtime_reliability_fixes.py
          chmod 0644 lib/l10n/mizan_ru.dart lib/l10n/ru/*.dart
"""
          if setup_new not in text:
              if text.count(setup_old) != 1:
                  raise SystemExit('Russian workflow runtime patch insertion target is not unique.')
              text = text.replace(setup_old, setup_new, 1)

          format_old = """            lib/core/formatters.dart lib/widgets/global_picker_dialog.dart \\
            test/russian_localization_test.dart test/russian_end_to_end_test.dart \\
            test/russian_responsive_test.dart
"""
          format_new = """            lib/core/formatters.dart lib/widgets/global_picker_dialog.dart \\
            lib/services/monthly_payment_status_service.dart \\
            lib/services/notification_service.dart lib/controllers/mizan_controller.dart \\
            lib/screens/dashboard_screen.dart lib/screens/settings_screen.dart \\
            test/russian_localization_test.dart test/russian_end_to_end_test.dart \\
            test/russian_responsive_test.dart \\
            test/monthly_payment_status_reference_test.dart \\
            test/notification_fallback_scheduling_test.dart
"""
          if format_new not in text:
              if text.count(format_old) != 1:
                  raise SystemExit('Russian workflow formatter patch target is not unique.')
              text = text.replace(format_old, format_new, 1)

          add_old = """          git add .github/workflows/russian-localization.yml tools/*.py tools/russian_*.json \\
            assets/data/*.json lib/l10n/ru lib/l10n/mizan_ru*.dart lib/l10n/mizan_i18n.dart \\
            lib/main.dart lib/global/global_catalog.dart lib/core/formatters.dart \\
            lib/widgets/global_picker_dialog.dart test/*.dart
"""
          if '          git add -A\n' not in text:
              if text.count(add_old) != 1:
                  raise SystemExit('Russian workflow git add patch target is not unique.')
              text = text.replace(add_old, '          git add -A\n', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit runtime source immediately
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: correct overdue timing and background notifications'
          git fetch origin agent/russian-localization
          git rebase origin/agent/russian-localization
          git push origin HEAD:agent/russian-localization

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve, format and analyze
        run: |
          set -euo pipefail
          flutter pub get
          python tools/apply_runtime_reliability_fixes.py
          dart format \
            lib/services/monthly_payment_status_service.dart \
            lib/services/notification_service.dart \
            lib/controllers/mizan_controller.dart \
            lib/screens/dashboard_screen.dart \
            lib/screens/settings_screen.dart \
            test/monthly_payment_status_reference_test.dart \
            test/notification_fallback_scheduling_test.dart
          flutter analyze --fatal-warnings --fatal-infos

      - name: Run targeted reliability regressions
        run: |
          set -euo pipefail
          for file in \
            test/monthly_payment_status_reference_test.dart \
            test/overdue_calendar_tracking_test.dart \
            test/notification_fallback_scheduling_test.dart \
            test/notification_background_reliability_test.dart \
            test/automatic_notification_sync_test.dart \
            test/reminder_engine_test.dart; do
            timeout 12m flutter test --reporter expanded "$file"
          done
