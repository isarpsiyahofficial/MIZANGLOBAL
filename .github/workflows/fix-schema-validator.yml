name: Fix schema validator after currency migration
on:
  push:
    branches: [agent/chinese-localization]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true
      - name: Update structural validator and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/validate_project.py')
          s = p.read_text(encoding='utf-8')
          old = 'currentSchemaVersion = 13'
          if old not in s:
              raise SystemExit('schema validator anchor missing')
          p.write_text(s.replace(old, 'currentSchemaVersion = 14'), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-schema-validator.yml
          python3 tools/validate_project.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(validation): accept schema 14 record currencies'
          git push origin HEAD:agent/chinese-localization
