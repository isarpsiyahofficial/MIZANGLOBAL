name: Indonesian observable runtime materialization

on:
  pull_request:
    branches: [agent/mizanglobal-globalization]
    paths:
      - 'lib/l10n/id/**'
      - 'lib/l10n/mizan_id.dart'
      - 'lib/l10n/mizan_id_dynamic.dart'
      - 'tools/materialize_indonesian_runtime.py'
      - '.github/workflows/indonesian-self-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indonesian-observable-materialization
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/indonesian-localization'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/indonesian-localization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic CLDR dependency
        run: python -m pip install --disable-pip-version-check 'Babel==2.17.0'
      - name: Materialize and audit Indonesian source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/materialize_indonesian_runtime.py ]; then
            python tools/materialize_indonesian_runtime.py
          fi
          python tools/audit_indonesian_native_copy.py
          rm -f .github/workflows/indonesian-self-materialize.yml
          rm -f tools/materialize_indonesian_runtime.py
          dart format lib test
          git diff --check
      - name: Commit exact product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(id): integrate runtime formats and offline CLDR catalogs'
          git pull --rebase origin agent/indonesian-localization
          git push origin HEAD:agent/indonesian-localization
