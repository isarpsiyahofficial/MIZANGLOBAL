name: Profile language notification resync

on:
  push:
    branches: [agent/chinese-localization]

permissions:
  contents: write

concurrency:
  group: profile-language-notification-resync
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ hashFiles('tools/patch_profile_notification_resync.py') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply deterministic controller patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_profile_notification_resync.py
          dart format lib/controllers/mizan_controller.dart test/global_preferences_backup_invariants_test.dart
          flutter test test/global_preferences_backup_invariants_test.dart
          rm -f tools/patch_profile_notification_resync.py
          rm -f .github/workflows/profile-notification-resync.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(global): resync localized notifications only after language change'
          git push origin HEAD:agent/chinese-localization
