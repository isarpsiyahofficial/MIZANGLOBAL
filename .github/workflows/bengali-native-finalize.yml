name: Finalize Bengali native copy

on:
  push:
    branches: [agent/bengali-localization]
    paths:
      - 'tools/finalize_bengali_native_copy.py'
      - 'tools/clean_bengali_remaining_machine_copy.py'
      - '.github/workflows/bengali-native-finalize.yml'
  pull_request:
    branches: [agent/mizanglobal-globalization]
    paths:
      - 'lib/l10n/bn/**'
      - 'lib/l10n/mizan_bn_dynamic.dart'
      - 'test/bengali_*_test.dart'
      - 'tools/finalize_bengali_native_copy.py'
      - 'tools/clean_bengali_remaining_machine_copy.py'
      - '.github/workflows/bengali-native-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bengali-native-finalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/bengali-localization'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Check out Bengali candidate
        uses: actions/checkout@v4
        with:
          ref: agent/bengali-localization
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed native-copy corrections
        run: |
          set -euo pipefail
          python tools/finalize_bengali_native_copy.py
          python tools/clean_bengali_remaining_machine_copy.py
          python tools/materialize_bengali_locale.py --verify
          python tools/audit_bengali_native_copy.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Format, analyze and smoke-test
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/l10n/bn \
            lib/l10n/mizan_bn_dynamic.dart \
            test/bengali_localization_contract_test.dart \
            test/bengali_localization_test.dart \
            test/bengali_end_to_end_test.dart \
            test/bengali_responsive_test.dart
          python tools/materialize_bengali_locale.py --verify
          python tools/audit_bengali_native_copy.py
          flutter analyze --fatal-warnings --fatal-infos
          flutter test --reporter expanded test/bengali_localization_contract_test.dart
          flutter test --reporter expanded test/bengali_localization_test.dart
          flutter test --reporter expanded test/bengali_end_to_end_test.dart
          flutter test --reporter expanded test/bengali_responsive_test.dart
          git diff --check

      - name: Commit finalized Bengali source and tests
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain)"; then
            echo 'Bengali native copy and tests are already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/l10n/bn \
            lib/l10n/mizan_bn_dynamic.dart \
            test/bengali_localization_contract_test.dart \
            test/bengali_localization_test.dart \
            test/bengali_end_to_end_test.dart \
            test/bengali_responsive_test.dart
          git commit -m 'fix(bn): finalize Bengali source and acceptance tests'
          git fetch origin agent/bengali-localization
          git rebase origin/agent/bengali-localization
          git push origin HEAD:agent/bengali-localization
