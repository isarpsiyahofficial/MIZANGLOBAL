name: One-shot user review fixes v2

on:
  push:
    branches:
      - agent/chinese-localization
    paths:
      - '.github/workflows/one-shot-user-review-fixes-v2.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0

      - name: Reconstruct verified reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/tmp/user-review-fix-01.b64 \
            .github/tmp/user-review-fix-02.b64 \
            .github/tmp/user-review-fix-03.b64 \
            .github/tmp/user-review-fix-04.b64 \
            .github/tmp/user-review-fix-05.b64 \
            .github/tmp/user-review-fix-06.b64 \
            .github/tmp/user-review-fix-07.b64 > /tmp/mizan-fix.b64
          test "$(wc -c < /tmp/mizan-fix.b64 | tr -d ' ')" = "44760"
          echo 'bcf371690d363e4b4c5d0e5b35a53c551cb05da9587936773c16810aca05b21f  /tmp/mizan-fix.b64' | sha256sum -c -
          base64 -d /tmp/mizan-fix.b64 | gzip -dc > /tmp/mizan-fix.patch
          echo '05146b4a175166a515aeb92112a27b8b32893aac69f4d480d93ed66134573b71  /tmp/mizan-fix.patch' | sha256sum -c -
          git apply --check /tmp/mizan-fix.patch
          git apply /tmp/mizan-fix.patch
          python3 .github/tmp/align-stale-tests.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test

      - name: Verify static and targeted product gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_visible_copy_coverage.py
          python3 tools/validate_project.py
          flutter analyze --fatal-warnings
          flutter test test/global_release_integrity_contract_test.dart
          flutter test test/manual_overdue_edit_confirmation_test.dart
          flutter test test/ui_interaction_test.dart
          flutter test test/responsive_test.dart

      - name: Refresh intentional visual baselines
        shell: bash
        run: |
          set -euo pipefail
          flutter test --update-goldens test/visual_capture_test.dart
          flutter test test/visual_capture_test.dart

      - name: Verify full Flutter regression
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Generate deterministic Android without notifications
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create . --platforms=android --org com.lefferionprime --project-name lefferion_prime_mizan
          python3 tools/configure_android.py
          flutter pub get
          test "$(grep -c 'applicationId = "com.lefferionprime.mizanglobal"' android/app/build.gradle.kts)" -eq 1
          test "$(grep -c 'namespace = "com.lefferionprime.mizanglobal"' android/app/build.gradle.kts)" -eq 1
          if grep -R -n -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|flutterlocalnotifications|FlutterLocalNotifications|flutter_timezone' android lib/main.dart lib/controllers/mizan_controller.dart lib/screens/settings_screen.dart pubspec.yaml; then
            echo 'Notification shipping capability still present' >&2
            exit 1
          fi
          python3 tools/audit_visible_copy_coverage.py
          python3 tools/validate_project.py
          flutter analyze --fatal-warnings
          flutter test test/global_release_integrity_contract_test.dart
          git diff --check

      - name: Prepare exact verified transferable source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-user-review-fixes.yml
          rm -f .github/workflows/one-shot-user-review-fixes-v2.yml
          rm -f .github/workflows/one-shot-user-review-fixes-v3.yml
          rm -f .github/tmp/align-stale-tests.py
          rm -f .github/tmp/user-review-fix-01.b64 \
                .github/tmp/user-review-fix-02.b64 \
                .github/tmp/user-review-fix-03.b64 \
                .github/tmp/user-review-fix-04.b64 \
                .github/tmp/user-review-fix-05.b64 \
                .github/tmp/user-review-fix-06.b64 \
                .github/tmp/user-review-fix-07.b64
          rmdir .github/tmp 2>/dev/null || true
          git add -A
          git diff --cached --check
          mkdir -p /tmp/mizan-transfer
          git diff --cached --binary HEAD > /tmp/mizan-transfer/verified-product.patch
          git status --short > /tmp/mizan-transfer/verified-files.txt
          git rev-parse HEAD > /tmp/mizan-transfer/source-parent-sha.txt
          sha256sum /tmp/mizan-transfer/verified-product.patch > /tmp/mizan-transfer/verified-product.patch.sha256
          tar --exclude=.git --exclude=build --exclude=.dart_tool -czf /tmp/mizan-transfer/verified-source.tar.gz .
          sha256sum /tmp/mizan-transfer/verified-source.tar.gz > /tmp/mizan-transfer/verified-source.tar.gz.sha256
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          test -f .github/workflows/android-release.yml
          test -f .github/workflows/final-branch-ci.yml

      - name: Upload exact verified transferable source
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-user-review-verified-source
          path: /tmp/mizan-transfer/
          if-no-files-found: error
          retention-days: 7
