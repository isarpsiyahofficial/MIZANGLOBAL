name: Indonesian post-merge product verification

on:
  push:
    branches: [agent/mizanglobal-globalization]
    paths:
      - 'lib/l10n/id/**'
      - 'lib/l10n/mizan_id*'
      - 'test/indonesian*_test.dart'
      - '.github/workflows/indonesian-post-merge-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'

concurrency:
  group: indonesian-product-verification
  cancel-in-progress: false

jobs:
  verify-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizanglobal-globalization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Babel>=2.15,<3'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify deterministic Indonesian source on product
        run: |
          set -euo pipefail
          test -f lib/l10n/mizan_id.dart
          test -f tools/indonesian_translation_cache.json
          flutter pub get
          python tools/bootstrap_indonesian_locale.py
          python tools/finalize_indonesian_runtime.py
          test -z "$(git status --porcelain)"
          python tools/audit_indonesian_native_copy.py
          python tools/validate_indonesian_localization_scope.py
          dart format --output=none --set-exit-if-changed lib test tools
          flutter analyze --fatal-warnings --fatal-infos
      - name: Recheck language PDF reports notifications and inherited languages
        run: |
          set -euo pipefail
          for file in test/indonesian_localization_test.dart test/indonesian_end_to_end_test.dart test/indonesian_responsive_test.dart; do
            timeout 15m flutter test --reporter expanded "$file"
          done
          mapfile -t pdf_tests < <(grep -l -Ei 'pdf|Pdf' test/*_test.dart | sort -u)
          test "${#pdf_tests[@]}" -gt 0
          for file in "${pdf_tests[@]}"; do
            timeout 15m flutter test --reporter expanded "$file"
          done
          for file in \
            test/bengali_localization_test.dart \
            test/urdu_localization_test.dart \
            test/global_setup_test.dart \
            test/monthly_payment_status_reference_test.dart \
            test/overdue_calendar_tracking_test.dart \
            test/notification_fallback_scheduling_test.dart \
            test/automatic_notification_sync_test.dart \
            test/reminder_engine_test.dart; do
            test -f "$file"
            timeout 15m flutter test --reporter expanded "$file"
          done
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Build verified product APK
        run: |
          set -euo pipefail
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > /tmp/indonesian-product-apk.sha256
      - name: Record exact accepted product head
        run: |
          set -euo pipefail
          verified_head="$(git rev-parse HEAD)"
          mkdir -p docs/localization
          cat > docs/localization/indonesian-final-product-acceptance.md <<EOF
          # Endonezce final ürün kabulü

          Doğrulanan ürün head: \`$verified_head\`

          Bu kayıt; 791/791 Endonezce metin, ana dil ve görünür dil saflığı, id/id-ID/in-ID runtime, kataloglar, Endonezya sayı-para-tarih davranışı, rapor ve bütün PDF testleri, bildirim ve gecikme hesapları, responsive uçtan uca testler, önceki Bengalce ve Urduca regresyonu, statik analiz ve ürün APK üretimi aynı ürün ağacında başarıyla tamamlandıktan sonra oluşturulmuştur.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/localization/indonesian-final-product-acceptance.md
          git commit -m 'docs(id): record final Indonesian product acceptance'
          git fetch origin agent/mizanglobal-globalization
          git rebase origin/agent/mizanglobal-globalization
          git push origin HEAD:agent/mizanglobal-globalization
