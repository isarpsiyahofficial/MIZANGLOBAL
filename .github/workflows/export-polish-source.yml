name: Export Polish source workspace

on:
  push:
    branches:
      - agent/polish-localization
    paths:
      - .github/workflows/export-polish-source.yml
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/export-polish-source.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Polish localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/polish-localization
          fetch-depth: 0

      - name: Package source workspace
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=.dart_tool \
            -czf /tmp/mizan-polish-source.tar.gz .
          sha256sum /tmp/mizan-polish-source.tar.gz > /tmp/mizan-polish-source.sha256

      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: mizan-polish-source-workspace
          path: |
            /tmp/mizan-polish-source.tar.gz
            /tmp/mizan-polish-source.sha256
          if-no-files-found: error
