name: Android Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"
  FINAL_LOGO_SHA256: "82113136e2cb59c86b86bdb2df3267fcb89cd474e6ec0a758eafa37a4ca86252"
  FINAL_FOREGROUND_SHA256: "d72dd2ddbd864a3c637942b245025311e010d151873482d6d3f3049e4785f918"

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Capture production source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Production release input gate
        env:
          ADMOB_APP_ID: ${{ secrets.MIZAN_ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.MIZAN_ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.MIZAN_ADMOB_REWARDED_ID }}
          KEYSTORE_B64: ${{ secrets.MIZAN_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MIZAN_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$ADMOB_APP_ID" "$ADMOB_INTERSTITIAL_ID" "$ADMOB_REWARDED_ID" "$KEYSTORE_B64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do test -n "$value"; done
          [[ "$ADMOB_APP_ID" == ca-app-pub-*~* ]]
          [[ "$ADMOB_INTERSTITIAL_ID" == ca-app-pub-*/* ]]
          [[ "$ADMOB_REWARDED_ID" == ca-app-pub-*/* ]]
          ! printf '%s\n' "$ADMOB_APP_ID" "$ADMOB_INTERSTITIAL_ID" "$ADMOB_REWARDED_ID" | grep -q '3940256099942544'

      - name: Exact final brand integrity gate
        run: |
          set -euo pipefail
          echo "$FINAL_LOGO_SHA256  assets/brand/lefferion-prime-logo-v3.png" | sha256sum -c -
          echo "$FINAL_FOREGROUND_SHA256  assets/brand/lefferion-prime-logo-v3-foreground.png" | sha256sum -c -

      - name: Play Billing policy horizon gate
        run: |
          set -euo pipefail
          BILLING_PLUGIN_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('pubspec.lock').read_text(encoding='utf-8')
          match = re.search(r'^  in_app_purchase_android:\n(?:(?:    |      ).*\n)*?    version: "([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit('Unable to resolve in_app_purchase_android from pubspec.lock')
          print(match.group(1))
          PY
          )"
          TODAY_UTC="$(date -u +%Y%m%d)"
          if [[ "$BILLING_PLUGIN_VERSION" == "0.5.2" && "$TODAY_UTC" -ge 20270901 ]]; then
            echo "::warning::in_app_purchase_android 0.5.2 uses Google Play Billing Library 8. New app/update support ends 2027-08-31; extension ends 2027-11-01."
          fi
          if [[ "$BILLING_PLUGIN_VERSION" == "0.5.2" && "$TODAY_UTC" -ge 20271102 ]]; then
            echo "::error::Production release refused: Google Play Billing Library 8 is beyond its final extension horizon. Upgrade the billing implementation before publishing."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.MIZAN_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mizan-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mizan-signing/release.p12"
          chmod 600 "$RUNNER_TEMP/mizan-signing/release.p12"
          test -s "$RUNNER_TEMP/mizan-signing/release.p12"

      - name: Resolve production dependencies
        run: flutter pub get

      - name: Regenerate launcher icons from exact final brand
        run: dart run flutter_launcher_icons

      - name: Build production APK
        env:
          MIZAN_TEST_ADS: "false"
          MIZAN_ADMOB_APP_ID: ${{ secrets.MIZAN_ADMOB_APP_ID }}
          MIZAN_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/mizan-signing/release.p12
          MIZAN_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEYSTORE_PASSWORD }}
          MIZAN_RELEASE_KEY_ALIAS: ${{ secrets.MIZAN_RELEASE_KEY_ALIAS }}
          MIZAN_RELEASE_KEY_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --dart-define=MIZAN_TEST_ADS=false
          --dart-define=MIZAN_ADMOB_INTERSTITIAL_ID=${{ secrets.MIZAN_ADMOB_INTERSTITIAL_ID }}
          --dart-define=MIZAN_ADMOB_REWARDED_ID=${{ secrets.MIZAN_ADMOB_REWARDED_ID }}

      - name: Production APK integrity gate
        env:
          ADMOB_APP_ID: ${{ secrets.MIZAN_ADMOB_APP_ID }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.lefferionprime.mizanglobal'"
          printf '%s\n' "$BADGING" | grep -q "targetSdkVersion:'36'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F "$ADMOB_APP_ID"
          unzip -p "$APK" assets/flutter_assets/assets/brand/lefferion-prime-logo-v3.png > "$RUNNER_TEMP/mizan-final-logo.png"
          echo "$FINAL_LOGO_SHA256  $RUNNER_TEMP/mizan-final-logo.png" | sha256sum -c -

      - name: Verify production APK modern signature
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -Eq 'Verified using v(2|3|4) scheme.*: true' "$RUNNER_TEMP/apksigner.txt"
          ! grep -qi 'CN=Android Debug' "$RUNNER_TEMP/apksigner.txt"

      - name: Build production Google Play AAB
        env:
          MIZAN_TEST_ADS: "false"
          MIZAN_ADMOB_APP_ID: ${{ secrets.MIZAN_ADMOB_APP_ID }}
          MIZAN_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/mizan-signing/release.p12
          MIZAN_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEYSTORE_PASSWORD }}
          MIZAN_RELEASE_KEY_ALIAS: ${{ secrets.MIZAN_RELEASE_KEY_ALIAS }}
          MIZAN_RELEASE_KEY_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release
          --dart-define=MIZAN_TEST_ADS=false
          --dart-define=MIZAN_ADMOB_INTERSTITIAL_ID=${{ secrets.MIZAN_ADMOB_INTERSTITIAL_ID }}
          --dart-define=MIZAN_ADMOB_REWARDED_ID=${{ secrets.MIZAN_ADMOB_REWARDED_ID }}

      - name: Verify production AAB signature
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB"

      - name: Seal release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MIZAN-PRODUCTION-${SOURCE_SHA}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/MIZAN-PRODUCTION-${SOURCE_SHA}.aab"
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload production release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mizan-production-${{ env.SOURCE_SHA }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mizan-signing"