name: Android Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"
  FINAL_LOGO_PIXEL_SHA256: "59e6bc2a19714a9761cff46582b801b87136369f98ff9be215da4c24823748de"

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture production source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Production release input gate
        env:
          ADMOB_APP_ID: ${{ secrets.MIZAN_ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.MIZAN_ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.MIZAN_ADMOB_REWARDED_ID }}
          KEYSTORE_B64: ${{ secrets.MIZAN_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MIZAN_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in \
            "$ADMOB_APP_ID" \
            "$ADMOB_INTERSTITIAL_ID" \
            "$ADMOB_REWARDED_ID" \
            "$KEYSTORE_B64" \
            "$KEYSTORE_PASSWORD" \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD"; do
            test -n "$value"
          done
          [[ "$ADMOB_APP_ID" == ca-app-pub-*~* ]]
          [[ "$ADMOB_INTERSTITIAL_ID" == ca-app-pub-*/* ]]
          [[ "$ADMOB_REWARDED_ID" == ca-app-pub-*/* ]]
          ! printf '%s\n' "$ADMOB_APP_ID" "$ADMOB_INTERSTITIAL_ID" "$ADMOB_REWARDED_ID" | grep -q '3940256099942544'

      - name: Verify final brand and derive responsive launcher foreground
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image
          import os

          expected = os.environ['FINAL_LOGO_PIXEL_SHA256']
          master_path = Path('assets/brand/lefferion-prime-logo-v3.png')
          foreground_path = Path('assets/brand/lefferion-prime-logo-v3-foreground.png')
          if not master_path.is_file() or master_path.stat().st_size == 0:
              raise SystemExit(f'missing final brand master: {master_path}')

          with Image.open(master_path) as image:
              master = image.convert('RGBA')
          if master.size != (2048, 2048):
              raise SystemExit(f'final logo must be 2048x2048, got {master.size}')
          actual = sha256(master.tobytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'final logo pixel hash mismatch: {actual}')

          side = round(2048 * 0.65)
          resized = master.resize((side, side), Image.Resampling.LANCZOS)
          foreground = Image.new('RGBA', (2048, 2048), (0, 0, 0, 0))
          offset = ((2048 - side) // 2, (2048 - side) // 2)
          foreground.alpha_composite(resized, offset)
          bbox = foreground.getchannel('A').getbbox()
          if bbox is None:
              raise SystemExit('adaptive foreground is empty')
          width = bbox[2] - bbox[0]
          height = bbox[3] - bbox[1]
          if width / 2048 > 0.62 or height / 2048 > 0.62:
              raise SystemExit(f'adaptive foreground exceeds safe responsive bounds: {bbox}')
          foreground.save(foreground_path, format='PNG', optimize=True, compress_level=9)
          print('master_pixel_sha256=' + actual)
          print('adaptive_alpha_bbox=' + repr(bbox))
          PY

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.MIZAN_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mizan-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mizan-signing/release.p12"
          chmod 600 "$RUNNER_TEMP/mizan-signing/release.p12"
          test -s "$RUNNER_TEMP/mizan-signing/release.p12"

      - name: Resolve production dependencies
        run: flutter pub get

      - name: Regenerate launcher icons from verified final brand
        run: dart run flutter_launcher_icons

      - name: Build production APK
        env:
          MIZAN_TEST_ADS: "false"
          MIZAN_ADMOB_APP_ID: ${{ secrets.MIZAN_ADMOB_APP_ID }}
          MIZAN_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/mizan-signing/release.p12
          MIZAN_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEYSTORE_PASSWORD }}
          MIZAN_RELEASE_KEY_ALIAS: ${{ secrets.MIZAN_RELEASE_KEY_ALIAS }}
          MIZAN_RELEASE_KEY_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --dart-define=MIZAN_TEST_ADS=false
          --dart-define=MIZAN_ADMOB_INTERSTITIAL_ID=${{ secrets.MIZAN_ADMOB_INTERSTITIAL_ID }}
          --dart-define=MIZAN_ADMOB_REWARDED_ID=${{ secrets.MIZAN_ADMOB_REWARDED_ID }}

      - name: Production APK content integrity gate
        env:
          ADMOB_APP_ID: ${{ secrets.MIZAN_ADMOB_APP_ID }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.lefferionprime.mizanglobal'"
          printf '%s\n' "$BADGING" | grep -q "targetSdkVersion:'36'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F "$ADMOB_APP_ID"
          unzip -p "$APK" assets/flutter_assets/assets/brand/lefferion-prime-logo-v3.png > "$RUNNER_TEMP/mizan-final-logo.png"
          python3 - <<'PY'
          from hashlib import sha256
          from PIL import Image
          import os

          path = os.path.join(os.environ['RUNNER_TEMP'], 'mizan-final-logo.png')
          with Image.open(path) as image:
              rgba = image.convert('RGBA')
              actual = sha256(rgba.tobytes()).hexdigest()
          expected = os.environ['FINAL_LOGO_PIXEL_SHA256']
          if actual != expected:
              raise SystemExit(f'embedded final logo pixel hash mismatch: {actual}')
          PY

      - name: Verify production APK modern signature
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -Eq 'Verified using v(2|3|4) scheme.*: true' "$RUNNER_TEMP/apksigner.txt"
          ! grep -qi 'CN=Android Debug' "$RUNNER_TEMP/apksigner.txt"

      - name: Build production Google Play AAB
        env:
          MIZAN_TEST_ADS: "false"
          MIZAN_ADMOB_APP_ID: ${{ secrets.MIZAN_ADMOB_APP_ID }}
          MIZAN_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/mizan-signing/release.p12
          MIZAN_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEYSTORE_PASSWORD }}
          MIZAN_RELEASE_KEY_ALIAS: ${{ secrets.MIZAN_RELEASE_KEY_ALIAS }}
          MIZAN_RELEASE_KEY_PASSWORD: ${{ secrets.MIZAN_RELEASE_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release
          --dart-define=MIZAN_TEST_ADS=false
          --dart-define=MIZAN_ADMOB_INTERSTITIAL_ID=${{ secrets.MIZAN_ADMOB_INTERSTITIAL_ID }}
          --dart-define=MIZAN_ADMOB_REWARDED_ID=${{ secrets.MIZAN_ADMOB_REWARDED_ID }}

      - name: Verify production AAB signature
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB"

      - name: Seal release artifacts
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MIZAN-PRODUCTION-${SOURCE_SHA}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/MIZAN-PRODUCTION-${SOURCE_SHA}.aab"
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload production release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mizan-production-${{ env.SOURCE_SHA }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mizan-signing"
