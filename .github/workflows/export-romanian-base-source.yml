name: Export Romanian base source

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/export-romanian-base-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Romanian branch
        uses: actions/checkout@v4
        with:
          ref: agent/romanian-localization

      - name: Package exact branch source
        run: |
          tar --exclude=.git --exclude=build --exclude=.dart_tool \
            -czf /tmp/mizan-romanian-base-source.tar.gz .
          sha256sum /tmp/mizan-romanian-base-source.tar.gz \
            > /tmp/mizan-romanian-base-source.sha256

      - name: Upload exact source package
        uses: actions/upload-artifact@v4
        with:
          name: mizan-romanian-base-source
          path: |
            /tmp/mizan-romanian-base-source.tar.gz
            /tmp/mizan-romanian-base-source.sha256
          if-no-files-found: error
