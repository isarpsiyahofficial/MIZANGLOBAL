name: Apply reviewed Polish integration payload

on:
  push:
    branches:
      - agent/polish-localization
    paths:
      - .github/workflows/apply-polish-payload.yml
      - tools/apply_polish_payload.py
      - tools/polish_payload/**

permissions:
  contents: write

concurrency:
  group: apply-polish-payload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Polish localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/polish-localization
          fetch-depth: 0

      - name: Apply reviewed integration files
        run: python tools/apply_polish_payload.py

      - name: Remove temporary transport files
        run: |
          rm -rf tools/polish_payload
          rm -f tools/apply_polish_payload.py
          rm -f .github/workflows/apply-polish-payload.yml

      - name: Commit reviewed Polish support sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pl): add reviewed runtime grammar audits and tests'
          git push origin HEAD:agent/polish-localization
