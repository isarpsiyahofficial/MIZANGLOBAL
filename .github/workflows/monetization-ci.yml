name: MIZAN monetization audit

on:
  push:
    branches:
      - agent/mizan-monetization-premium
  pull_request:
    branches:
      - agent/mizanglobal-globalization

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"
  NODE_VERSION: "22"

concurrency:
  group: monetization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        shell: bash
        run: |
          set +e
          dart analyze --fatal-warnings --format=machine | tee /tmp/dart-analyze.txt
          analyze_status=${PIPESTATUS[0]}
          python3 - <<'PY'
          from pathlib import Path

          report = Path('/tmp/dart-analyze.txt')
          if report.exists():
              for raw in report.read_text(encoding='utf-8', errors='replace').splitlines():
                  parts = raw.split('|', 7)
                  if len(parts) != 8:
                      continue
                  severity, issue_type, code, path, line, column, length, message = parts
                  if severity not in {'ERROR', 'WARNING'}:
                      continue
                  command = 'error' if severity == 'ERROR' else 'warning'
                  escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(
                      f'::{command} file={path},line={line},col={column},title={code}::{escaped}'
                  )
          PY
          exit "$analyze_status"
      - name: Run tests
        run: flutter test
      - name: Build Android debug APK with test ads
        run: >-
          flutter build apk --debug
          --dart-define=MIZAN_TEST_ADS=true
          --dart-define=MIZAN_REQUIRE_BILLING_BACKEND=false

  monetization-worker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/monetization-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Worker dependencies
        run: npm install --ignore-scripts
      - name: Typecheck and Wrangler dry run
        run: npm run check
