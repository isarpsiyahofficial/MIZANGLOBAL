name: MIZAN source hygiene transition

on:
  push:
    branches:
      - agent/mizan-monetization-premium
  pull_request:
    branches:
      - agent/mizanglobal-globalization

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"

concurrency:
  group: source-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Clean tracked source residue
        run: python tools/source_hygiene_transition.py
      - name: Format and validate cleaned source
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          python tools/audit_chinese_native_copy.py
          python tools/audit_filipino_native_copy.py
          python tools/audit_indonesian_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_urdu_native_copy.py
          python tools/audit_vietnamese_native_copy.py
          python tools/validate_project.py
          python tools/audit_visible_copy_coverage.py
          flutter analyze --fatal-warnings
          flutter test
      - name: Verify tracked source hygiene
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          terms = re.compile(
              r'\b(chatgpt|openai|copilot|claude|anthropic|gemini|gpt(?:-?\d+(?:\.\d+)*)?|llm|large language model|generative ai|ai-generated|ai-assisted|generated by ai|artificial intelligence|yapay zeka|machine-generated|machine regeneration)\b',
              re.I,
          )
          text_extensions = {
              '.dart', '.kt', '.kts', '.java', '.gradle', '.groovy', '.ts', '.tsx',
              '.js', '.jsx', '.mjs', '.cjs', '.css', '.scss', '.py', '.md', '.yml',
              '.yaml', '.txt', '.json', '.xml', '.html', '.sh', '.properties', '.toml',
          }
          source_extensions = {
              '.dart', '.kt', '.kts', '.java', '.gradle', '.groovy', '.ts', '.tsx',
              '.js', '.jsx', '.mjs', '.cjs', '.css', '.scss',
          }
          forbidden = []
          comments = []
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              if not path.is_file():
                  continue
              if path.suffix not in text_extensions and path.name not in {'.gitignore', 'Dockerfile'}:
                  continue
              try:
                  source = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(source.splitlines(), 1):
                  if terms.search(line):
                      forbidden.append(f'{path}:{number}')
                  if path.suffix in source_extensions and line.lstrip().startswith('//'):
                      stripped = line.lstrip()
                      if stripped not in {'// dart format off', '// dart format on'}:
                          comments.append(f'{path}:{number}')
          if forbidden:
              raise SystemExit('Forbidden provenance residue remains: ' + ', '.join(forbidden[:20]))
          if comments:
              raise SystemExit('Informational slash comments remain: ' + ', '.join(comments[:20]))
          for relative in (
              '.idea', 'test/failures', 'lefferion_prime_mizan.iml',
              'android/lefferion_prime_mizan_android.iml',
              '.github/monetization-ci.final',
              '.github/workflows/source-hygiene-once.yml',
              'tools/source_hygiene_transition.py',
              'docs/BATCH_PLAN.md', 'docs/ENGLISH_LOCALIZATION_VERIFICATION.md',
              'docs/SPANISH_LOCALIZATION_VERIFICATION.md',
              'docs/localization/bengali-final-candidate-status.md',
              'docs/localization/filipino-source-final.md',
              'docs/localization/global-language-status.md',
          ):
              if Path(relative).exists():
                  raise SystemExit(f'Residual file remains: {relative}')
          PY
          git diff --check
      - name: Commit cleaned source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "chore: clean source hygiene residue"
          git push origin HEAD:agent/mizan-monetization-premium
