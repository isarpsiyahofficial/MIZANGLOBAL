name: MIZAN monetization audit

on:
  push:
    branches:
      - agent/mizan-monetization-premium
  pull_request:
    branches:
      - agent/mizanglobal-globalization

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"
  SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: monetization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify serverless monetization source
        run: |
          set -euo pipefail
          test ! -e backend/monetization-worker
          test ! -e lib/monetization/monetization_api.dart
          ! grep -R -E 'MIZAN_MONETIZATION_API|MIZAN_REQUIRE_BILLING_BACKEND|MIZAN_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER|PROMO_PEPPER|GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY|play_integrity|device_identity|StandardIntegrityManager|com.google.android.play:integrity' lib/monetization android/app/src/main android/app/build.gradle.kts
          grep -q "permanentPremiumProductId = 'premium_lifetime'" lib/monetization/monetization_config.dart
          ! grep -R -E 'subscriptionPremiumProductId|premium_subscription|threeMonthBasePlanId|monthlyBasePlanId' lib/monetization lib/screens/premium_screen.dart
          grep -q "rewardedViewsRequiredForDailyPremium = 3" lib/monetization/monetization_config.dart
          grep -q "behaviorActionThreshold = 3" lib/monetization/monetization_config.dart
          grep -Fq "bool get canUseApp => _legalAccessGranted && (isPremium || isOnline);" lib/monetization/monetization_controller.dart
          grep -Fq "bool get canExportPdf => _legalAccessGranted && isPremium;" lib/monetization/monetization_controller.dart
          grep -q "queryPastPurchases" lib/monetization/purchase_service.dart
          grep -q "Hmac(sha256" lib/monetization/local_promo_service.dart
          grep -q "40d844f4232ec3ccfec81fd04e7256d1b3fcfcc471f2439629d21a6d80eccdaa" lib/monetization/local_promo_service.dart
          grep -q "578af8ebcd839ce76ca6028fb78275d8afd4f4093cc7a01477130cbd1873bd26" lib/monetization/local_promo_service.dart
          grep -q "d159e3b769a237992f5c6896023892fca1b27beac336207eea7995fdcb3773bd" lib/monetization/local_promo_service.dart
          ! grep -R -F 'IBRAHIM' lib
          grep -q "PermanentPremiumSource.localPromotion" lib/monetization/purchase_service.dart
          grep -q "PurchaseConsentScreen" lib/screens/premium_screen.dart
          grep -q "Icons.storefront_outlined" lib/main.dart
      - name: Structural validation
        run: python3 tools/validate_project.py
      - name: Cross-language leakage audit
        run: python3 tools/audit_cross_language_leaks.py
      - name: Auxiliary language surface audit
        run: python3 tools/audit_auxiliary_language_surfaces.py
      - name: Analyze
        run: dart analyze --fatal-warnings
      - name: Render current release visual contract
        env:
          MIZAN_CAPTURE_PERSON_DETAILS_GOLDEN: "true"
        run: flutter test --update-goldens test/visual_capture_test.dart
      - name: Verify release-critical visual fingerprints
        run: |
          set -euo pipefail
          sha256sum test/goldens/06-person-details.png
          sha256sum test/goldens/09-reports-simple.png
          echo "d54acc7bc901d23568bfc04b8e03e50b51faa840f8fdbfe55011aeffa0f8e7e3  test/goldens/06-person-details.png" | sha256sum -c -
          echo "ed364838973351528bc2e25c9c1a4c6d50a0a6471eb2abe5f4b0a8dcc0d5d906  test/goldens/09-reports-simple.png" | sha256sum -c -
      - name: Run tests
        run: flutter test
      - name: Restore generated visual baselines
        run: git restore test/goldens
      - name: Verify exact source before build
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git diff --exit-code
      - name: Build Android debug APK with test ads
        run: >-
          flutter build apk --debug
          --dart-define=MIZAN_TEST_ADS=true
      - name: Verify exact source after build
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git diff --exit-code
