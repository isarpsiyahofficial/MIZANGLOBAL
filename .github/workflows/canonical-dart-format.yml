name: Canonical Dart format

on:
  push:
    branches:
      - agent/mizan-monetization-premium

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: dart format lib/legal/legal_document_focus.dart lib/monetization/ad_service.dart test/legal_monetization_gate_contract_test.dart
      - name: Commit canonical formatting if needed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/legal/legal_document_focus.dart lib/monetization/ad_service.dart test/legal_monetization_gate_contract_test.dart
          git commit -m "Apply canonical Dart formatting"
          git push origin HEAD:agent/mizan-monetization-premium
