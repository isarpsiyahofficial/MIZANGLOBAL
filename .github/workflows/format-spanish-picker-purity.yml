name: Format and verify Spanish picker purity

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-spanish-picker-purity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  format-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout follow-up branch
        uses: actions/checkout@v5
        with:
          ref: agent/spanish-visible-copy-purity
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Format and verify
        run: |
          set -euo pipefail
          flutter pub get
          dart format test/spanish_picker_purity_test.dart test/language_restart_test.dart
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py
          python3 tools/validate_spanish_visible_copy.py
          flutter analyze --fatal-warnings
          flutter test --reporter expanded \
            test/spanish_picker_purity_test.dart \
            test/language_restart_test.dart \
            test/spanish_localization_test.dart \
            test/english_localization_test.dart

      - name: Commit formatter output
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "MIZAN Spanish Picker Verification"
          git config user.email "actions@users.noreply.github.com"
          git add test/spanish_picker_purity_test.dart test/language_restart_test.dart
          if git diff --cached --quiet; then
            echo "Picker tests are already formatted."
            exit 0
          fi
          git commit -m "test: format Spanish picker purity checks"
          git push origin "HEAD:${HEAD_BRANCH}"
