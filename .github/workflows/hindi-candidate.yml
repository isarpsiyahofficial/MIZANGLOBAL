name: Generate Hindi review candidate

on:
  push:
    branches: [agent/hindi-localization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 791-key Hindi candidate
        run: python tools/generate_hindi_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: mizan-hindi-translation-candidate
          path: build/hindi-candidate
          if-no-files-found: error
          retention-days: 7
