name: One-time Dart format repair

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - '.github/workflows/format-repair.yml'
      - 'lib/screens/expenses_screen.dart'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/mizan-monetization-premium'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply exact formatter and self-clean
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/screens/expenses_screen.dart
          git rm .github/workflows/format-repair.yml
          if git diff --quiet --cached && git diff --quiet; then
            echo 'No repair changes were produced.'
            exit 1
          fi
          git add lib/screens/expenses_screen.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format 60-day expense filter'
          git push origin HEAD:agent/mizan-monetization-premium
