name: Materialize Spanish source through PR

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-spanish-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Spanish candidate
        uses: actions/checkout@v5
        with:
          ref: agent/spanish-localization-candidate
          fetch-depth: 0

      - name: Materialize verified Spanish source
        run: bash tools/materialize_spanish_source.sh

      - name: Validate Spanish and English coverage
        run: |
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies format and analyze
        run: |
          flutter pub get
          dart format lib test
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py
          git diff --check
          flutter analyze --fatal-warnings

      - name: Commit verified Spanish source only
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git restore test/output || true
          git config user.name "MIZAN Spanish Localization"
          git config user.email "actions@users.noreply.github.com"
          git add assets lib test tools docs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add native Spanish localization"
          git push origin "HEAD:${HEAD_BRANCH}"
