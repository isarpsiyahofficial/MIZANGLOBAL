name: Probe Canva marked payload exactness

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/probe-canva-tile-fallback.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify noisy RGB payload behind one transparent marker
        env:
          URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F73b8c203-9466-46d3-8912-b292d3dbd8a0/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAI4W1Av0ClFS647AuKlMoKc5cTXPDS5knQQJYOgXET1T&exp=1788627924&osig=AAAAAAAAAAAAAAAAAAAAAP0fufTUgwuyhWqJzxidqrgE9FcBS2HhEzc1kWH9saFH&signer=media-rpc&x-canva-quality=thumbnail'
          EXPECTED: 8975b426920becc64357fac8ca7cb6b4801907910e4e5ea311bad6068b5e6db5
        run: |
          set -euo pipefail
          curl --fail --show-error --location --max-time 30 "$URL" -o tile.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from hashlib import sha256
          import os
          with Image.open('tile.png') as im:
              rgba=im.convert('RGBA')
              if rgba.size != (200,200): raise SystemExit(1)
              px=list(rgba.getdata())
              print('MARKER', px[0])
              data=bytes(c for p in px[1:] for c in p[:3])
              h=sha256(data).hexdigest()
              print('PAYLOAD_SHA256', h)
              print('EXPECTED', os.environ['EXPECTED'])
              print('MATCH', h == os.environ['EXPECTED'])
              if h != os.environ['EXPECTED']:
                  raise SystemExit(1)
          PY
