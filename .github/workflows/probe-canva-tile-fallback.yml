name: Probe Canva asset tile exactness

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/probe-canva-tile-fallback.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Download 200px Canva asset and verify exact RGBA
        env:
          URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Ffed4436d-7a41-483d-abd9-5c12ddba39d9/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACQSjEbqxqeI_fiIwESId1xaG1GAjR8DMr8tsYuF_4w2&exp=1788627753&osig=AAAAAAAAAAAAAAAAAAAAABwVIld6KGcM40iHPw3fc6sHJv1tC0b83PMsI66tflx-&signer=media-rpc&x-canva-quality=thumbnail'
          EXPECTED: b9ce164d30e4101b009fe4be765a070593cfbdd48f897853de159a8c177fabe8
        run: |
          set -euo pipefail
          curl --fail --show-error --location --max-time 30 "$URL" -o tile.png
          file tile.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from hashlib import sha256
          import os
          with Image.open('tile.png') as im:
              rgba=im.convert('RGBA')
              print('SIZE', rgba.size)
              h=sha256(rgba.tobytes()).hexdigest()
              print('RGBA_SHA256', h)
              print('EXPECTED', os.environ['EXPECTED'])
              print('MATCH', h == os.environ['EXPECTED'])
              if rgba.size != (200,200) or h != os.environ['EXPECTED']:
                  raise SystemExit(1)
          PY
