name: Probe Canva row-marked payload exactness

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/probe-canva-tile-fallback.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify full-row marker payload survives exactly
        env:
          URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fd43fbbf9-50c0-4eb8-b7f7-dad01e0a245f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGy25KGB1kmYam5EK31DCKHv04lIEW8NXklIh1937Q70&exp=1788626972&osig=AAAAAAAAAAAAAAAAAAAAAMY8uFmS_GYZh4UwVCy-81MEFMd-JL-ZQv9gSkSRbIkF&signer=media-rpc&x-canva-quality=thumbnail'
          EXPECTED: d3fe3bccb4fba89b01ef818d88fabc2da2dc4ce9c259a7471044c3429e2ec798
        run: |
          set -euo pipefail
          curl --fail --show-error --location --max-time 30 "$URL" -o tile.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from hashlib import sha256
          import os
          with Image.open('tile.png') as im:
              rgba=im.convert('RGBA')
              if rgba.size != (200,200): raise SystemExit(1)
              px=list(rgba.getdata())
              if any(p[3] != 0 for p in px[:200]):
                  raise SystemExit('marker row was not preserved')
              data=bytes(c for p in px[200:] for c in p[:3])
              h=sha256(data).hexdigest()
              print('PAYLOAD_SHA256', h)
              print('EXPECTED', os.environ['EXPECTED'])
              print('MATCH', h == os.environ['EXPECTED'])
              if h != os.environ['EXPECTED']:
                  raise SystemExit(1)
          PY
