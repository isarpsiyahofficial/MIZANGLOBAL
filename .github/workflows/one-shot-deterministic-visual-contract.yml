name: One-shot deterministic visual contract

on:
  push:
    branches:
      - agent/chinese-localization

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply deterministic clock audit and currency corrections
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_deterministic_clock_audit_patch.py
          python3 .github/scripts/fix_monthly_status_currency.py
          dart format lib/core/mizan_clock.dart lib/models/mizan_models.dart lib/services/monthly_payment_status_service.dart lib/services/report_service.dart lib/screens/people_screen.dart lib/screens/reports_screen.dart lib/screens/expenses_screen.dart lib/screens/record_form_dialogs.dart lib/screens/dashboard_screen.dart lib/screens/settings_screen.dart lib/controllers/mizan_controller.dart test/visual_capture_test.dart test/monthly_payment_currency_contract_test.dart
          git diff --check

      - name: Verify source localization and monthly currency contracts
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test test/native_audit_formatter_stability_test.dart
          python3 tools/audit_indonesian_native_copy.py
          flutter test test/monthly_payment_currency_contract_test.dart

      - name: Confirm only reviewed stale golden differences remain
        run: |
          set -euo pipefail
          rm -rf test/failures
          set +e
          set -o pipefail
          flutter test test/visual_capture_test.dart 2>&1 | tee /tmp/pre-baseline-visual.log
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Existing goldens unexpectedly already match; refusing blind baseline rewrite.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/pre-baseline-visual.log').read_text(encoding='utf-8', errors='replace')
          actual = set(re.findall(r'^::group::❌ (.*?) \(failed\)$', text, re.MULTILINE))
          expected = {
              'ilk kurulum boş ana sayfa',
              'dolu ana sayfa ve toplamlar',
              'kalan toplam borç detayı',
              'kişi detayları ve ilişkili kayıtlar',
              'giderler ekranı',
              'raporlar ekranı',
              'tablet ana sayfa',
              'ödeme türü seçimi',
          }
          if actual != expected:
              raise SystemExit(f'unreviewed visual failure set: expected={sorted(expected)!r} actual={sorted(actual)!r}')
          if '5 tests passed, 8 failed.' not in text:
              raise SystemExit('visual pass/fail count changed from reviewed 5-pass/8-fail baseline')
          print('Confirmed exact reviewed stale-golden failure set: 8 zero-display baselines only.')
          PY

      - name: Refresh reviewed zero-display goldens and prove deterministic rerun
        run: |
          set -euo pipefail
          flutter test test/visual_capture_test.dart --update-goldens
          flutter test test/visual_capture_test.dart
          git diff --check

      - name: Run complete Flutter regression on final candidate tree
        run: |
          set -euo pipefail
          flutter test
          git diff --check

      - name: Commit verified product correction and remove temporary automation
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-deterministic-visual-contract.yml
          rm -f .github/scripts/apply_deterministic_clock_audit_patch.py
          rm -f .github/scripts/fix_monthly_status_currency.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: stabilize visual clock audits and monthly currency context'
          git fetch origin agent/chinese-localization
          git rebase origin/agent/chinese-localization
          git push origin HEAD:agent/chinese-localization
