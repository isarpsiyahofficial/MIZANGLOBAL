name: Apply legal acceptance integration
on:
  push:
    paths:
      - '.github/workflows/legal-gate-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
      - name: Patch first-run and purchase legal gates
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('lib/main.dart')
          s = main.read_text()
          s = s.replace("import 'global/global_catalog.dart';\n", "import 'global/global_catalog.dart';\nimport 'legal/legal_acceptance_store.dart';\n")
          s = s.replace("import 'screens/global_setup_screen.dart';\n", "import 'screens/global_setup_screen.dart';\nimport 'screens/legal_consent_screen.dart';\n")
          old = "class _MizanHomeState extends State<MizanHome> {\n  int selectedIndex = 0;\n\n  @override\n  Widget build(BuildContext context) => AnimatedBuilder("
          new = "class _MizanHomeState extends State<MizanHome> {\n  int selectedIndex = 0;\n  bool? _legalAccepted;\n\n  @override\n  void initState() {\n    super.initState();\n    _loadLegalAcceptance();\n  }\n\n  Future<void> _loadLegalAcceptance() async {\n    final accepted = await LegalAcceptanceStore.hasAcceptedCurrentLegalBundle();\n    if (!mounted) return;\n    setState(() => _legalAccepted = accepted);\n  }\n\n  @override\n  Widget build(BuildContext context) => AnimatedBuilder("
          if old not in s:
            raise SystemExit('MizanHome state anchor not found')
          s = s.replace(old, new)
          anchor = "      final pages = [\n"
          insert = "      if (_legalAccepted == null) {\n        return const Scaffold(\n          body: Center(child: CircularProgressIndicator()),\n        );\n      }\n      if (_legalAccepted == false) {\n        return LegalConsentScreen(\n          onAccepted: () {\n            if (!mounted) return;\n            setState(() => _legalAccepted = true);\n          },\n        );\n      }\n      final pages = [\n"
          if anchor not in s:
            raise SystemExit('pages anchor not found')
          s = s.replace(anchor, insert, 1)
          main.write_text(s)

          premium = Path('lib/screens/premium_screen.dart')
          p = premium.read_text()
          p = p.replace("import '../legal/legal_documents.dart';\n", "import '../legal/legal_acceptance_store.dart';\nimport '../legal/legal_documents.dart';\n")
          old_buy = "  Future<void> _buy() async {\n    final started = await widget.controller.buyPermanentPremium();\n"
          new_buy = "  Future<void> _buy() async {\n    final accepted = await LegalAcceptanceStore.hasAcceptedCurrentPurchaseTerms();\n    if (!accepted) {\n      if (!mounted) return;\n      final didRead = await Navigator.of(context).push<bool>(\n        MaterialPageRoute<bool>(\n          builder: (_) => const LegalDocumentScreen(\n            type: LegalDocumentType.purchase,\n            requireReadToEnd: true,\n          ),\n        ),\n      );\n      if (didRead != true) return;\n      await LegalAcceptanceStore.acceptCurrentPurchaseTerms();\n    }\n    final started = await widget.controller.buyPermanentPremium();\n"
          if old_buy not in p:
            raise SystemExit('premium buy anchor not found')
          p = p.replace(old_buy, new_buy)
          premium.write_text(p)

          test = Path('test/legal_acceptance_contract_test.dart')
          test.write_text(r'''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';
import 'package:lefferion_prime_mizan/legal/legal_consent_strings.dart';
import 'package:lefferion_prime_mizan/legal/legal_documents.dart';
import 'package:lefferion_prime_mizan/legal/legal_turkish_documents.dart';

void main() {
  const tags = <String>{
    'tr','en','es','pt-BR','pt-PT','fr','de','it','nl','pl','ro','el','ru','uk',
    'ar','fa','he','hi','bn','ur','id','ms','fil','ko','ja','zh','vi','th','sw',
  };

  test('legal consent copy exists independently in all 29 languages', () {
    expect(LegalConsentStrings.supportedTags, tags);
    for (final tag in tags) {
      for (final key in <String>[
        'title','intro','readAll','privacy','terms','purchase','accept','blocked',
        'readDone','masterNotice',
      ]) {
        final value = LegalConsentStrings.text(tag, key).trim();
        expect(value, isNotEmpty, reason: '$tag:$key');
        if (tag != 'en') {
          expect(value, isNot(LegalConsentStrings.text('en', key)), reason: '$tag:$key leaked English fallback');
        }
      }
    }
  });

  test('Turkish and English masters are both full legal documents', () {
    for (final type in LegalDocumentType.values) {
      final tr = LegalTurkishDocuments.forType(type);
      final en = MizanLegalDocuments.document(type, 'en').englishMaster;
      expect(tr.length, greaterThan(1500));
      expect(en.length, greaterThan(1500));
      expect(en.toLowerCase(), contains('english'));
    }
  });

  test('first-run and purchase gates are wired into production source', () {
    final main = File('lib/main.dart').readAsStringSync();
    final premium = File('lib/screens/premium_screen.dart').readAsStringSync();
    final legal = File('lib/screens/legal_document_screen.dart').readAsStringSync();
    expect(main, contains('LegalConsentScreen'));
    expect(main, contains('hasAcceptedCurrentLegalBundle'));
    expect(premium, contains('hasAcceptedCurrentPurchaseTerms'));
    expect(premium, contains('requireReadToEnd: true'));
    expect(legal, contains('LegalTurkishDocuments.forType'));
    expect(legal, contains('position.maxScrollExtent'));
  });
}
''')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/legal-gate-patch.yml
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce read-before-accept legal and purchase gates'
          git push origin HEAD:agent/mizan-monetization-premium
