name: One-shot deep language diagnostic

on:
  push:
    branches:
      - agent/chinese-localization

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Capture Turkish deep-test output
        run: |
          set +e
          flutter pub get
          flutter test --dart-define=MIZAN_TEST_LOCALE=tr test/all_29_language_deep_surface_test.dart 2>&1 | tee /tmp/deep-tr.log
          printf '%s\n' "${PIPESTATUS[0]}" > /tmp/deep-tr-status.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: deep-language-tr-diagnostic
          path: |
            /tmp/deep-tr.log
            /tmp/deep-tr-status.txt
          retention-days: 1
      - name: Remove temporary diagnostic workflow
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-deep-language-diagnostic.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci: remove deep language diagnostic workflow'
          git fetch origin agent/chinese-localization
          git rebase origin/agent/chinese-localization
          git push origin HEAD:agent/chinese-localization
