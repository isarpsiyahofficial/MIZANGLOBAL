name: Publish permanent final APK download

on:
  push:
    branches:
      - agent/mizan-monetization-premium
    paths:
      - .github/workflows/publish-final-apk-release.yml

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  VERIFIED_APPLICATION_BASE: 5ec00bb3919885f958be83beb76e5bd40bab387a

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Lock exact source and unchanged application inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code "${VERIFIED_APPLICATION_BASE}" -- \
            lib android assets pubspec.yaml pubspec.lock
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Recheck release-critical access and monetization contracts
        run: |
          set -euo pipefail
          flutter analyze --fatal-warnings
          flutter test test/monetization_contract_test.dart
          flutter test test/free_online_to_offline_gate_test.dart
          flutter test test/legal_monetization_gate_contract_test.dart
          flutter test test/pdf_access_integration_contract_test.dart
          flutter test test/backup_pro_entitlement_contract_test.dart
      - name: Build exact-source universal release APK
        env:
          MIZAN_ALLOW_TEST_RELEASE: "true"
          MIZAN_TEST_ADS: "true"
        run: |
          set -euo pipefail
          python3 tools/configure_android.py
          dart run flutter_launcher_icons
          flutter build apk --release --dart-define=MIZAN_TEST_ADS=true
          git restore android/app/src/main/res
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          mkdir -p final-release
          short_sha="${GITHUB_SHA:0:7}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "final-release/MIZAN-FINAL-UNIVERSAL-${short_sha}.apk"
          sha256sum final-release/*.apk | tee final-release/SHA256SUMS.txt
      - name: Publish permanent GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="mizan-final-${short_sha}"
          gh release create "${tag}" \
            "final-release/MIZAN-FINAL-UNIVERSAL-${short_sha}.apk" \
            "final-release/SHA256SUMS.txt" \
            --target "${GITHUB_SHA}" \
            --title "MIZAN Final Verified APK ${short_sha}" \
            --notes "Exact-source verified universal Android APK. Internal verification release with Google test ads. Source SHA: ${GITHUB_SHA}."
