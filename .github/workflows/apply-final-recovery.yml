name: Apply final recovery patch

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mizan-final-recovery-patch
  cancel-in-progress: false

jobs:
  repair-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: "3.44.6"

    steps:
      - name: Checkout recovery source branch
        uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Repair final release gate and remove temporary mutation workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/final-branch-ci.yml')
          text = path.read_text()
          if 'dart run flutter_launcher_icons' not in text:
              marker = '      - run: flutter pub get\n'
              idx = text.rfind(marker)
              if idx < 0:
                  raise SystemExit('final audit flutter pub get marker not found')
              insert_at = idx + len(marker)
              launcher = "      - name: Generate launcher icons\n        run: dart run flutter_launcher_icons\n"
              text = text[:insert_at] + launcher + text[insert_at:]
              path.write_text(text)
          PY
          rm -f .github/workflows/apply-final-recovery.yml
          rm -f .github/workflows/one-shot-repair-current-head.yml

      - name: Format all Dart sources
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Verify repaired source and focused release contracts
        run: |
          set -euo pipefail
          git diff --check
          flutter analyze --fatal-warnings
          python3 tools/validate_project.py
          python3 tools/audit_visible_copy_coverage.py
          flutter test test/final_recovery_contract_test.dart
          flutter test test/source_hygiene_contract_test.dart
          flutter test test/monetization_contract_test.dart
          flutter test test/legal_acceptance_contract_test.dart
          flutter test test/legal_monetization_gate_contract_test.dart
          flutter test test/pdf_access_integration_contract_test.dart

      - name: Run full Flutter regression
        run: flutter test

      - name: Commit only verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No repair changes staged'; exit 1; }
          git commit -m 'fix: restore exact-head release verification'
          git push origin HEAD:agent/mizan-monetization-premium
