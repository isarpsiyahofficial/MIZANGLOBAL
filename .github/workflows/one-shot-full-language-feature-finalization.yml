name: One-shot full language feature finalization

on:
  push:
    branches: [agent/mizan-monetization-premium]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply locale-safe runtime and exhaustive contracts
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          def r(path, old, new, count=1):
              p = Path(path); text = p.read_text(); actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path} expected {count} matches, got {actual} for {old!r}')
              p.write_text(text.replace(old, new))

          f='lib/screens/record_form_dialogs.dart'
          r(f, "String? _required(String? value, String label) =>\n    value == null || value.trim().isEmpty ? '$label boş bırakılamaz.' : null;", "String? _required(String? value, String label) =>\n    value == null || value.trim().isEmpty\n    ? MizanI18n.text('$label boş bırakılamaz.')\n    : null;")
          r(f, "return '$label geçersiz.';", "return MizanI18n.text('$label geçersiz.');")
          r(f, 'return error.message;', 'return MizanI18n.text(error.message);')
          r(f, "return 'Aylık ödeme günü 1 ile 31 arasında olmalıdır.';", "return MizanI18n.text('Aylık ödeme günü 1 ile 31 arasında olmalıdır.');")
          r(f, "return 'Gecikme günü 0 ile 3650 arasında olmalıdır.';", "return MizanI18n.text('Gecikme günü 0 ile 3650 arasında olmalıdır.');")
          r(f, "? '1 ile 31 arasında bir gün girin.'", "? MizanI18n.text('1 ile 31 arasında bir gün girin.')", 2)
          r(f, "? 'Toplam taksit sayısını girin.'", "? MizanI18n.text('Toplam taksit sayısını girin.')")
          r(f, "? 'Gün sayısını girin.'", "? MizanI18n.text('Gün sayısını girin.')", 2)
          r(f, "? 'Toplam taksiti girin.'", "? MizanI18n.text('Toplam taksiti girin.')")
          r(f, "return 'Ödeme tutarı kalan borçtan büyük olamaz.';", "return MizanI18n.text('Ödeme tutarı kalan borçtan büyük olamaz.');")

          f='lib/screens/dashboard_screen.dart'
          r(f, "? 'Gelir türü boş bırakılamaz.'", "? MizanI18n.text('Gelir türü boş bırakılamaz.')")
          r(f, "return 'Gelir tutarı sıfırdan büyük olmalıdır.';", "return MizanI18n.text('Gelir tutarı sıfırdan büyük olmalıdır.');")
          r(f, 'return error.message;', 'return MizanI18n.text(error.message);')

          f='lib/screens/expenses_screen.dart'
          r(f, "? 'Kategori adı boş bırakılamaz.'", "? MizanI18n.text('Kategori adı boş bırakılamaz.')")
          r(f, "? 'Gider adı boş bırakılamaz.'", "? MizanI18n.text('Gider adı boş bırakılamaz.')")
          r(f, 'return error.message;', 'return MizanI18n.text(error.message);', 2)
          r(f, "return 'Birim fiyat negatif olamaz.';", "return MizanI18n.text('Birim fiyat negatif olamaz.');")
          r('lib/widgets/record_notes_panel.dart', "? 'Not boş bırakılamaz.'", "? MizanI18n.text('Not boş bırakılamaz.')")

          f='lib/controllers/mizan_controller.dart'
          r(f, "_lastError =\n          '${_friendlyError(error)} Mevcut kayıt dosyaları korunuyor; CSV yedeği geri yüklenmeden yeni kayıt yazılmayacak.';", "_lastError =\n          '${_friendlyError(error)} '\n          '${MizanI18n.text('Yerel kayıt alanı güvenli biçimde açılamadı. Mevcut dosyaları korumak için yeni veri yazımı durduruldu.')}';")
          r(f, "_loadMessage = 'CSV yedeği doğrulandı ve geri yüklendi.';", "_loadMessage = MizanI18n.text('CSV yedeği doğrulandı ve geri yüklendi.');")
          r(f, "    final duplicatePart = duplicateCount > 0\n        ? ', $duplicateCount gerçekten ortak kullanıcı kaydı atlandı'\n        : '';\n    _loadMessage =\n        'CSV yedeği mevcut kayıtlarla birleştirildi: '\n        '$addedCount yeni, $mergedCount ilişki güncellendi$duplicatePart.';", "    final mergeSummary = MizanI18n.text(\n      '$addedCount yeni, $mergedCount ilişki güncellendi.',\n    );\n    final duplicatePart = duplicateCount > 0\n        ? ' ${MizanI18n.text('Ortak kullanıcı kaydı atlanacak')}: $duplicateCount.'\n        : '';\n    _loadMessage =\n        '${MizanI18n.text('CSV yedeği mevcut kayıtlarla birleştirildi: ')}'\n        '$mergeSummary$duplicatePart';")

          f='tools/build_ukrainian_locale.py'
          r(f, 'I18N = LIB / "l10n" / "mizan_i18n.dart"\nUKRAINIAN =', 'I18N = LIB / "l10n" / "mizan_i18n.dart"\nENGLISH_I18N = LIB / "l10n" / "mizan_i18n_legacy.dart"\nUKRAINIAN =')
          r(f, '        I18N.read_text(encoding="utf-8"),\n        "static const Map<String, String> _english",', '        ENGLISH_I18N.read_text(encoding="utf-8"),\n        "static const Map<String, String> _english",')

          f='tools/build_hebrew_locale.py'
          r(f, 'I18N = ROOT / "lib/l10n/mizan_i18n.dart"\nMAIN =', 'I18N = ROOT / "lib/l10n/mizan_i18n.dart"\nLEGACY_I18N = ROOT / "lib/l10n/mizan_i18n_legacy.dart"\nMAIN =')
          r(f, 'FORMATTERS = ROOT / "lib/core/formatters.dart"', 'FORMATTERS = ROOT / "lib/core/formatters_legacy.dart"')
          r(f, '    i18n = I18N.read_text(encoding="utf-8")', '    i18n = (\n        I18N.read_text(encoding="utf-8")\n        + LEGACY_I18N.read_text(encoding="utf-8")\n    )')

          f='tools/build_hindi_locale.py'
          r(f, "I18N = ROOT / 'lib/l10n/mizan_i18n.dart'\nMAIN =", "I18N = ROOT / 'lib/l10n/mizan_i18n.dart'\nLEGACY_I18N = ROOT / 'lib/l10n/mizan_i18n_legacy.dart'\nMAIN =")
          r(f, "FORMATTERS = ROOT / 'lib/core/formatters.dart'", "FORMATTERS = ROOT / 'lib/core/formatters_legacy.dart'")
          r(f, "    runtime = I18N.read_text(encoding='utf-8') + CATALOG_MODEL.read_text(encoding='utf-8')", "    runtime = (\n        I18N.read_text(encoding='utf-8')\n        + LEGACY_I18N.read_text(encoding='utf-8')\n        + CATALOG_MODEL.read_text(encoding='utf-8')\n    )")

          f='test/native_audit_formatter_stability_test.dart'
          r(f, "      'tools/audit_filipino_native_copy.py',\n      'tools/audit_indonesian_native_copy.py',", "      'tools/audit_filipino_native_copy.py',\n      'tools/audit_hebrew_native_copy.py',\n      'tools/audit_hindi_native_copy.py',\n      'tools/audit_indonesian_native_copy.py',")

          f='.github/workflows/final-branch-ci.yml'
          r(f, '      - run: flutter test --dart-define=MIZAN_TEST_LOCALE=${{ matrix.locale }} test/all_29_language_deep_surface_test.dart', '      - name: Deep UI surface contract\n        run: flutter test --dart-define=MIZAN_TEST_LOCALE=${{ matrix.locale }} test/all_29_language_deep_surface_test.dart\n      - name: Full feature mutation and validation contract\n        run: flutter test --dart-define=MIZAN_TEST_LOCALE=${{ matrix.locale }} test/all_29_language_full_feature_contract_test.dart\n      - name: Legal read-to-end acceptance contract\n        run: flutter test --dart-define=MIZAN_TEST_LOCALE=${{ matrix.locale }} test/all_29_language_legal_read_gate_test.dart')
          r(f, '          python tools/audit_filipino_native_copy.py\n          python tools/audit_indonesian_native_copy.py', '          python tools/audit_filipino_native_copy.py\n          python tools/audit_hebrew_native_copy.py\n          python tools/audit_hindi_native_copy.py\n          python tools/audit_indonesian_native_copy.py')
          r(f, '          flutter test test/legal_acceptance_contract_test.dart\n          flutter test test/reward_entitlement_binding_contract_test.dart', '          flutter test test/legal_acceptance_contract_test.dart\n          flutter test test/all_29_language_full_feature_contract_test.dart\n          flutter test test/all_29_language_legal_read_gate_test.dart\n          flutter test test/reward_entitlement_binding_contract_test.dart')
          PYCODE
          echo '' | base64 -d | gzip -d > test/all_29_language_full_feature_contract_test.dart
          echo '' | base64 -d | gzip -d > test/all_29_language_legal_read_gate_test.dart
          dart format lib/screens/record_form_dialogs.dart lib/screens/dashboard_screen.dart lib/screens/expenses_screen.dart lib/widgets/record_notes_panel.dart lib/controllers/mizan_controller.dart test/native_audit_formatter_stability_test.dart test/all_29_language_full_feature_contract_test.dart test/all_29_language_legal_read_gate_test.dart
          python tools/audit_chinese_native_copy.py
          python tools/audit_filipino_native_copy.py
          python tools/audit_hebrew_native_copy.py
          python tools/audit_hindi_native_copy.py
          python tools/audit_indonesian_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_urdu_native_copy.py
          python tools/audit_vietnamese_native_copy.py
          python tools/audit_visible_copy_coverage.py
          python tools/validate_project.py
          rm .github/workflows/one-shot-full-language-feature-finalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(locale): verify every feature across all languages"
          git push origin HEAD:agent/mizan-monetization-premium
