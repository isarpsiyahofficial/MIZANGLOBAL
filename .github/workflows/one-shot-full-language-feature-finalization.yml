name: One-shot full language feature finalization

on:
  push:
    branches: [agent/mizan-monetization-premium]
  pull_request:
    branches: [agent/mizanglobal-globalization]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare verified patch helper
        run: |
          set -euo pipefail
          cp .github/workflows/final-branch-ci.yml /tmp/final-branch-ci.yml
          cp test/native_audit_formatter_stability_test.dart /tmp/native-audit-test.dart
          cp test/all_29_language_legal_read_gate_test.dart /tmp/legal-read-test.dart
          git show 64fd8a7be0b6e1508672656731824bcbe67dd67d:.github/workflows/final-branch-ci.yml > .github/workflows/final-branch-ci.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_full_language_finalization.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('base64.b64decode(', '_decode_padded(')
          marker = "ROOT = Path(__file__).resolve().parents[1]\n"
          helper = "\n\ndef _decode_padded(value: str) -> bytes:\n    return base64.b64decode(value + '=' * (-len(value) % 4))\n"
          if '_decode_padded(value: str)' not in text:
              text = text.replace(marker, marker + helper, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply locale-safe runtime and exhaustive contracts
        run: python3 tools/apply_full_language_finalization.py
      - name: Restore already-verified workflow and harness baselines
        run: |
          cp /tmp/final-branch-ci.yml .github/workflows/final-branch-ci.yml
          cp /tmp/native-audit-test.dart test/native_audit_formatter_stability_test.dart
          cp /tmp/legal-read-test.dart test/all_29_language_legal_read_gate_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/all_29_language_full_feature_contract_test.dart')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '      "? \'$label boş bırakılamaz.\'",',
              '      r"? \'$label boş bırakılamaz.\'",',
          )
          text = text.replace(
              '      "return \'$label geçersiz.\';",',
              '      r"return \'$label geçersiz.\';",',
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Format and resolve
        run: |
          dart format lib test
          flutter pub get
      - name: Static analysis
        run: flutter analyze --fatal-warnings
      - name: Native-copy, coverage and structural audits
        run: |
          set -euo pipefail
          python tools/audit_chinese_native_copy.py
          python tools/audit_filipino_native_copy.py
          python tools/audit_hebrew_native_copy.py
          python tools/audit_hindi_native_copy.py
          python tools/audit_indonesian_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_urdu_native_copy.py
          python tools/audit_vietnamese_native_copy.py
          python tools/audit_visible_copy_coverage.py
          python tools/validate_project.py
      - name: Verify release-critical language contracts
        run: |
          set -euo pipefail
          flutter test test/all_29_language_full_feature_contract_test.dart
          flutter test test/all_29_language_legal_read_gate_test.dart
          flutter test test/native_audit_formatter_stability_test.dart
      - name: Publish non-workflow verified patch
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows/android-release.yml
          git diff --exit-code -- .github/workflows/final-branch-ci.yml
          git diff --exit-code -- .github/workflows/one-shot-full-language-feature-finalization.yml
          rm -f .github/full-language-trigger.txt
          rm -f tools/apply_full_language_finalization.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tools .github/full-language-trigger.txt
          git diff --cached --check
          git commit -m "fix(locale): localize validators and verify all features"
          git push origin HEAD:agent/mizan-monetization-premium
