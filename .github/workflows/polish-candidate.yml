name: Generate Polish localization candidate

on:
  push:
    branches:
      - agent/polish-localization
    paths:
      - .github/workflows/polish-candidate.yml
      - tools/generate_polish_candidate.py
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/polish-candidate.yml
      - tools/generate_polish_candidate.py

permissions:
  contents: write

concurrency:
  group: polish-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Polish localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/polish-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install translation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<5' 'sentencepiece>=0.2,<1' 'sacremoses>=0.1,<1'

      - name: Generate complete Polish candidate
        run: python tools/generate_polish_candidate.py

      - name: Verify candidate cardinality
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          paths = sorted(Path('lib/l10n/pl').glob('mizan_pl_*.dart'))
          count = sum(len(re.findall(r"^  '.*':", p.read_text(encoding='utf-8'), re.M)) for p in paths)
          if count != 791:
              raise SystemExit(f'Expected 791 Polish values, found {count}')
          print(f'Polish candidate cardinality verified: {count}/791')
          PY

      - name: Commit generated candidate
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/l10n/mizan_pl.dart lib/l10n/pl
          if git diff --cached --quiet; then
            echo 'Polish candidate already generated.'
          else
            git commit -m 'feat(pl): generate complete Polish static-copy candidate'
            git push origin HEAD:agent/polish-localization
          fi
