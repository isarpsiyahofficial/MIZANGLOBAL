name: One-shot permanent PRO backup patch

on:
  push:
    branches:
      - agent/mizan-monetization-premium

permissions:
  contents: write

concurrency:
  group: one-shot-permanent-pro-backup
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply permanent-PRO backup patch atomically
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base64 -d tools/backup-pro-final.patch.gz.b64 | gzip -d > /tmp/backup-pro-final.patch
          git apply --index /tmp/backup-pro-final.patch
          rm -f tools/backup-pro-final.patch.gz.b64
          rm -f .github/workflows/one-shot-backup-pro-final.yml
          git add -A
          git diff --cached --check
          python3 tools/validate_project.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "add permanent PRO backup gate and purchase proof"
          git push origin HEAD:agent/mizan-monetization-premium
