          LENS = [119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 119400, 28629]
          EXPECTED = "82113136e2cb59c86b86bdb2df3267fcb89cd474e6ec0a758eafa37a4ca86252"
          out = bytearray()

          for i, (url, n) in enumerate(zip(URLS, LENS)):
              req = urllib.request.Request(url, headers={"User-Agent":"MIZAN-Final-Logo-Restore/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read()
              im = Image.open(BytesIO(data)).convert("RGBA")
              if im.size != (200, 200):
                  raise SystemExit(f"carrier {i:02d} size changed: {im.size}")
              px = list(im.getdata())
              if any(a != 0 for _,_,_,a in px[:200]):
                  raise SystemExit(f"carrier {i:02d} marker row changed")
              if any(a != 255 for _,_,_,a in px[200:]):
                  raise SystemExit(f"carrier {i:02d} payload alpha changed")
              raw = bytearray()
              for r,g,b,_ in px[200:]:
                  raw.extend((r,g,b))
              out.extend(raw[:n])
              print(f"carrier {i:02d} verified")

          if len(out) != 3133029:
              raise SystemExit(f"length mismatch {len(out)}")
          got = sha256(out).hexdigest()
          if got != EXPECTED:
              raise SystemExit(f"final PNG SHA mismatch {got}")
          main = Path("assets/brand/lefferion-prime-logo-v3.png")
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_bytes(out)

          img = Image.open(main).convert("RGBA")
          if img.size != (2048, 2048):
              raise SystemExit(f"main size mismatch {img.size}")
          size = round(2048 * 0.65)
          small = img.resize((size, size), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (2048, 2048), (0,0,0,0))
          canvas.alpha_composite(small, ((2048-size)//2, (2048-size)//2))
          rgba = sha256(canvas.tobytes()).hexdigest()
          if rgba != "5740185e92efc9208a626f94aa049a15ba616e322c7da3742d202869078eab61":
              raise SystemExit(f"foreground RGBA mismatch {rgba}")
          fg = Path("assets/brand/lefferion-prime-logo-v3-foreground.png")
          canvas.save(fg, format="PNG", optimize=True)
          fg_got = sha256(fg.read_bytes()).hexdigest()
          if fg_got != "d72dd2ddbd864a3c637942b245025311e010d151873482d6d3f3049e4785f918":
              raise SystemExit(f"foreground file SHA mismatch {fg_got}")
          print("FINAL MAIN VERIFIED", got)
          print("FINAL FOREGROUND VERIFIED", fg_got)
          PY

      - name: Commit verified logo assets only
        shell: bash
        run: |
          set -euo pipefail
          echo "82113136e2cb59c86b86bdb2df3267fcb89cd474e6ec0a758eafa37a4ca86252  assets/brand/lefferion-prime-logo-v3.png" | sha256sum -c -
          echo "d72dd2ddbd864a3c637942b245025311e010d151873482d6d3f3049e4785f918  assets/brand/lefferion-prime-logo-v3-foreground.png" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/lefferion-prime-logo-v3.png assets/brand/lefferion-prime-logo-v3-foreground.png
          git diff --cached --quiet && exit 0
          git commit -m "fix: sync exact final Lefferion Prime logo assets"
          git push origin HEAD:agent/mizan-final-logo-byte-transfer-20260905
