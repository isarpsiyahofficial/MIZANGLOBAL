name: Apply and verify English localization

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-english-localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout English candidate branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply SHA-verified English localization patch when missing
        run: |
          set -euo pipefail
          if test -f lib/l10n/mizan_i18n.dart; then
            echo "English localization patch is already present."
            exit 0
          fi
          git fetch origin agent/english-localization-transfer
          : > /tmp/english_localization.b64
          for n in 00 01 02 03; do
            git show "origin/agent/english-localization-transfer:transfer/english/v2/english.part${n}" >> /tmp/english_localization.b64
          done
          tr -d '\r\n\t ' < /tmp/english_localization.b64 > /tmp/english_localization.compact.b64
          base64 --decode /tmp/english_localization.compact.b64 > /tmp/english_localization.patch.gz
          echo "6081c7bb86cd4c5c8d49ae32fc33e5e6ccf99529ffe67dff786030233395a684  /tmp/english_localization.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/english_localization.patch.gz > /tmp/english_localization.patch
          echo "d23f526aa61e01cdbb15f3a04c8947f814a144ef850f02c738052b26dee41b6c  /tmp/english_localization.patch" | sha256sum -c -
          git apply --check /tmp/english_localization.patch
          git apply /tmp/english_localization.patch

      - name: Apply deterministic English acceptance fixes
        run: python3 tools/apply_english_acceptance_fixes.py

      - name: Validate English coverage before Flutter checks
        run: python3 tools/validate_english_localization.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Revalidate English coverage after formatting
        run: python3 tools/validate_english_localization.py

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: English UI report PDF notification and backup tests
        run: |
          flutter test --reporter expanded \
            test/english_localization_test.dart \
            test/global_setup_test.dart \
            test/local_store_test.dart \
            test/csv_backup_test.dart \
            test/reminder_engine_test.dart \
            test/report_service_test.dart \
            test/pdf_report_test.dart \
            test/notification_migration_test.dart \
            test/notification_background_reliability_test.dart

      - name: Refresh deterministic visual baselines
        run: flutter test --update-goldens test/visual_capture_test.dart

      - name: Full regression tests
        run: flutter test --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal release APK
        run: |
          mkdir -p build/english-apk-audit/universal
          cp build/app/outputs/flutter-apk/app-release.apk build/english-apk-audit/universal/mizan-global-english-universal.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Generate APK size and hash report
        run: |
          set -euo pipefail
          mkdir -p build/english-apk-audit/split
          cp build/app/outputs/flutter-apk/app-*-release.apk build/english-apk-audit/split/
          {
            echo "Audited source commit: $(git rev-parse HEAD)"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo
            echo "Exact byte sizes:"
            find build/english-apk-audit -type f -name '*.apk' -print0 | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo
            echo "Human-readable sizes:"
            du -h build/english-apk-audit/universal/*.apk build/english-apk-audit/split/*.apk
            echo
            echo "SHA-256:"
            sha256sum build/english-apk-audit/universal/*.apk build/english-apk-audit/split/*.apk
          } | tee build/english-apk-audit/apk-size-report.txt

      - name: Commit verified English localization
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "MIZAN English Localization"
          git config user.email "actions@users.noreply.github.com"
          git add lib test tools pubspec.yaml pubspec.lock
          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi
          git commit -m "feat: verify complete English localization"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload verified English APKs and size report
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-english-release-apks
          path: build/english-apk-audit/
          if-no-files-found: error
          retention-days: 14
