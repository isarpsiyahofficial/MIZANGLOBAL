name: One-shot native audit parser normalization

on:
  push:
    branches:
      - agent/chinese-localization
    paths:
      - .github/workflows/one-shot-native-audit-parser-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
      - name: Normalize audit map parsers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('tools/audit_filipino_native_copy.py'),
              Path('tools/audit_indonesian_native_copy.py'),
              Path('tools/audit_japanese_native_copy.py'),
              Path('tools/audit_korean_native_copy.py'),
              Path('tools/audit_urdu_native_copy.py'),
              Path('tools/audit_vietnamese_native_copy.py'),
          ]
          replacement = "re.compile(r\"'((?:\\\\.|[^'])*)'\\s*:\\s*'((?:\\\\.|[^'])*)'\\s*,?\", re.S)"
          changed = []
          for path in targets:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              out = []
              modified = False
              for line in lines:
                  if 're.compile(' in line and '^\\s*' in line and 're.M' in line:
                      lhs = line.split('=', 1)[0].rstrip()
                      newline = '\n' if line.endswith('\n') else ''
                      out.append(f'{lhs} = {replacement}{newline}')
                      modified = True
                  else:
                      out.append(line)
              new_text = ''.join(out)
              if modified and new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No formatter-sensitive native audit parser was found.')
          print('Normalized:', ', '.join(changed))
          PY
          rm -f .github/workflows/one-shot-native-audit-parser-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools .github/workflows/one-shot-native-audit-parser-normalize.yml
          git diff --cached --check
          git commit -m "fix(audit): make native map parsers formatter-stable"
          git push origin HEAD:agent/chinese-localization
