name: Persian localization native-language audit

on:
  push:
    branches: [agent/persian-localization]
  pull_request:
    branches: [agent/mizanglobal-globalization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persian-localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  integrate-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact Persian head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Persian runtime and pinned offline catalogs
        run: |
          set -euo pipefail
          python -m pip install 'Babel>=2.15,<3'
          python tools/build_persian_locale.py --apply
          python tools/apply_extensible_validator_fixes.py
          python tools/finalize_persian_native_copy.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Format and verify Persian plus every inherited language
        run: |
          set -euo pipefail
          dart format \
            lib/l10n/fa \
            lib/l10n/mizan_fa.dart \
            lib/l10n/mizan_fa_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            lib/main.dart \
            test/persian_localization_test.dart \
            test/persian_end_to_end_test.dart \
            test/persian_responsive_test.dart
          python tools/build_persian_locale.py --verify
          python tools/audit_persian_native_copy.py
          python tools/validate_persian_localization_scope.py
          python tools/build_arabic_locale.py --verify
          python tools/audit_arabic_native_copy.py
          python tools/validate_arabic_localization_scope.py
          python tools/build_ukrainian_locale.py --verify
          python tools/audit_ukrainian_native_copy.py
          python tools/validate_ukrainian_localization_scope.py
          python tools/build_russian_locale.py --verify
          python tools/audit_russian_native_copy.py
          python tools/validate_english_localization.py
          python tools/validate_spanish_localization.py
          python tools/validate_portuguese_br_localization.py
          python tools/validate_spanish_visible_copy.py
          python tools/build_pt_pt_locale.py --verify
          python tools/build_french_locale.py --verify
          python tools/build_german_locale.py --verify
          python tools/build_italian_locale.py --verify
          python tools/build_dutch_locale.py --verify
          python tools/build_polish_locale.py --verify
          python tools/build_romanian_locale.py --verify
          python tools/build_greek_locale.py --verify
          python tools/apply_runtime_reliability_fixes.py
          git diff --check

      - name: Analyze and run Persian plus accepted regressions
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --fatal-warnings --fatal-infos
          for file in \
            test/persian_localization_test.dart \
            test/persian_end_to_end_test.dart \
            test/persian_responsive_test.dart \
            test/arabic_localization_test.dart \
            test/arabic_end_to_end_test.dart \
            test/arabic_responsive_test.dart \
            test/ukrainian_localization_test.dart \
            test/ukrainian_end_to_end_test.dart \
            test/ukrainian_responsive_test.dart \
            test/russian_localization_test.dart \
            test/russian_end_to_end_test.dart \
            test/russian_responsive_test.dart \
            test/global_setup_test.dart \
            test/monthly_payment_status_reference_test.dart \
            test/overdue_calendar_tracking_test.dart \
            test/notification_fallback_scheduling_test.dart \
            test/notification_background_reliability_test.dart \
            test/automatic_notification_sync_test.dart \
            test/reminder_engine_test.dart; do
            timeout 12m flutter test --reporter expanded "$file"
          done
          git diff --check

      - name: Commit exact generated Persian runtime
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if test -n "$(git status --porcelain)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              assets/data/languages_v1.json \
              assets/data/countries_v1.json \
              assets/data/currencies_v1.json \
              lib/global/global_catalog.dart \
              lib/core/formatters.dart \
              lib/l10n/mizan_i18n.dart \
              lib/l10n/mizan_fa.dart \
              lib/l10n/mizan_fa_dynamic.dart \
              lib/l10n/fa \
              lib/main.dart \
              test/persian_localization_test.dart \
              test/persian_end_to_end_test.dart \
              test/persian_responsive_test.dart \
              tools/validate_spanish_localization.py \
              tools/validate_portuguese_br_localization.py
            git commit -m 'l10n: integrate reviewed Persian runtime and catalogs'
            git push origin HEAD:agent/persian-localization
          fi
