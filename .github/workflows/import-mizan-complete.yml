name: Preserve complete MIZAN backup in MIZANGLOBAL

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified transfer package
        run: |
          set -euo pipefail
          git clone --depth 1 --branch mizan-global-export-package https://github.com/isarpsiyahofficial/MIZAN.git transfer

      - name: Verify package checksums and complete Git history
        run: |
          set -euo pipefail
          cd transfer
          sha256sum -c MIZAN-BACKUP-SHA256.txt
          cd ..
          git clone --mirror transfer/MIZAN-MIGRATION-COMPLETE.bundle restored.git
          git -C restored.git fsck --full
          diff -u transfer/MIZAN-MIGRATION-REFS.txt <(git -C restored.git show-ref | sort)

      - name: Preserve raw verified backup package in target repository
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          SOURCE_PACKAGE_SHA="$(git -C transfer rev-parse HEAD)"
          git -C transfer remote remove origin || true
          git -C transfer remote add target "$TARGET_URL"
          git -C transfer push --force target HEAD:refs/heads/mizan-complete-backup-package
          TARGET_PACKAGE_SHA="$(git ls-remote "$TARGET_URL" refs/heads/mizan-complete-backup-package | awk 'NR==1 {print $1}')"
          test "$SOURCE_PACKAGE_SHA" = "$TARGET_PACKAGE_SHA"
          printf 'backup_package_commit=%s\n' "$TARGET_PACKAGE_SHA" > MIZANGLOBAL-BACKUP-PRESERVATION.txt

      - name: Write verification report
        run: |
          set -euo pipefail
          cat transfer/MIZAN-BACKUP-SUMMARY.txt >> MIZANGLOBAL-BACKUP-PRESERVATION.txt
          printf 'verified_ref_count=' >> MIZANGLOBAL-BACKUP-PRESERVATION.txt
          wc -l < transfer/MIZAN-MIGRATION-REFS.txt >> MIZANGLOBAL-BACKUP-PRESERVATION.txt
          printf 'bundle_sha256=' >> MIZANGLOBAL-BACKUP-PRESERVATION.txt
          sha256sum transfer/MIZAN-MIGRATION-COMPLETE.bundle | awk '{print $1}' >> MIZANGLOBAL-BACKUP-PRESERVATION.txt
          cat MIZANGLOBAL-BACKUP-PRESERVATION.txt

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: mizanglobal-backup-preservation-verification
          path: |
            MIZANGLOBAL-BACKUP-PRESERVATION.txt
            transfer/MIZAN-BACKUP-SHA256.txt
            transfer/MIZAN-MIGRATION-REFS.txt
            transfer/MIZAN-MAIN-FILES-SHA256.txt
          if-no-files-found: error
          retention-days: 30
