name: Apply reviewed Polish product copy

on:
  push:
    branches:
      - agent/polish-localization
    paths:
      - .github/workflows/apply-polish-manual-review.yml
      - tools/apply_polish_manual_review.py
      - tools/polish_finalizer_parts/**
      - tools/polish_native_terms.json
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/apply-polish-manual-review.yml
      - tools/apply_polish_manual_review.py
      - tools/polish_finalizer_parts/**
      - tools/polish_native_terms.json

permissions:
  contents: write

concurrency:
  group: apply-polish-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Polish localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/polish-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic catalog dependency
        run: python -m pip install 'Babel>=2.15,<3'

      - name: Apply native Polish review and integration
        run: python tools/apply_polish_manual_review.py

      - name: Remove temporary transport sources
        run: |
          rm -rf tools/polish_finalizer_parts
          rm -rf tools/polish_final_payload
          rm -rf tools/polish_final_payload_v2
          rm -f tools/apply_polish_manual_review.py

      - name: Commit reviewed Polish product sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Reviewed Polish product sources are already committed.'
          else
            git commit -m 'feat(pl): integrate reviewed Polish product locale'
            git pull --rebase origin agent/polish-localization
            git push origin HEAD:agent/polish-localization
          fi
