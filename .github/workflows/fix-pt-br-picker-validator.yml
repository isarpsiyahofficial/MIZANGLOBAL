name: Fix pt-BR picker validator

on:
  push:
    branches:
      - agent/polish-localization
    paths:
      - .github/workflows/fix-pt-br-picker-validator.yml
      - tools/fix_pt_br_picker_validator.py
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/fix-pt-br-picker-validator.yml
      - tools/fix_pt_br_picker_validator.py

permissions:
  contents: write

concurrency:
  group: fix-pt-br-picker-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Polish localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/polish-localization
          fetch-depth: 0

      - name: Update legacy pt-BR validator
        run: python tools/fix_pt_br_picker_validator.py

      - name: Commit corrected validator
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_portuguese_br_localization.py
          if git diff --cached --quiet; then
            echo 'pt-BR validator is already exact-ISO aware.'
          else
            git commit -m 'fix(validation): accept exact-ISO currency search'
            git pull --rebase origin agent/polish-localization
            git push origin HEAD:agent/polish-localization
          fi
