name: Greek reviewed source bootstrap

on:
  push:
    branches:
      - agent/greek-localization
    paths:
      - .github/workflows/greek-source-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greek-source-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out stabilized Greek branch
        uses: actions/checkout@v4
        with:
          ref: agent/greek-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and assemble locked reviewed source package
        run: |
          set -euo pipefail
          cat > /tmp/greek-transport.sha256 <<'HASHES'
          d4419dc41475607c9f56ce01c43931bf660d1a7ba7a41b5cce68e534ed575a60  tools/greek_min_payload/part.00.b64
          3d7bdb6fe5871d305894d7cf2124eb81c573fdfaa94af3136800e7f6a7f01830  tools/greek_min_payload/part.02.b64
          5fb288841a37a564650b257df7221503ee126466cea3ae7f3a72924976fc8eef  tools/greek_min_payload/part.04.b64
          fbc4243dc10402b984e5b32dfe1708ec4ca07c52ecad6fda95daa3fb88ae531d  tools/greek_min_payload/part.05.b64
          894ea8eb37ae77ed03841d0f6797a7a29e29ef5199098bc712606143863baf4a  tools/greek_min_fix/part.01.0.b64
          b7f8d7cf0227de6854c520b46b93db09542e0d3ff7bfe0fb87014e0e36198fd0  tools/greek_min_fix/part.01.1.b64
          8abae9d7cef9442ca899441bdc16ef6bc3568139f29ec17cd815e71ea2ac9adc  tools/greek_min_fix/part.01.2.b64
          f8acf4a44300b0b787f370d1a0eb7c0026009c44cdfa3e676b28af34b1edb49c  tools/greek_min_fix/part.01.3.b64
          HASHES
          sha256sum -c /tmp/greek-transport.sha256
          cat tools/greek_min_fix/part.01.*.b64 > /tmp/greek-part01.b64
          echo 'c7f5210c190882cf0e30b66e85ba0d808c8678f9107ae28d33584166103ec3f0  /tmp/greek-part01.b64' | sha256sum -c -
          head -c 12000 tools/greek_min_payload/part.03.b64 > /tmp/greek-part03.b64
          echo '29a5ed158fd9fe0939e87bcd11998cfec0a87789870578709159c6d7489d924c  /tmp/greek-part03.b64' | sha256sum -c -
          cat \
            tools/greek_min_payload/part.00.b64 \
            /tmp/greek-part01.b64 \
            tools/greek_min_payload/part.02.b64 \
            /tmp/greek-part03.b64 \
            tools/greek_min_payload/part.04.b64 \
            tools/greek_min_payload/part.05.b64 \
            | base64 --decode > /tmp/greek-reviewed-source.tar.xz
          echo '7056af053ff6e14bd6bdab962017102383e81fab41f655354bff5fd0d63cfa10  /tmp/greek-reviewed-source.tar.xz' | sha256sum -c -
          xz -t /tmp/greek-reviewed-source.tar.xz
          tar -xJf /tmp/greek-reviewed-source.tar.xz

      - name: Lock review independently of mutable machine wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_greek_review.py')
          source = path.read_text(encoding='utf-8')
          old = (
              "    digest=hashlib.sha256(json.dumps(candidate,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()\n"
              "    already_reviewed=all(v.get('candidate')!=candidate.get(k) or v.get('final')==candidate.get(k) for k,v in review.items()) and digest != LOCKED_CANDIDATE_SHA\n"
              "    if digest != LOCKED_CANDIDATE_SHA and not all(candidate.get(k)==v.get('final') for k,v in review.items()):\n"
              "        raise SystemExit(f'Greek candidate SHA mismatch: {digest}')\n"
          )
          new = (
              "    locked_candidate={key:item.get('candidate') for key,item in review.items()}\n"
              "    digest=hashlib.sha256(json.dumps(locked_candidate,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()\n"
              "    if digest != LOCKED_CANDIDATE_SHA:\n"
              "        raise SystemExit(f'Locked Greek review candidate SHA mismatch: {digest}')\n"
          )
          if old not in source:
              raise SystemExit('Locked Greek review patch target missing')
          source = source.replace(old, new, 1)
          source = source.replace(
              "    if len(review)!=791 or set(review)!=set(english):\n",
              "    if len(review)!=791 or set(review)!=set(english) or set(candidate)!=set(review):\n",
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile tools/apply_greek_review.py tools/build_greek_locale.py tools/audit_greek_native_copy.py

      - name: Install deterministic catalog dependency
        run: python -m pip install 'Babel>=2.15,<3'

      - name: Apply build and audit reviewed Greek locale
        run: |
          python tools/apply_greek_review.py
          python tools/build_greek_locale.py
          python tools/build_greek_locale.py --verify
          python tools/audit_greek_native_copy.py

      - name: Validate every previously integrated language
        run: |
          python tools/validate_english_localization.py
          python tools/validate_spanish_localization.py
          python tools/validate_portuguese_br_localization.py
          python tools/validate_spanish_visible_copy.py
          python tools/build_pt_pt_locale.py --verify
          python tools/build_french_locale.py --verify
          python tools/build_german_locale.py --verify
          python tools/build_italian_locale.py --verify
          python tools/build_dutch_locale.py --verify
          python tools/build_polish_locale.py --verify
          python tools/build_romanian_locale.py --verify

      - name: Remove temporary candidate and transport data
        run: |
          rm -rf tools/greek_min_payload tools/greek_min_fix
          rm -f \
            tools/generate_greek_candidate.py \
            tools/greek_candidate_manifest.json \
            tools/greek_hash_diagnostic.txt

      - name: Commit reviewed Greek product source atomically
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(el): integrate reviewed Greek product source'
          git push origin HEAD:agent/greek-localization
