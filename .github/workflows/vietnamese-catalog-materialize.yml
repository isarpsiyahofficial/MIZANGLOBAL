name: Vietnamese deterministic catalog materialization

on:
  push:
    branches: [agent/chinese-localization]

permissions:
  contents: write

concurrency:
  group: vietnamese-catalog-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate CLDR Vietnamese catalog independently
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Babel==2.17.0'
          python tools/materialize_vietnamese_catalog.py
          test -s lib/l10n/vi/mizan_vi_catalog.dart
          test "$(grep -c "^  '" lib/l10n/vi/mizan_vi_catalog.dart)" -eq 344
          grep -q 'vietnameseLanguageNames' lib/l10n/vi/mizan_vi_catalog.dart
          grep -q 'vietnameseCountryNames' lib/l10n/vi/mizan_vi_catalog.dart
          grep -q 'vietnameseCurrencyNames' lib/l10n/vi/mizan_vi_catalog.dart
      - name: Commit static catalog and self-clean materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize_vietnamese_catalog.py
          rm -f .github/workflows/vietnamese-catalog-materialize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(vi): materialize offline Vietnamese global catalog'
          git push origin HEAD:agent/chinese-localization
