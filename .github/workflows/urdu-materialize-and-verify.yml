name: Urdu materialization diagnostic

on:
  push:
    branches: [agent/urdu-localization]
    paths:
      - 'tools/bootstrap_urdu_locale.py'
      - '.github/workflows/urdu-materialize-and-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urdu-materialize-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Urdu branch
        uses: actions/checkout@v4
        with:
          ref: agent/urdu-localization
          fetch-depth: 0
          persist-credentials: true

      - name: Capture deterministic materializer result
        shell: bash
        run: |
          set +e
          python3 tools/bootstrap_urdu_locale.py > /tmp/urdu-materializer.log 2>&1
          status=$?
          {
            printf 'exit_code=%s\n' "$status"
            printf '%s\n' '--- output tail ---'
            tail -c 20000 /tmp/urdu-materializer.log
          } > .github/urdu-materialization-diagnostic.txt
          git clean -fd --exclude=.github/urdu-materialization-diagnostic.txt
          git reset --hard HEAD
          cp /tmp/urdu-materializer.log /tmp/urdu-materializer-full.log
          {
            printf 'exit_code=%s\n' "$status"
            printf '%s\n' '--- output tail ---'
            tail -c 20000 /tmp/urdu-materializer-full.log
          } > .github/urdu-materialization-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/urdu-materialization-diagnostic.txt
          git commit -m 'ci: capture Urdu materializer failure' || exit 0
          git pull --rebase origin agent/urdu-localization
          git push origin HEAD:agent/urdu-localization
