name: Format language hardening contracts

on:
  push:
    branches:
      - agent/mizan-monetization-premium

permissions:
  contents: write

concurrency:
  group: format-language-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Format touched Dart sources
        run: |
          set -euo pipefail
          dart format \
            lib/main.dart \
            lib/services/local_store.dart \
            test/all_29_language_runtime_recovery_contract_test.dart \
            test/all_29_language_legal_resilience_test.dart
      - name: Commit formatter output if needed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/main.dart \
            lib/services/local_store.dart \
            test/all_29_language_runtime_recovery_contract_test.dart \
            test/all_29_language_legal_resilience_test.dart
          git diff --cached --check
          git commit -m "style: format language hardening contracts"
          git push origin HEAD:agent/mizan-monetization-premium
