name: Update secure PDF validator

on:
  push:
    branches:
      - agent/mizan-monetization-premium
    paths:
      - .github/workflows/update-pdf-validator.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
      - name: Update PDF structural validation
        run: python tools/update_pdf_validator.py
      - name: Verify validator and commit
        run: |
          python tools/validate_project.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Validate secure PDF PRO lock and unlock flow"
          git push origin HEAD:agent/mizan-monetization-premium
