name: Chinese clean final source verification
on:
  push:
    branches: [agent/chinese-localization]
permissions:
  contents: write
concurrency:
  group: chinese-clean-final
  cancel-in-progress: true
jobs:
  clean-test-release:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - id: guard
        shell: bash
        run: |
          if [ -f tools/materialize_chinese_runtime.py ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Chinese runtime has not been materialized yet; cleanup gate is intentionally idle."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ready == 'true'
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.ready == 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.ready == 'true'
        with: {channel: stable, cache: true}
      - name: Remove historical orchestration and create clean final SHA
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/filipino-final-gates.yml
          rm -f .github/workflows/korean-final-gates.yml
          rm -f .github/workflows/japanese-final-gates.yml
          rm -f .github/workflows/chinese-clean-final-verification.yml
          rm -f docs/localization/filipino-final-head-marker*.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(global): remove completed language orchestration"
            git push origin HEAD:agent/chinese-localization
          fi
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install and verify clean source
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python tools/audit_chinese_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_filipino_native_copy.py
          dart format --output=none lib test
          git diff --check
          flutter analyze
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
      - name: Every test file in isolation
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            echo "===== $f ====="
            flutter test "$f"
          done < <(find test -type f -name '*_test.dart' | sort)
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Build four APKs from clean exact SHA
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p release/cjk-clean-final
          cp build/app/outputs/flutter-apk/app-release.apk release/cjk-clean-final/mizan-global-cjk-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/cjk-clean-final/mizan-global-cjk-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/cjk-clean-final/mizan-global-cjk-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/cjk-clean-final/mizan-global-cjk-x86_64.apk
          printf '%s\n' "$FINAL_SHA" > release/cjk-clean-final/SOURCE_SHA.txt
          (cd release/cjk-clean-final && sha256sum *.apk | sort > SHA256SUMS.txt && wc -c *.apk | sort -n > BYTE_SIZES.txt)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.ready == 'true'
        with: {name: mizan-global-cjk-clean-final-apks, path: release/cjk-clean-final, if-no-files-found: error, retention-days: 90}
