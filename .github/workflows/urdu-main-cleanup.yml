name: Remove temporary Urdu workflows from main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/urdu-main-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Remove temporary orchestration
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/urdu-materializer-dispatch.yml \
            .github/workflows/urdu-materializer-fast.yml \
            .github/workflows/urdu-main-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary Urdu workflows from main'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
