name: Chinese materialize and final acceptance gates
on:
  pull_request:
    branches: [agent/japanese-localization]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chinese-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  materialize-test-release:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - name: Materialize Chinese runtime and remove temporary orchestration
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_chinese_runtime.py
          python tools/finalize_chinese_cny.py
          dart format lib test
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(zh): materialize final Chinese runtime and clean orchestration"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
      - name: Native-copy and static analysis gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_chinese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_filipino_native_copy.py
          dart format --output=none lib test
          git diff --check
          flutter analyze
      - name: CJK, reports, notifications and global isolation gate
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            test/chinese_localization_test.dart \
            test/chinese_end_to_end_test.dart \
            test/chinese_responsive_test.dart \
            test/japanese_localization_test.dart \
            test/japanese_end_to_end_test.dart \
            test/japanese_responsive_test.dart \
            test/korean_localization_test.dart \
            test/korean_end_to_end_test.dart \
            test/korean_responsive_test.dart \
            test/cjk_runtime_isolation_test.dart \
            test/cjk_three_way_isolation_test.dart \
            test/cjk_isolation_contract_test.dart \
            test/all_language_isolation_test.dart \
            test/global_setup_test.dart \
            test/overdue_regression_test.dart \
            test/background_notification_regression_test.dart; do
              flutter test "$f"
          done
          while IFS= read -r f; do flutter test "$f"; done < <(find test -maxdepth 1 -type f -iname '*pdf*test.dart' | sort)
      - name: Full isolated regression gate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            echo "===== $f ====="
            flutter test "$f"
          done < <(find test -type f -name '*_test.dart' | sort)
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Build exact-source release APKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p release/chinese-final
          cp build/app/outputs/flutter-apk/app-release.apk release/chinese-final/mizan-global-chinese-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/chinese-final/mizan-global-chinese-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/chinese-final/mizan-global-chinese-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/chinese-final/mizan-global-chinese-x86_64.apk
          printf '%s\n' "$TESTED_SHA" > release/chinese-final/SOURCE_SHA.txt
          (cd release/chinese-final && sha256sum *.apk | sort > SHA256SUMS.txt && wc -c *.apk | sort -n > BYTE_SIZES.txt)
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        with:
          name: mizan-global-chinese-final-apks
          path: release/chinese-final
          if-no-files-found: error
          retention-days: 90
