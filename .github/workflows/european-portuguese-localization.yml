name: European Portuguese localization native-language audit

on:
  push:
    branches:
      - agent/european-portuguese-localization
    paths:
      - .github/workflows/european-portuguese-localization.yml
      - tools/build_pt_pt_locale.py
      - tools/patch_pt_pt_builder.py
      - tools/patch_pt_pt_validators.py
      - lib/l10n/mizan_pt_br.dart
      - lib/l10n/mizan_pt_br_dynamic.dart
      - assets/data/languages_v1.json
      - assets/data/countries_v1.json
      - assets/data/currencies_v1.json
  pull_request:
    branches:
      - agent/mizanglobal-globalization

permissions:
  contents: write

concurrency:
  group: european-portuguese-localization-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  build-audit-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out European Portuguese branch
        uses: actions/checkout@v4
        with:
          ref: agent/european-portuguese-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic catalog dependency
        run: python -m pip install 'Babel>=2.15,<3'

      - name: Patch fixed names missing from CLDR
        run: python tools/patch_pt_pt_builder.py

      - name: Build reviewed European Portuguese source
        run: python tools/build_pt_pt_locale.py

      - name: Patch legacy multilingual validators
        run: python tools/patch_pt_pt_validators.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format generated and integrated sources
        run: |
          dart format \
            lib/l10n/mizan_pt_pt.dart \
            lib/l10n/mizan_pt_pt_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/main.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            test/english_localization_test.dart \
            test/spanish_localization_test.dart \
            test/portuguese_br_localization_test.dart \
            test/portuguese_pt_localization_test.dart

      - name: Verify European Portuguese source after formatting
        run: python tools/build_pt_pt_locale.py --verify

      - name: Validate existing languages remain intact
        run: |
          python tools/validate_english_localization.py
          python tools/validate_spanish_localization.py
          python tools/validate_portuguese_br_localization.py
          python tools/validate_spanish_visible_copy.py

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Targeted localization and data-protection tests
        run: |
          flutter test --reporter expanded \
            test/language_restart_test.dart \
            test/portuguese_pt_localization_test.dart \
            test/portuguese_br_picker_purity_test.dart \
            test/portuguese_br_localization_test.dart \
            test/spanish_picker_purity_test.dart \
            test/spanish_localization_test.dart \
            test/english_localization_test.dart \
            test/global_setup_test.dart \
            test/local_store_test.dart \
            test/csv_backup_test.dart \
            test/reminder_engine_test.dart \
            test/report_service_test.dart \
            test/pdf_report_test.dart \
            test/notification_migration_test.dart \
            test/notification_background_reliability_test.dart

      - name: Visual regression with clean rerender on raster-only flake
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf test/failures test/output
            if flutter test test/visual_capture_test.dart; then
              exit 0
            fi
            echo "Golden capture attempt ${attempt} failed; rerendering with unchanged baselines."
          done
          exit 1

      - name: Full regression suite
        run: flutter test --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal release APK
        run: |
          mkdir -p build/portuguese-pt-apk-audit/universal
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/portuguese-pt-apk-audit/universal/mizan-global-portuguese-pt-universal.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Generate APK size and hash report
        run: |
          set -euo pipefail
          mkdir -p build/portuguese-pt-apk-audit/split
          cp build/app/outputs/flutter-apk/app-*-release.apk \
            build/portuguese-pt-apk-audit/split/
          {
            echo "Audited source commit: $(git rev-parse HEAD)"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo
            echo "Exact byte sizes:"
            find build/portuguese-pt-apk-audit -type f -name '*.apk' -print0 \
              | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo
            echo "SHA-256:"
            sha256sum build/portuguese-pt-apk-audit/universal/*.apk \
              build/portuguese-pt-apk-audit/split/*.apk
          } | tee build/portuguese-pt-apk-audit/apk-size-report.txt

      - name: Commit deterministic product sources
        run: |
          if git diff --quiet; then
            echo 'European Portuguese product source is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              tools/build_pt_pt_locale.py \
              assets/data/languages_v1.json \
              assets/data/countries_v1.json \
              assets/data/currencies_v1.json \
              lib/l10n/mizan_pt_pt.dart \
              lib/l10n/mizan_pt_pt_dynamic.dart \
              lib/l10n/mizan_i18n.dart \
              lib/main.dart \
              lib/global/global_catalog.dart \
              lib/core/formatters.dart \
              test/english_localization_test.dart \
              test/spanish_localization_test.dart \
              test/portuguese_br_localization_test.dart \
              test/portuguese_pt_localization_test.dart \
              tools/validate_english_localization.py \
              tools/validate_spanish_localization.py \
              tools/validate_portuguese_br_localization.py
            git commit -m 'l10n: integrate reviewed European Portuguese locale'
            git push origin HEAD:agent/european-portuguese-localization
          fi

      - name: Verify committed scope stayed clean
        run: |
          git restore test/output || true
          git clean -f test/output
          git diff --exit-code

      - name: Upload verified European Portuguese APKs
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-portuguese-pt-release-apks
          path: build/portuguese-pt-apk-audit/
          if-no-files-found: error
          retention-days: 14
