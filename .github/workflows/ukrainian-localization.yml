name: Ukrainian localization native-language audit

on:
  push:
    branches: [agent/ukrainian-localization]
  pull_request:
    branches: [agent/mizanglobal-globalization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ukrainian-localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  integrate-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Ukrainian branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locale tooling
        run: python -m pip install 'Babel>=2.15,<3'

      - name: Integrate or verify reviewed Ukrainian product source
        run: |
          set -euo pipefail
          if grep -q "static bool get isUkrainian" lib/l10n/mizan_i18n.dart; then
            python tools/build_ukrainian_locale.py --verify
          else
            python tools/build_ukrainian_locale.py
          fi
          python tools/prepare_ukrainian_runtime_verifier.py
          python tools/prepare_ukrainian_dart_sources.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Format integrated Ukrainian source
        run: |
          dart format \
            lib/l10n/mizan_i18n.dart \
            lib/l10n/mizan_uk.dart \
            lib/l10n/mizan_uk_dynamic.dart \
            lib/l10n/uk \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            lib/main.dart \
            test/ukrainian_localization_test.dart \
            test/ukrainian_end_to_end_test.dart \
            test/ukrainian_responsive_test.dart

      - name: Verify Ukrainian and every integrated language
        run: |
          set -euo pipefail
          python tools/build_ukrainian_locale.py --verify
          python tools/audit_ukrainian_native_copy.py
          python tools/validate_ukrainian_localization_scope.py
          python tools/build_russian_locale.py --verify
          python tools/audit_russian_native_copy.py
          python tools/validate_english_localization.py
          python tools/validate_spanish_localization.py
          python tools/validate_portuguese_br_localization.py
          python tools/validate_spanish_visible_copy.py
          python tools/build_pt_pt_locale.py --verify
          python tools/build_french_locale.py --verify
          python tools/build_german_locale.py --verify
          python tools/build_italian_locale.py --verify
          python tools/build_dutch_locale.py --verify
          python tools/build_polish_locale.py --verify
          python tools/build_romanian_locale.py --verify
          python tools/build_greek_locale.py --verify
          python tools/apply_runtime_reliability_fixes.py

      - name: Analyze product and protect every language
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --fatal-warnings --fatal-infos
          for file in \
            test/ukrainian_localization_test.dart \
            test/ukrainian_end_to_end_test.dart \
            test/ukrainian_responsive_test.dart \
            test/russian_localization_test.dart \
            test/russian_end_to_end_test.dart \
            test/russian_responsive_test.dart \
            test/monthly_payment_status_reference_test.dart \
            test/overdue_calendar_tracking_test.dart \
            test/notification_fallback_scheduling_test.dart \
            test/notification_background_reliability_test.dart \
            test/automatic_notification_sync_test.dart; do
            timeout 12m flutter test --reporter expanded "$file"
          done
          git diff --check

      - name: Persist deterministic Ukrainian integration
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/ukrainian-localization'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'l10n: integrate reviewed Ukrainian runtime'
            git push origin HEAD:agent/ukrainian-localization
          fi
          test -z "$(git status --porcelain)"
