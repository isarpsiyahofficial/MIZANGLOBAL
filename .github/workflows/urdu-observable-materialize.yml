name: Urdu observable source materialization

on:
  pull_request:
    branches: [agent/mizanglobal-globalization]
    paths:
      - '.github/urdu-clean-payload/**'
      - '.github/workflows/urdu-clean-materialize.yml'
      - '.github/workflows/urdu-clean-recovery.yml'
      - '.github/workflows/urdu-finalize-controller.yml'
      - '.github/workflows/urdu-final-repair.yml'
      - '.github/workflows/urdu-materialization-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urdu-observable-materialization
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/urdu-localization-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/urdu-localization-clean
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic package and extract real source
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/urdu-clean-payload
          cat .github/urdu-clean-payload/part-*.b64 | base64 --decode > "$RUNNER_TEMP/urdu_changes.tar.gz"
          actual_sha="$(sha256sum "$RUNNER_TEMP/urdu_changes.tar.gz" | awk '{print $1}')"
          test "$actual_sha" = '3a1c06e942a9967f4afa331fc1005ee847809dcd09471cd2e3a4b83ccc8b6c6e'
          tar -xzf "$RUNNER_TEMP/urdu_changes.tar.gz" -C .
          test -f lib/l10n/mizan_ur.dart
          test -f lib/l10n/mizan_ur_dynamic.dart
          python tools/audit_urdu_native_copy.py
          rm -rf .github/urdu-clean-payload
          rm -f \
            .github/workflows/urdu-clean-materialize.yml \
            .github/workflows/urdu-clean-recovery.yml \
            .github/workflows/urdu-finalize-controller.yml \
            .github/workflows/urdu-final-repair.yml \
            .github/workflows/urdu-materialization-trigger.yml
          git diff --check
      - name: Commit exact Urdu product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ur): materialize verified Urdu localization'
          git pull --rebase origin agent/urdu-localization-clean
          git push origin HEAD:agent/urdu-localization-clean
