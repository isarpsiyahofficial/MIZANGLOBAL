name: Cleanup Romanian transfer helpers

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/cleanup-romanian-transfer.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Romanian branch
        uses: actions/checkout@v4
        with:
          ref: agent/romanian-localization
          fetch-depth: 0

      - name: Remove transfer-only helpers
        run: |
          set -euo pipefail
          rm -f tools/apply_romanian_integration_bundle.py
          rm -f tools/install_romanian_bundle_parts.py
          rm -rf tools/romanian_bundle

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tools/apply_romanian_integration_bundle.py \
            tools/install_romanian_bundle_parts.py tools/romanian_bundle
          if git diff --cached --quiet; then
            echo 'Romanian transfer helpers already removed.'
          else
            git commit -m 'chore(ro): remove transfer-only integration helpers'
            git pull --rebase origin agent/romanian-localization
            git push origin HEAD:agent/romanian-localization
          fi
