name: Spanish localization native-language audit

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spanish-localization-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  generate-pt-br-review-data:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/brazilian-portuguese-localization' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Brazilian Portuguese candidate
        uses: actions/checkout@v5
        with:
          ref: agent/brazilian-portuguese-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pt-br-opus-mt-es-pt-v1

      - name: Install deterministic generators
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'Babel>=2.15,<3' 'transformers>=4.44,<5' sentencepiece sacremoses

      - name: Generate fixed Portuguese catalog names
        run: python tools/generate_pt_br_catalog.py

      - name: Generate 791-entry Portuguese review draft
        run: python tools/generate_pt_br_localization_draft.py

      - name: Set up Dart formatter
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Format generated Dart source
        run: dart format lib/l10n/mizan_pt_br.dart

      - name: Verify generated scope before commit
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path('lib/l10n/mizan_pt_br.dart').read_text(encoding='utf-8')
          entries = re.findall(r"^  '(?:\\.|[^'])*': '(?:\\.|[^'])*',$", source, re.MULTILINE)
          if len(entries) != 791:
              raise SystemExit(f'Expected 791 generated entries, found {len(entries)}')

          expected = {
              'assets/data/languages_v1.json': 29,
              'assets/data/countries_v1.json': 161,
              'assets/data/currencies_v1.json': 154,
          }
          for filename, count in expected.items():
              payload = json.loads(Path(filename).read_text(encoding='utf-8'))
              items = payload['items']
              if payload['count'] != count or len(items) != count:
                  raise SystemExit(f'Unexpected item count in {filename}')
              missing = [item.get('code') for item in items if not str(item.get('namePtBr', '')).strip()]
              if missing:
                  raise SystemExit(f'Missing namePtBr in {filename}: {missing}')
          print('pt-BR review generation scope verified')
          PY

      - name: Commit generated review data
        run: |
          if git diff --quiet -- lib/l10n/mizan_pt_br.dart assets/data/languages_v1.json assets/data/countries_v1.json assets/data/currencies_v1.json; then
            echo 'Generated review data is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/l10n/mizan_pt_br.dart assets/data/languages_v1.json assets/data/countries_v1.json assets/data/currencies_v1.json
          git commit -m 'build: generated pt-BR review data'
          git push origin HEAD:agent/brazilian-portuguese-localization

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Spanish candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Validate Spanish coverage key parity and visible-copy purity
        run: |
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py
          python3 tools/validate_spanish_visible_copy.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting is clean
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test
          git diff --check

      - name: Revalidate localization after formatter gate
        run: |
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py
          python3 tools/validate_spanish_visible_copy.py

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Spanish restart picker UI report PDF notification backup and catalog tests
        run: |
          flutter test --reporter expanded \
            test/language_restart_test.dart \
            test/spanish_picker_purity_test.dart \
            test/spanish_localization_test.dart \
            test/english_localization_test.dart \
            test/global_setup_test.dart \
            test/local_store_test.dart \
            test/csv_backup_test.dart \
            test/reminder_engine_test.dart \
            test/report_service_test.dart \
            test/pdf_report_test.dart \
            test/notification_migration_test.dart \
            test/notification_background_reliability_test.dart

      - name: Compare deterministic visual baselines
        run: flutter test test/visual_capture_test.dart

      - name: Full regression tests
        run: flutter test --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal release APK
        run: |
          mkdir -p build/spanish-apk-audit/universal
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/spanish-apk-audit/universal/mizan-global-spanish-universal.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Generate APK size and hash report
        run: |
          set -euo pipefail
          mkdir -p build/spanish-apk-audit/split
          cp build/app/outputs/flutter-apk/app-*-release.apk \
            build/spanish-apk-audit/split/
          {
            echo "Audited source commit: $(git rev-parse HEAD)"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo
            echo "Exact byte sizes:"
            find build/spanish-apk-audit -type f -name '*.apk' -print0 \
              | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo
            echo "Human-readable sizes:"
            du -h build/spanish-apk-audit/universal/*.apk \
              build/spanish-apk-audit/split/*.apk
            echo
            echo "SHA-256:"
            sha256sum build/spanish-apk-audit/universal/*.apk \
              build/spanish-apk-audit/split/*.apk
          } | tee build/spanish-apk-audit/apk-size-report.txt

      - name: Verify workflow stayed read-only
        run: |
          set -euo pipefail
          git restore test/output || true
          git clean -f test/output
          git diff --exit-code

      - name: Upload verified Spanish APKs and size report
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-spanish-release-apks
          path: build/spanish-apk-audit/
          if-no-files-found: error
          retention-days: 14
