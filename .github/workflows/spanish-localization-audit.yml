name: Spanish localization native-language audit

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spanish-localization-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Spanish candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Validate Spanish coverage key parity and native-language gates
        run: |
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting is clean
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test
          git diff --check

      - name: Revalidate localization after formatter gate
        run: |
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Spanish UI report PDF notification backup and catalog tests
        run: |
          flutter test --reporter expanded \
            test/spanish_localization_test.dart \
            test/english_localization_test.dart \
            test/global_setup_test.dart \
            test/local_store_test.dart \
            test/csv_backup_test.dart \
            test/reminder_engine_test.dart \
            test/report_service_test.dart \
            test/pdf_report_test.dart \
            test/notification_migration_test.dart \
            test/notification_background_reliability_test.dart

      - name: Compare deterministic visual baselines
        run: flutter test test/visual_capture_test.dart

      - name: Full regression tests
        run: flutter test --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal release APK
        run: |
          mkdir -p build/spanish-apk-audit/universal
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/spanish-apk-audit/universal/mizan-global-spanish-universal.apk

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Generate APK size and hash report
        run: |
          set -euo pipefail
          mkdir -p build/spanish-apk-audit/split
          cp build/app/outputs/flutter-apk/app-*-release.apk \
            build/spanish-apk-audit/split/
          {
            echo "Audited source commit: $(git rev-parse HEAD)"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo
            echo "Exact byte sizes:"
            find build/spanish-apk-audit -type f -name '*.apk' -print0 \
              | sort -z | xargs -0 stat --printf='%n\t%s bytes\n'
            echo
            echo "Human-readable sizes:"
            du -h build/spanish-apk-audit/universal/*.apk \
              build/spanish-apk-audit/split/*.apk
            echo
            echo "SHA-256:"
            sha256sum build/spanish-apk-audit/universal/*.apk \
              build/spanish-apk-audit/split/*.apk
          } | tee build/spanish-apk-audit/apk-size-report.txt

      - name: Verify workflow stayed read-only
        run: |
          set -euo pipefail
          git restore test/output || true
          git clean -f test/output
          git diff --exit-code

      - name: Upload verified Spanish APKs and size report
        uses: actions/upload-artifact@v4
        with:
          name: mizan-global-spanish-release-apks
          path: build/spanish-apk-audit/
          if-no-files-found: error
          retention-days: 14
