name: Fix PDF interaction regression
on:
  push:
    branches:
      - agent/mizan-monetization-premium
    paths:
      - .github/workflows/fix-pdf-interaction-test.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
      - name: Apply narrow fixture correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/ui_interaction_test.dart')
          s = p.read_text()
          old = """    expect(find.byKey(const ValueKey('pdf-pro-locked')), findsOneWidget);\n    expect(find.byKey(const ValueKey('pdf-preview-button')), findsOneWidget);\n    expect(find.byKey(const ValueKey('pdf-save-enabled')), findsNothing);\n    expect(find.byKey(const ValueKey('pdf-share-enabled')), findsNothing);\n"""
          new = """    final pdfLock = find.byKey(const ValueKey('pdf-pro-locked'));\n    await tester.scrollUntilVisible(\n      pdfLock,\n      180,\n      scrollable: find.byType(Scrollable).first,\n    );\n    expect(pdfLock, findsOneWidget);\n    expect(find.byKey(const ValueKey('pdf-preview-button')), findsOneWidget);\n    expect(find.byKey(const ValueKey('pdf-save-enabled')), findsNothing);\n    expect(find.byKey(const ValueKey('pdf-share-enabled')), findsNothing);\n"""
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one PDF block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/fix-pdf-interaction-test.yml
      - name: Commit exact correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/ui_interaction_test.dart .github/workflows/fix-pdf-interaction-test.yml
          git diff --cached --check
          git commit -m "Scroll to free PDF gate in interaction regression"
          git push origin HEAD:agent/mizan-monetization-premium
