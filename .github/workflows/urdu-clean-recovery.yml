name: Urdu clean recovery and verification

on:
  push:
    branches: [agent/urdu-localization-clean]
    paths:
      - '.github/workflows/urdu-clean-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urdu-clean-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/urdu-localization-clean
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize or verify Urdu source
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .github/urdu-clean-payload ]; then
            cat .github/urdu-clean-payload/part-*.b64 | base64 --decode > "$RUNNER_TEMP/urdu_changes.tar.gz"
            echo "3a1c06e942a9967f4afa331fc1005ee847809dcd09471cd2e3a4b83ccc8b6c6e  $RUNNER_TEMP/urdu_changes.tar.gz" | sha256sum --check -
            tar -xzf "$RUNNER_TEMP/urdu_changes.tar.gz" -C .
          fi
          test -f lib/l10n/mizan_ur.dart
          test -f lib/l10n/mizan_ur_dynamic.dart
          python3 tools/audit_urdu_native_copy.py
          rm -rf .github/urdu-clean-payload
          rm -f .github/workflows/urdu-clean-materialize.yml
          rm -f .github/workflows/urdu-clean-recovery.yml
          git diff --check
      - name: Commit verified source when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(ur): materialize and verify clean Urdu source'
          git pull --rebase origin agent/urdu-localization-clean
          git push origin HEAD:agent/urdu-localization-clean
