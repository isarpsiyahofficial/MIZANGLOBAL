name: Verify locked Brazilian Portuguese localization

on:
  push:
    branches:
      - agent/brazilian-portuguese-localization
    paths:
      - .github/workflows/generate-pt-br-review-candidate.yml
      - tools/generate_pt_br_localization_draft.py
      - tools/apply_pt_br_review.py
      - tools/validate_portuguese_br_localization.py
      - tools/pt_br_review/**
      - lib/l10n/mizan_pt_br.dart
      - lib/l10n/mizan_pt_br_dynamic.dart
      - assets/data/languages_v1.json
      - assets/data/countries_v1.json
      - assets/data/currencies_v1.json
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/generate-pt-br-review-candidate.yml
      - tools/generate_pt_br_localization_draft.py
      - tools/apply_pt_br_review.py
      - tools/validate_portuguese_br_localization.py
      - tools/pt_br_review/**
      - lib/l10n/mizan_pt_br.dart
      - lib/l10n/mizan_pt_br_dynamic.dart
      - assets/data/languages_v1.json
      - assets/data/countries_v1.json
      - assets/data/currencies_v1.json

permissions:
  contents: read

concurrency:
  group: verify-locked-pt-br-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-final-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out localization source
        uses: actions/checkout@v4

      - name: Verify final reviewed localization structure
        run: python tools/generate_pt_br_localization_draft.py --verify-only

      - name: Require complete reviewed key coverage
        run: python tools/apply_pt_br_review.py --audit-only --require-complete

      - name: Validate pt-BR runtime catalogs and visible-copy purity
        run: python tools/validate_portuguese_br_localization.py

      - name: Verify fixed catalog scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              'assets/data/languages_v1.json': 29,
              'assets/data/countries_v1.json': 161,
              'assets/data/currencies_v1.json': 154,
          }
          for filename, count in expected.items():
              payload = json.loads(Path(filename).read_text(encoding='utf-8'))
              items = payload['items']
              if payload['count'] != count or len(items) != count:
                  raise SystemExit(f'Unexpected item count in {filename}')
              missing = [
                  item.get('code')
                  for item in items
                  if not str(item.get('namePtBr', '')).strip()
              ]
              if missing:
                  raise SystemExit(f'Missing namePtBr in {filename}: {missing}')
          print('Locked pt-BR catalog scope verified')
          PY

      - name: Verify source stayed read-only
        run: git diff --exit-code
