name: Generate Brazilian Portuguese review candidate

on:
  push:
    branches:
      - agent/brazilian-portuguese-localization
    paths:
      - .github/workflows/generate-pt-br-review-candidate.yml
      - tools/generate_pt_br_localization_draft.py
      - tools/generate_pt_br_catalog.py
      - lib/l10n/mizan_es.dart
      - assets/data/languages_v1.json
      - assets/data/countries_v1.json
      - assets/data/currencies_v1.json
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/generate-pt-br-review-candidate.yml
      - tools/generate_pt_br_localization_draft.py
      - tools/generate_pt_br_catalog.py
      - lib/l10n/mizan_es.dart
      - assets/data/languages_v1.json
      - assets/data/countries_v1.json
      - assets/data/currencies_v1.json

permissions:
  contents: write

concurrency:
  group: pt-br-review-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-review-data:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'generated pt-BR review data') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/brazilian-portuguese-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pt-br-opus-mt-es-pt-v1

      - name: Install deterministic generators
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'Babel>=2.15,<3' 'transformers>=4.44,<5' sentencepiece sacremoses

      - name: Generate fixed Portuguese catalog names
        run: python tools/generate_pt_br_catalog.py

      - name: Generate 791-entry Portuguese review draft
        run: python tools/generate_pt_br_localization_draft.py

      - name: Set up Dart formatter
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Format generated Dart source
        run: dart format lib/l10n/mizan_pt_br.dart

      - name: Verify formatted Portuguese map
        run: python tools/generate_pt_br_localization_draft.py --verify-only

      - name: Verify generated catalog scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              'assets/data/languages_v1.json': 29,
              'assets/data/countries_v1.json': 161,
              'assets/data/currencies_v1.json': 154,
          }
          for filename, count in expected.items():
              payload = json.loads(Path(filename).read_text(encoding='utf-8'))
              items = payload['items']
              if payload['count'] != count or len(items) != count:
                  raise SystemExit(f'Unexpected item count in {filename}')
              missing = [item.get('code') for item in items if not str(item.get('namePtBr', '')).strip()]
              if missing:
                  raise SystemExit(f'Missing namePtBr in {filename}: {missing}')
          print('pt-BR catalog generation scope verified')
          PY

      - name: Commit generated review data
        run: |
          if git diff --quiet -- lib/l10n/mizan_pt_br.dart assets/data/languages_v1.json assets/data/countries_v1.json assets/data/currencies_v1.json; then
            echo 'Generated review data is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/l10n/mizan_pt_br.dart assets/data/languages_v1.json assets/data/countries_v1.json assets/data/currencies_v1.json
          git commit -m 'build: generated pt-BR review data'
          git push origin HEAD:agent/brazilian-portuguese-localization
