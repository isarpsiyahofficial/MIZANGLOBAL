name: MIZAN five-pass exhaustive language audit

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization

permissions:
  contents: read
  statuses: write

env:
  FLUTTER_VERSION: "3.44.6"
  SOURCE_REF: ${{ github.event.pull_request.head.sha }}

concurrency:
  group: five-pass-exhaustive-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exhaustive-round:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        round: [1, 2, 3, 4, 5]
    name: exhaustive-round-${{ matrix.round }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting and static analysis
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-warnings
      - name: Native-copy, script-purity, visible-copy and structural audits
        run: |
          set -euo pipefail
          python tools/audit_chinese_native_copy.py
          python tools/audit_filipino_native_copy.py
          python tools/audit_hebrew_native_copy.py
          python tools/audit_hindi_native_copy.py
          python tools/audit_indonesian_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_urdu_native_copy.py
          python tools/audit_vietnamese_native_copy.py
          python tools/audit_visible_copy_coverage.py
          python tools/validate_project.py
      - name: 29x28 isolation, catalogs and formatters
        run: |
          set -euo pipefail
          flutter test \
            test/all_29_language_pairwise_isolation_test.dart \
            test/all_29_language_final_contract_test.dart \
            test/final_29_catalog_matrix_test.dart \
            test/final_29_locale_formatter_test.dart \
            test/final_29_full_catalog_formatter_matrix_test.dart
      - name: All five critical contracts for every locale
        shell: bash
        run: |
          set -euo pipefail
          locales=(tr en es pt-BR pt-PT fr de it nl pl ro el ru uk ar fa he hi bn ur id ms fil vi th sw zh ja ko)
          for locale in "${locales[@]}"; do
            echo "===== ROUND ${{ matrix.round }} / LOCALE $locale ====="
            flutter test \
              --dart-define=MIZAN_TEST_LOCALE="$locale" \
              test/all_29_language_deep_surface_test.dart \
              test/all_29_language_full_feature_contract_test.dart \
              test/all_29_language_legal_read_gate_test.dart \
              test/all_29_language_runtime_recovery_contract_test.dart \
              test/all_29_language_legal_resilience_test.dart
          done
      - name: Complete Flutter regression suite
        run: flutter test
      - name: Release-critical focused contracts
        run: |
          set -euo pipefail
          flutter test \
            test/monetization_contract_test.dart \
            test/legal_acceptance_contract_test.dart \
            test/reward_entitlement_binding_contract_test.dart \
            test/pdf_access_integration_contract_test.dart \
            test/backup_pro_entitlement_contract_test.dart \
            test/permanent_backup_proof_guard_test.dart \
            test/premium_screen_entitlement_visibility_test.dart \
            test/csv_merge_dialog_29_language_test.dart \
            test/backup_report_language_isolation_test.dart \
            test/global_preferences_backup_invariants_test.dart \
            test/record_currency_persistence_contract_test.dart \
            test/csv_multicurrency_identity_test.dart \
            test/csv_legacy_tr_currency_migration_test.dart \
            test/report_multicurrency_isolation_test.dart \
            test/global_release_integrity_contract_test.dart
      - name: Android source and removed-feature invariants
        run: |
          set -euo pipefail
          python3 tools/configure_android.py
          ! grep -R -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|flutterlocalnotifications' android/app/src/main android/app/build.gradle.kts
          ! grep -R -E 'play_integrity|device_identity|StandardIntegrityManager|com.google.android.play:integrity' android/app
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git diff --exit-code
      - name: Build universal and three ABI release APKs
        env:
          MIZAN_ALLOW_TEST_RELEASE: "true"
          MIZAN_TEST_ADS: "true"
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=MIZAN_TEST_ADS=true
          flutter build apk --release --split-per-abi --dart-define=MIZAN_TEST_ADS=true
          mkdir -p five-pass-apks
          cp build/app/outputs/flutter-apk/app-release.apk five-pass-apks/MIZAN-universal-round-${{ matrix.round }}.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk five-pass-apks/MIZAN-arm64-v8a-round-${{ matrix.round }}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk five-pass-apks/MIZAN-armeabi-v7a-round-${{ matrix.round }}.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk five-pass-apks/MIZAN-x86_64-round-${{ matrix.round }}.apk
          for f in five-pass-apks/*.apk; do test -s "$f"; sha256sum "$f"; done
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: mizan-five-pass-round-${{ matrix.round }}-${{ env.SOURCE_REF }}
          path: five-pass-apks/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: [exhaustive-round]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish five-pass exact-SHA status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.exhaustive-round.result }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = success ]; then
            STATE=success
            DESCRIPTION='Five complete 29-language, legal, leakage, regression and 4-APK rounds passed'
          else
            STATE=failure
            DESCRIPTION='One or more of five exhaustive multilingual audit rounds failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_REF}" -f state="$STATE" -f context='mizan-global/five-pass-exhaustive' -f description="$DESCRIPTION"
