name: Format current MIZAN product branch

on:
  push:
    branches:
      - agent/mizan-monetization-premium

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"

concurrency:
  group: format-current-product
  cancel-in-progress: true

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Format Dart product sources
        run: dart format lib test
      - name: Commit only formatter changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'format MIZAN product Dart sources'
          git push origin HEAD:agent/mizan-monetization-premium
