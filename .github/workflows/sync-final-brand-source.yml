name: Sync exact final LP brand source

on:
  push:
    branches:
      - agent/mizan-production-release-20260905
    paths:
      - .github/workflows/sync-final-brand-source.yml

permissions:
  contents: write

env:
  FINAL_LOGO_PIXEL_SHA256: "59e6bc2a19714a9761cff46582b801b87136369f98ff9be215da4c24823748de"

jobs:
  sync-brand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: agent/mizan-production-release-20260905
          fetch-depth: 0

      - name: Fetch exact final master from temporary private brand transfer
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F033aeb72-735d-4621-b813-aea269ccb1ba/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHsrA0uvH4mewDRAnA-ygZY3RPEnizk7JZdB34_hqyX6&exp=1788611220&osig=AAAAAAAAAAAAAAAAAAAAAFZk8_1L3uBx5W0wTZEOEy2oTeCCl9D2zMkWF7pFu83z&signer=media-rpc&x-canva-quality=thumbnail'
          BIG="${BASE/height:200/height:2048}"
          BIG="${BIG/width:200/width:2048}"
          BIG="${BIG/&x-canva-quality=thumbnail/}"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 "$BIG" --output "$RUNNER_TEMP/final-lp-source.png"
          test -s "$RUNNER_TEMP/final-lp-source.png"

      - name: Verify exact pixels and create responsive adaptive foreground
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image
          import os

          source_path = Path(os.environ['RUNNER_TEMP']) / 'final-lp-source.png'
          master_path = Path('assets/brand/lefferion-prime-logo-v3.png')
          foreground_path = Path('assets/brand/lefferion-prime-logo-v3-foreground.png')
          expected = os.environ['FINAL_LOGO_PIXEL_SHA256']

          with Image.open(source_path) as image:
              master = image.convert('RGBA')
          if master.size != (2048, 2048):
              raise SystemExit(f'wrong final logo dimensions: {master.size}')
          actual = sha256(master.tobytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'final logo pixel mismatch: {actual}')

          master_path.parent.mkdir(parents=True, exist_ok=True)
          master.save(master_path, format='PNG', optimize=True, compress_level=9)

          scale = 0.65
          side = round(2048 * scale)
          resized = master.resize((side, side), Image.Resampling.LANCZOS)
          foreground = Image.new('RGBA', (2048, 2048), (0, 0, 0, 0))
          offset = ((2048 - side) // 2, (2048 - side) // 2)
          foreground.alpha_composite(resized, offset)
          bbox = foreground.getchannel('A').getbbox()
          if bbox is None:
              raise SystemExit('generated adaptive foreground is empty')
          bw = bbox[2] - bbox[0]
          bh = bbox[3] - bbox[1]
          if bw / 2048 > 0.62 or bh / 2048 > 0.62:
              raise SystemExit(f'adaptive foreground outside safe bounds: {bbox}')
          foreground.save(foreground_path, format='PNG', optimize=True, compress_level=9)

          with Image.open(master_path) as check:
              check_hash = sha256(check.convert('RGBA').tobytes()).hexdigest()
          if check_hash != expected:
              raise SystemExit('saved master changed final logo pixels')
          print('master_pixel_sha256=' + check_hash)
          print('adaptive_alpha_bbox=' + repr(bbox))
          PY

      - name: Commit exact master and responsive launcher foreground
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LEFFERION PRIME Release Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git rm .github/workflows/sync-final-brand-source.yml
          git add assets/brand/lefferion-prime-logo-v3.png assets/brand/lefferion-prime-logo-v3-foreground.png
          git diff --cached --stat
          git commit -m 'brand: sync exact final LP master and responsive launcher source'
          git push origin HEAD:agent/mizan-production-release-20260905
