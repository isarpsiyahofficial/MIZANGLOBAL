name: Restore PRO notification preferences

on:
  push:
    branches:
      - agent/mizan-monetization-premium
  pull_request:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore persisted PRO notification preference controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller_path = Path('lib/controllers/mizan_controller.dart')
          controller = controller_path.read_text(encoding='utf-8')
          controller_anchor = "  Future<void> addPerson(String name) async {\n"
          controller_block = """  Future<void> updateNotificationsEnabled(bool enabled) async {
            await _commit(_state.copyWith(notificationsEnabled: enabled));
          }

          Future<void> updatePaymentReminderFrequency(
            PaymentReminderFrequency frequency,
          ) async {
            await _commit(_state.copyWith(paymentReminderFrequency: frequency));
          }

          Future<void> updateNotificationSoundMode(
            NotificationSoundMode soundMode,
          ) async {
            await _commit(
              _state.copyWith(
                notificationSoundMode: soundMode,
                notificationVibrationEnabled:
                    soundMode == NotificationSoundMode.silent
                    ? false
                    : _state.notificationVibrationEnabled,
              ),
            );
          }

          Future<void> updateNotificationVibrationEnabled(bool enabled) async {
            await _commit(
              _state.copyWith(notificationVibrationEnabled: enabled),
            );
          }

          """
          if 'Future<void> updateNotificationsEnabled(' not in controller:
              if controller_anchor not in controller:
                  raise SystemExit('Controller insertion anchor not found')
              controller = controller.replace(
                  controller_anchor,
                  controller_block + controller_anchor,
                  1,
              )
              controller_path.write_text(controller, encoding='utf-8')

          settings_path = Path('lib/screens/settings_screen.dart')
          settings = settings_path.read_text(encoding='utf-8')
          import_anchor = "import '../monetization/pro_branding.dart';\n"
          model_import = "import '../models/mizan_models.dart';\n"
          if model_import not in settings:
              if import_anchor not in settings:
                  raise SystemExit('Settings import anchor not found')
              settings = settings.replace(
                  import_anchor,
                  import_anchor + model_import,
                  1,
              )

          section_anchor = """        ],
        const SizedBox(height: 18),
        if (catalog case final globalCatalog?) ...[
          _SettingsSection(
"""
          section_replacement = """        ],
        if (monetization?.isPremium ?? false) ...[
          const SizedBox(height: 16),
          _SettingsSection(
            title: 'Ödeme hatırlatmaları',
            subtitle: 'Günlük gider hatırlatmaları',
            child: Column(
              children: [
                SwitchListTile.adaptive(
                  key: const ValueKey('pro-notifications-enabled'),
                  contentPadding: EdgeInsets.zero,
                  title: const Text('Ödeme hatırlatmaları'),
                  subtitle: Text(
                    state.notificationsEnabled ? 'Aktif' : 'Pasif',
                  ),
                  value: state.notificationsEnabled,
                  onChanged: controller.isBusy
                      ? null
                      : (value) =>
                            controller.updateNotificationsEnabled(value),
                ),
                const SizedBox(height: 8),
                DropdownButtonFormField<PaymentReminderFrequency>(
                  key: const ValueKey('pro-payment-reminder-frequency'),
                  initialValue: state.paymentReminderFrequency,
                  decoration: localizedInputDecoration(
                    const InputDecoration(labelText: 'Ödeme hatırlatmaları'),
                  ),
                  items: PaymentReminderFrequency.values
                      .map(
                        (item) => DropdownMenuItem<PaymentReminderFrequency>(
                          value: item,
                          child: Text.user(item.label),
                        ),
                      )
                      .toList(growable: false),
                  onChanged: controller.isBusy
                      ? null
                      : (value) {
                          if (value != null) {
                            controller.updatePaymentReminderFrequency(value);
                          }
                        },
                ),
                const SizedBox(height: 12),
                DropdownButtonFormField<NotificationSoundMode>(
                  key: const ValueKey('pro-notification-sound-mode'),
                  initialValue: state.notificationSoundMode,
                  decoration: localizedInputDecoration(
                    const InputDecoration(labelText: 'Bildirim sesi'),
                  ),
                  items: NotificationSoundMode.values
                      .map(
                        (item) => DropdownMenuItem<NotificationSoundMode>(
                          value: item,
                          child: Text.user(item.label),
                        ),
                      )
                      .toList(growable: false),
                  onChanged: controller.isBusy
                      ? null
                      : (value) {
                          if (value != null) {
                            controller.updateNotificationSoundMode(value);
                          }
                        },
                ),
                SwitchListTile.adaptive(
                  key: const ValueKey('pro-notification-vibration'),
                  contentPadding: EdgeInsets.zero,
                  title: const Text('Titreşim'),
                  subtitle: Text(
                    state.notificationVibrationEnabled
                        ? 'Titreşim açık'
                        : 'Titreşim kapalı',
                  ),
                  value: state.notificationVibrationEnabled,
                  onChanged:
                      controller.isBusy ||
                          state.notificationSoundMode ==
                              NotificationSoundMode.silent
                      ? null
                      : (value) => controller
                            .updateNotificationVibrationEnabled(value),
                ),
              ],
            ),
          ),
        ],
        const SizedBox(height: 18),
        if (catalog case final globalCatalog?) ...[
          _SettingsSection(
"""
          if "ValueKey('pro-notifications-enabled')" not in settings:
              if section_anchor not in settings:
                  raise SystemExit('Settings section anchor not found')
              settings = settings.replace(
                  section_anchor,
                  section_replacement,
                  1,
              )
              settings_path.write_text(settings, encoding='utf-8')
          PY
          dart format lib/controllers/mizan_controller.dart lib/screens/settings_screen.dart
      - name: Commit restored controls and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controllers/mizan_controller.dart lib/screens/settings_screen.dart
          git rm .github/workflows/restore-notification-preferences.yml
          git commit -m "Restore PRO notification preference controls"
          git push origin HEAD:agent/mizan-monetization-premium
