name: Materialize second native European Portuguese review

# Re-run whenever the independent native-review layer changes.
on:
  push:
    branches:
      - agent/european-portuguese-localization
    paths:
      - .github/workflows/pt-pt-native-review-round2.yml
      - tools/patch_pt_pt_native_review_round2.py

permissions:
  contents: write

concurrency:
  group: pt-pt-native-review-round2
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'materialize second native pt-PT review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out European Portuguese branch
        uses: actions/checkout@v4
        with:
          ref: agent/european-portuguese-localization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic catalog dependency
        run: python -m pip install 'Babel>=2.15,<3'

      - name: Reapply first native-safe builder layer
        run: python tools/patch_pt_pt_builder.py

      - name: Apply second independent native review layer
        run: python tools/patch_pt_pt_native_review_round2.py

      - name: Materialize reviewed European Portuguese product source
        run: python tools/build_pt_pt_locale.py

      - name: Patch multilingual validators and earlier locale expectations
        run: python tools/patch_pt_pt_validators.py

      - name: Set up Dart formatter
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Format deterministic sources
        run: |
          dart format \
            lib/l10n/mizan_pt_pt.dart \
            lib/l10n/mizan_pt_pt_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/main.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            test/english_localization_test.dart \
            test/spanish_localization_test.dart \
            test/portuguese_br_localization_test.dart \
            test/portuguese_pt_localization_test.dart \
            test/portuguese_pt_picker_purity_test.dart \
            test/portuguese_pt_end_to_end_test.dart

      - name: Require all native-level gates
        run: python tools/build_pt_pt_locale.py --verify

      - name: Commit second reviewed product source
        run: |
          if git diff --quiet; then
            echo 'Second reviewed pt-PT product source is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/build_pt_pt_locale.py \
            assets/data/languages_v1.json \
            assets/data/countries_v1.json \
            assets/data/currencies_v1.json \
            lib/l10n/mizan_pt_pt.dart \
            lib/l10n/mizan_pt_pt_dynamic.dart \
            lib/l10n/mizan_i18n.dart \
            lib/main.dart \
            lib/global/global_catalog.dart \
            lib/core/formatters.dart \
            test/english_localization_test.dart \
            test/spanish_localization_test.dart \
            test/portuguese_br_localization_test.dart \
            test/portuguese_pt_localization_test.dart \
            test/portuguese_pt_picker_purity_test.dart \
            test/portuguese_pt_end_to_end_test.dart \
            tools/validate_english_localization.py \
            tools/validate_spanish_localization.py \
            tools/validate_portuguese_br_localization.py
          git commit -m 'l10n: materialize second native pt-PT review'
          git push origin HEAD:agent/european-portuguese-localization
