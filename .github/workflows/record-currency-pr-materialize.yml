name: Record currency PR materialization fallback

on:
  pull_request:
    branches: [agent/mizanglobal-globalization]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: record-currency-pr-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'agent/chinese-localization'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - id: guard
        shell: bash
        run: |
          if [ -f tools/materialize_record_currency_models.py ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize, format, and compile-check model migration
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/materialize_record_currency_models.py
          python tools/materialize_record_currency_models.py
          dart format lib/models/mizan_models.dart
          flutter pub get
          flutter analyze
          flutter test test/record_currency_persistence_contract_test.dart
      - name: Commit and self-clean both materializers
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize_record_currency_models.py
          rm -f .github/workflows/record-currency-model-materialize.yml
          rm -f .github/workflows/record-currency-pr-materialize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(currency): persist record-level ISO currency identities'
          git push origin HEAD:agent/chinese-localization
