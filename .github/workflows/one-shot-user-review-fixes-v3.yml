name: One-shot user review fixes v3

on:
  push:
    branches:
      - agent/chinese-localization
    paths:
      - '.github/workflows/one-shot-user-review-fixes-v3.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/chinese-localization
          fetch-depth: 0

      - name: Reconstruct verified reviewed product patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/tmp/user-review-fix-01.b64 \
            .github/tmp/user-review-fix-02.b64 \
            .github/tmp/user-review-fix-03.b64 \
            .github/tmp/user-review-fix-04.b64 \
            .github/tmp/user-review-fix-05.b64 \
            .github/tmp/user-review-fix-06.b64 \
            .github/tmp/user-review-fix-07.b64 > /tmp/mizan-fix.b64
          test "$(wc -c < /tmp/mizan-fix.b64 | tr -d ' ')" = "44760"
          echo 'bcf371690d363e4b4c5d0e5b35a53c551cb05da9587936773c16810aca05b21f  /tmp/mizan-fix.b64' | sha256sum -c -
          base64 -d /tmp/mizan-fix.b64 | gzip -dc > /tmp/mizan-fix.patch
          echo '05146b4a175166a515aeb92112a27b8b32893aac69f4d480d93ed66134573b71  /tmp/mizan-fix.patch' | sha256sum -c -
          git apply --check /tmp/mizan-fix.patch
          git apply /tmp/mizan-fix.patch

      - name: Remove post-notification dead code and stale UI expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/screens/settings_screen.dart')
          s = p.read_text()
          s = s.replace("import '../core/formatters.dart';\n", '')
          s = s.replace("\n  static String? _requiredValidator(String? value) =>\n      value == null || value.trim().isEmpty ? 'Bu alan boş bırakılamaz.' : null;\n", '\n')
          s = s.replace('    this.color = MizanTheme.blue,\n', '')
          s = s.replace('  final Color color;\n', '')
          s = s.replace('color.withValues(alpha: .06)', 'MizanTheme.blue.withValues(alpha: .06)')
          s = s.replace('color.withValues(alpha: .22)', 'MizanTheme.blue.withValues(alpha: .22)')
          s = s.replace('Icon(icon, color: color)', 'Icon(icon, color: MizanTheme.blue)')
          p.write_text(s)

          p = Path('test/manual_overdue_edit_confirmation_test.dart')
          s = p.read_text().replace(
              'bildirim, rapor ve ödeme hesaplarını yeniden hesaplayacaktır',
              'rapor ve ödeme hesaplarını yeniden hesaplayacaktır',
          )
          p.write_text(s)

          p = Path('test/ui_interaction_test.dart')
          s = p.read_text()
          s = s.replace("expect(find.text('Faturalar'), findsOneWidget);", "expect(find.text('Fatura'), findsOneWidget);")
          s = s.replace("      'Faturalar',", "      'Fatura',")
          s = s.replace("await _scrollTap(tester, 'Faturalar');", "await _scrollTap(tester, 'Fatura');")
          old = """    expect(find.text('Bildirim sistemi'), findsOneWidget);
    expect(find.text('Otomatik senkronizasyon'), findsOneWidget);
    final notificationSlots = find.textContaining('özel bildirim saati');
    await tester.scrollUntilVisible(
      notificationSlots,
      220,
      scrollable: find.byType(Scrollable).first,
    );
    expect(notificationSlots, findsOneWidget);
    expect(find.text('Ses ve titreşim'), findsOneWidget);
"""
          new = """    expect(find.text('Bildirim sistemi'), findsNothing);
    expect(find.text('Otomatik senkronizasyon'), findsNothing);
    expect(find.textContaining('özel bildirim saati'), findsNothing);
    expect(find.text('Ses ve titreşim'), findsNothing);
"""
          if old not in s:
              raise SystemExit('settings notification block not found')
          s = s.replace(old, new)
          start = s.index("  testWidgets('Bildirim ayarları özet ve ayrıntı olarak açık biçimde ayrılır'")
          end = s.index("\n  });\n}", start) + len("\n  });")
          replacement = """  testWidgets('shipping ayarlarında bildirim sistemi tamamen yoktur', (
    tester,
  ) async {
    await _pump(tester, comprehensiveState(reference: DateTime.now()));
    await _tapNavigation(tester, Icons.settings_outlined);

    for (final removedCopy in const [
      'Bildirim sistemi',
      'Bildirim izni',
      'Dakik bildirim izni',
      'Planlanan bildirim',
      'Otomatik senkronizasyon',
      'Bildirimleri yeniden planla',
      'Bildirim izinlerini aç',
      'Dakik bildirim iznini aç',
      'Ödeme hatırlatması 1',
      'Hatırlatmayı düzenle',
      '1 dakika sonra test bildirimi',
      'Ses ve titreşim',
    ]) {
      expect(find.text(removedCopy), findsNothing, reason: removedCopy);
    }
    expect(find.text('Anlık yerel kayıt'), findsOneWidget);
    expect(tester.takeException(), isNull);
  });"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          p = Path('test/responsive_test.dart')
          s = p.read_text()
          start = s.index("  testWidgets('320x568 bildirim ayrıntısı taşmasız açılır'")
          end = s.index("\n  });\n}", start) + len("\n  });")
          replacement = """  testWidgets('320x568 bildirimsiz ayarlar taşmasız açılır', (tester) async {
    await _pumpAt(tester, const Size(320, 568));
    final bar = find.byType(NavigationBar);
    final rail = find.byType(NavigationRail);
    final root = bar.evaluate().isNotEmpty ? bar : rail;
    await tester.tap(
      find.descendant(of: root, matching: find.byIcon(Icons.settings_outlined)),
    );
    await tester.pumpAndSettle();

    expect(find.text('Bildirim sistemi'), findsNothing);
    expect(find.text('Ödeme hatırlatması 1'), findsNothing);
    expect(find.text('Hatırlatmayı düzenle'), findsNothing);
    expect(find.text('Anlık yerel kayıt'), findsOneWidget);
    expect(tester.takeException(), isNull);
  });"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test

      - name: Verify static and targeted product gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_visible_copy_coverage.py
          python3 tools/validate_project.py
          flutter analyze --fatal-warnings
          flutter test test/global_release_integrity_contract_test.dart
          flutter test test/manual_overdue_edit_confirmation_test.dart
          flutter test test/ui_interaction_test.dart
          flutter test test/responsive_test.dart

      - name: Refresh intentional visual baselines
        shell: bash
        run: |
          set -euo pipefail
          flutter test --update-goldens test/visual_capture_test.dart
          flutter test test/visual_capture_test.dart

      - name: Run full Flutter regression
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Generate deterministic notification-free Android and reverify
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create . --platforms=android --org com.lefferionprime --project-name lefferion_prime_mizan
          python3 tools/configure_android.py
          flutter pub get
          test "$(grep -c 'applicationId = "com.lefferionprime.mizanglobal"' android/app/build.gradle.kts)" -eq 1
          test "$(grep -c 'namespace = "com.lefferionprime.mizanglobal"' android/app/build.gradle.kts)" -eq 1
          if rg -n 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|flutterlocalnotifications|FlutterLocalNotifications|flutter_timezone' android lib/main.dart lib/controllers/mizan_controller.dart lib/screens/settings_screen.dart pubspec.yaml; then
            echo 'Notification shipping capability still present' >&2
            exit 1
          fi
          python3 tools/audit_visible_copy_coverage.py
          python3 tools/validate_project.py
          flutter analyze --fatal-warnings
          flutter test test/global_release_integrity_contract_test.dart
          git diff --check

      - name: Commit verified permanent product changes only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-user-review-fixes.yml
          rm -f .github/workflows/one-shot-user-review-fixes-v2.yml
          rm -f .github/workflows/one-shot-user-review-fixes-v3.yml
          rm -f .github/tmp/user-review-fix-01.b64 \
                .github/tmp/user-review-fix-02.b64 \
                .github/tmp/user-review-fix-03.b64 \
                .github/tmp/user-review-fix-04.b64 \
                .github/tmp/user-review-fix-05.b64 \
                .github/tmp/user-review-fix-06.b64 \
                .github/tmp/user-review-fix-07.b64
          rmdir .github/tmp 2>/dev/null || true
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove unreliable notifications and close locale currency leaks'
          git push origin HEAD:agent/chinese-localization
