name: MIZAN 29-language 2000-per-function stress and integrity

on:
  push:
    branches:
      - agent/mizan-monetization-premium
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"
  SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: locale-stress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locale-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        locale: [tr, en, es, pt-BR, pt-PT, fr, de, it, nl, pl, ro, el, ru, uk, ar, fa, he, hi, bn, ur, id, ms, fil, vi, th, sw, zh, ja, ko]
    name: stress-${{ matrix.locale }}-96000-plus-5537
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run 5537 deterministic localization scenarios
        run: flutter test --dart-define=MIZAN_TEST_LOCALE=${{ matrix.locale }} test/all_29_language_5000_scenario_stress_test.dart
      - name: Run 2000 scenarios for every public function
        run: >-
          flutter test
          --dart-define=MIZAN_TEST_LOCALE=${{ matrix.locale }}
          --dart-define=MIZAN_RUN_2000_FUNCTION_STRESS=true
          test/all_29_language_2000_per_function_stress_test.dart
      - name: Verify source stayed exact
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git diff --exit-code

  application-integrity:
    needs: locale-stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: exact-SHA-application-integrity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format integrity
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis integrity
        run: flutter analyze --fatal-warnings
      - name: Structural requirements integrity
        run: python3 tools/validate_project.py
      - name: Visible copy and localization integrity
        run: python3 tools/audit_visible_copy_coverage.py
      - name: Render current release visual contract
        env:
          MIZAN_CAPTURE_PERSON_DETAILS_GOLDEN: "true"
        run: flutter test --update-goldens test/visual_capture_test.dart
      - name: Verify release-critical visual fingerprints
        run: |
          set -euo pipefail
          echo "d54acc7bc901d23568bfc04b8e03e50b51faa840f8fdbfe55011aeffa0f8e7e3  test/goldens/06-person-details.png" | sha256sum -c -
          echo "ed364838973351528bc2e25c9c1a4c6d50a0a6471eb2abe5f4b0a8dcc0d5d906  test/goldens/09-reports-simple.png" | sha256sum -c -
      - name: Full unit storage CSV responsive and feature regression
        run: flutter test --reporter expanded
      - name: Restore generated visual baselines
        run: git restore test/goldens
      - name: Verify source stayed exact
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git diff --exit-code
