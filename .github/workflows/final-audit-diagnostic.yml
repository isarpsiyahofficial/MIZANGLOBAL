name: MIZAN final audit diagnostic

on:
  push:
    branches:
      - agent/mizan-monetization-premium
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  diagnose-final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Final serverless contract
        run: |
          set -euo pipefail
          test ! -e backend/monetization-worker
          test ! -e lib/monetization/monetization_api.dart
          test ! -e lib/services/notification_service.dart
          test ! -e lib/services/premium_notification_coordinator.dart
          ! grep -E 'flutter_local_notifications|flutter_timezone' pubspec.yaml
      - name: Formatting gate
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --fatal-warnings
      - name: Native-copy audits
        run: |
          set -euo pipefail
          python tools/audit_chinese_native_copy.py
          python tools/audit_filipino_native_copy.py
          python tools/audit_hebrew_native_copy.py
          python tools/audit_hindi_native_copy.py
          python tools/audit_indonesian_native_copy.py
          python tools/audit_japanese_native_copy.py
          python tools/audit_korean_native_copy.py
          python tools/audit_urdu_native_copy.py
          python tools/audit_vietnamese_native_copy.py
      - name: Structural validation
        run: python tools/validate_project.py
      - name: Visible-copy coverage
        run: python tools/audit_visible_copy_coverage.py
      - name: Render release visual contract
        env:
          MIZAN_CAPTURE_PERSON_DETAILS_GOLDEN: "true"
        run: flutter test --update-goldens test/visual_capture_test.dart
      - name: Verify visual fingerprints
        run: |
          set -euo pipefail
          echo "d54acc7bc901d23568bfc04b8e03e50b51faa840f8fdbfe55011aeffa0f8e7e3  test/goldens/06-person-details.png" | sha256sum -c -
          echo "036c15edfa6f3177661cad7ee3f9737dbafa45ce12b292c1f86581b35301a0dc  test/goldens/09-reports-simple.png" | sha256sum -c -
      - name: Full Flutter regression
        run: flutter test
      - name: Restore generated visual baselines
        run: git restore test/goldens
      - name: Independent release-critical contracts
        run: |
          set -euo pipefail
          flutter test test/monetization_contract_test.dart
          flutter test test/legal_acceptance_contract_test.dart
          flutter test test/legal_monetization_gate_contract_test.dart
          flutter test test/all_29_language_full_feature_contract_test.dart
          flutter test test/all_29_language_legal_read_gate_test.dart
          flutter test test/all_29_language_runtime_recovery_contract_test.dart
          flutter test test/all_29_language_legal_resilience_test.dart
          flutter test test/all_29_language_premium_surface_test.dart
          flutter test test/reward_entitlement_binding_contract_test.dart
          flutter test test/pdf_access_integration_contract_test.dart
          flutter test test/backup_pro_entitlement_contract_test.dart
          flutter test test/permanent_backup_proof_guard_test.dart
          flutter test test/premium_screen_entitlement_visibility_test.dart
          flutter test test/csv_merge_dialog_29_language_test.dart
          flutter test test/notification_release_disabled_contract_test.dart
          flutter test test/source_hygiene_contract_test.dart
          flutter test test/backup_report_language_isolation_test.dart
          flutter test test/all_29_language_pairwise_isolation_test.dart
          flutter test test/all_29_language_final_contract_test.dart
          flutter test test/final_29_catalog_matrix_test.dart
          flutter test test/final_29_locale_formatter_test.dart
          flutter test test/final_29_full_catalog_formatter_matrix_test.dart
          flutter test test/global_preferences_backup_invariants_test.dart
          flutter test test/record_currency_persistence_contract_test.dart
          flutter test test/csv_multicurrency_identity_test.dart
          flutter test test/csv_legacy_tr_currency_migration_test.dart
          flutter test test/report_multicurrency_isolation_test.dart
          flutter test test/global_release_integrity_contract_test.dart
      - name: Verify Android integration
        run: |
          set -euo pipefail
          python3 tools/configure_android.py
          grep -q 'class MainActivity : FlutterActivity()' android/app/src/main/kotlin/com/lefferionprime/mizanglobal/MainActivity.kt
          ! grep -R -E 'POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|flutterlocalnotifications|FlutterLocalNotifications|FlutterTimezone' android/app/src/main android/app/build.gradle.kts
          git diff --exit-code
      - name: Regenerate launcher icons
        run: dart run flutter_launcher_icons
      - name: Build universal release APK
        env:
          MIZAN_ALLOW_TEST_RELEASE: "true"
          MIZAN_TEST_ADS: "true"
        run: flutter build apk --release --dart-define=MIZAN_TEST_ADS=true
      - name: Build split release APKs
        env:
          MIZAN_ALLOW_TEST_RELEASE: "true"
          MIZAN_TEST_ADS: "true"
        run: flutter build apk --release --split-per-abi --dart-define=MIZAN_TEST_ADS=true
      - name: Verify four APK outputs
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
          sha256sum build/app/outputs/flutter-apk/*.apk
