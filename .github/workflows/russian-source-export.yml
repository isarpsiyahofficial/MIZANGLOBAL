name: Russian localization source export

on:
  push:
    branches:
      - agent/russian-localization
    paths:
      - .github/workflows/russian-source-export.yml
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/russian-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete Russian review candidate
        uses: actions/checkout@v4
        with:
          ref: agent/russian-localization
          fetch-depth: 0

      - name: Record exact candidate source identity
        run: |
          mkdir -p build/russian-source-export
          git rev-parse HEAD > build/russian-source-export/HEAD.txt
          git status --porcelain > build/russian-source-export/worktree.txt
          test ! -s build/russian-source-export/worktree.txt

      - name: Package candidate source tree
        run: |
          git archive --format=tar.gz --output=build/russian-source-export/mizan-russian-source.tar.gz HEAD
          sha256sum build/russian-source-export/mizan-russian-source.tar.gz > build/russian-source-export/SHA256SUMS.txt

      - name: Upload candidate source export
        uses: actions/upload-artifact@v4
        with:
          name: mizan-russian-source-export
          path: build/russian-source-export
          if-no-files-found: error
          retention-days: 7
