name: Apply Spanish user-data preservation fix

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-spanish-userdata-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Spanish candidate
        uses: actions/checkout@v5
        with:
          ref: agent/spanish-localization-candidate
          fetch-depth: 0

      - name: Apply SHA-verified user-data fix
        run: |
          set -euo pipefail
          if grep -q "Spanish localized text preserves user data matching a country name" test/spanish_localization_test.dart; then
            echo "Spanish user-data fix is already materialized."
            exit 0
          fi
          git fetch origin agent/spanish-localization-transfer
          git show origin/agent/spanish-localization-transfer:transfer/spanish/v4/spanish-userdata.patch > /tmp/spanish-userdata.patch
          echo "fc70b32d13d70e56763d41a4f032daa5d645849875b7c4b6a228d1c341936a5c  /tmp/spanish-userdata.patch" | sha256sum -c -
          git apply --check /tmp/spanish-userdata.patch
          git apply /tmp/spanish-userdata.patch
          test "$(git rev-parse origin/agent/spanish-localization-transfer:transfer/spanish/v5/spanish-userdata-expectation.patch)" = "42d8ff91e8117b0b758bf3a13949eee8d0ee60dc"
          git show origin/agent/spanish-localization-transfer:transfer/spanish/v5/spanish-userdata-expectation.patch > /tmp/spanish-userdata-expectation.patch
          git apply --check /tmp/spanish-userdata-expectation.patch
          git apply /tmp/spanish-userdata-expectation.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify fix
        run: |
          flutter pub get
          dart format lib/screens/reports_screen.dart test/spanish_localization_test.dart
          python3 tools/validate_english_localization.py
          python3 tools/validate_spanish_localization.py
          flutter analyze --fatal-warnings
          flutter test --reporter expanded test/spanish_localization_test.dart test/english_localization_test.dart test/report_service_test.dart test/pdf_report_test.dart

      - name: Commit verified source fix
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git restore test/output || true
          git config user.name "MIZAN Spanish Localization"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/reports_screen.dart test/spanish_localization_test.dart
          if git diff --cached --quiet; then
            echo "No user-data source changes to commit."
            exit 0
          fi
          git commit -m "fix: preserve Spanish user-authored report text"
          git push origin "HEAD:${HEAD_BRANCH}"
