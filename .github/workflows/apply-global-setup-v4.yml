name: Apply verified MIZAN GLOBAL setup v4

on:
  push:
    branches:
      - agent/mizanglobal-global-setup-transfer
    paths:
      - transfer/v4/**
      - .github/workflows/apply-global-setup-v4.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v5
        with:
          ref: agent/mizanglobal-globalization
          fetch-depth: 0

      - name: Reconstruct and verify complete patch
        run: |
          set -euo pipefail
          git fetch origin agent/mizanglobal-global-setup-transfer
          : > /tmp/global_setup.b64
          for n in 01 02 03 04 05 06 07 08; do
            git show "origin/agent/mizanglobal-global-setup-transfer:transfer/v4/global_setup.part${n}" >> /tmp/global_setup.b64
          done
          tr -d '\r\n\t ' < /tmp/global_setup.b64 > /tmp/global_setup.compact.b64
          base64 --decode /tmp/global_setup.compact.b64 > /tmp/global_setup.patch.gz
          echo "7210f70e8e6667b37fb27f655e91ac18f2a0ec86b9b8c71181f7e2c518c55135  /tmp/global_setup.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/global_setup.patch.gz > /tmp/global_setup.patch
          echo "92666f10abc2fe98158b98f27323a14b64202223ed0d322d1d2ae715fecd309f  /tmp/global_setup.patch" | sha256sum -c -
          git apply --check /tmp/global_setup.patch
          git apply /tmp/global_setup.patch

      - name: Validate project structure and catalogs
        run: python3 tools/validate_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart sources
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Global setup and backup compatibility tests
        run: flutter test --reporter expanded test/global_setup_test.dart test/local_store_test.dart test/csv_backup_test.dart

      - name: Commit verified integration
        run: |
          set -euo pipefail
          git config user.name "MIZAN Global Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add searchable global first-run profile"
          git push origin HEAD:agent/mizanglobal-globalization
