name: Apply PDF access UI patch

on:
  push:
    branches:
      - agent/mizan-monetization-premium
    paths:
      - .github/workflows/apply-pdf-access-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mizan-monetization-premium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python tools/apply_pdf_access_ui_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate PRO-gated PDF preview UI"
          git push origin HEAD:agent/mizan-monetization-premium
