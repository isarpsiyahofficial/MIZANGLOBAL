name: Bengali localization start contract

on:
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - 'docs/localization/bengali-quality-contract.md'
      - 'tools/bengali_terminology.py'
      - 'test/bengali_localization_contract_test.dart'
      - '.github/workflows/bengali-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-start-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: '3.44.0'
    steps:
      - name: Check out Bengali candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Bengali terminology source
        run: |
          set -euo pipefail
          python -m py_compile tools/bengali_terminology.py
          python - <<'PY'
          from tools.bengali_terminology import (
              BENGALI_ALLOWED_LATIN_TERMS,
              BENGALI_FORBIDDEN_COPY,
              BENGALI_FORBIDDEN_INVISIBLE,
              BENGALI_TERMINOLOGY,
          )

          assert len(BENGALI_TERMINOLOGY) >= 180
          assert BENGALI_TERMINOLOGY['Kalan ödeme yükü'] == 'অবশিষ্ট পরিশোধের দায়'
          assert BENGALI_TERMINOLOGY['Gecikmiş ödeme yükü'] == 'মেয়াদোত্তীর্ণ পরিশোধের দায়'
          assert BENGALI_TERMINOLOGY['Yaklaşan ödeme yükü'] == 'আসন্ন পরিশোধের দায়'
          assert 'বাকি পরিশোধের দায়' in BENGALI_FORBIDDEN_COPY
          assert BENGALI_FORBIDDEN_INVISIBLE
          assert 'PDF' in BENGALI_ALLOWED_LATIN_TERMS
          print(f'Bengali terminology start contract passed: {len(BENGALI_TERMINOLOGY)} binding terms.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Dart contract test
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed test/bengali_localization_contract_test.dart
          flutter test --reporter expanded test/bengali_localization_contract_test.dart
          git diff --check
          test -z "$(git status --porcelain)"
