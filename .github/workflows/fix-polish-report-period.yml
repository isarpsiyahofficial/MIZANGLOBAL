name: Fix Polish report period label

on:
  push:
    branches:
      - agent/polish-localization
    paths:
      - .github/workflows/fix-polish-report-period.yml
      - tools/fix_polish_report_period.py
  pull_request:
    branches:
      - agent/mizanglobal-globalization
    paths:
      - .github/workflows/fix-polish-report-period.yml
      - tools/fix_polish_report_period.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Polish localization branch
        uses: actions/checkout@v4
        with:
          ref: agent/polish-localization
          fetch-depth: 0

      - name: Apply Polish report-period correction
        run: python tools/fix_polish_report_period.py

      - name: Commit corrected Polish report label
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/l10n/pl/mizan_pl_core.dart
          if git diff --cached --quiet; then
            echo 'Polish report-period label is already corrected.'
          else
            git commit -m 'fix(pl): use native monthly report label'
            git pull --rebase origin agent/polish-localization
            git push origin HEAD:agent/polish-localization
          fi
